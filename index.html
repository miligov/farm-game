function hit(x,y,cx,cy,r){
  var dx=x-cx,dy=y-cy;
  return dx*dx+dy*dy<=r*r;
}
function onTap(x,y){
  if(modalOpen||PWID.paused)return;
  audioWake();

  /* тап по воздушному шару с подарком */
  if(G.balloon&&G.balloon.active){
    var by=G.balloon.y + Math.sin(G.balloon.t*2)*4;
    if(hit(x,y,G.balloon.x,by+14,32)){
      sfx('done');haptic('medium');
      burstXY(G.balloon.x,by+14,'#ffd964',16);
      
      var rnd=Math.random();
      if(rnd<0.45){
        var m=Math.round((150+P.lvl*40)*eraCoinMult()*boostMult());
        P.coins+=m;P.totalCoins+=m;
        popText(G.balloon.x,by-8,'🎁 +'+m+' 💰','#c47b06');
      }else if(rnd<0.75){
        var xp=Math.round(40+P.lvl*15);
        addXp(xp);
        popText(G.balloon.x,by-8,'🎁 +'+xp+' ⭐','#2980b9');
      }else{
        barnAdd('wheat',15);
        popText(G.balloon.x,by-8,'🎁 +15 🌾','#27ae60');
      }
      G.balloon.active=false;
      G.balloon.timer=rf(60,110);
      save();paintAll();
      return;
    }
  }
  /* подарочные коробки */
  var gsL=gifts();
  for(var gi2=gsL.length-1;gi2>=0;gi2--){
    if(hit(x,y,gsL[gi2].x,gsL[gi2].y,30)){openGift(gi2);return;}
  }
  /* монетный дождь */
  var crZ=coinRain();
  if(crZ.active){
    for(var ci=crZ.coins.length-1;ci>=0;ci--){
      if(hit(x,y,crZ.coins[ci].x,crZ.coins[ci].y,26)){catchCoin(ci);return;}
    }
  }
  /* бабочки: поймать (в мини-игре) */
  if(G.butterflyGame.active){
    for(var bi=0;bi<G.butterflies.length;bi++){
      var bf=G.butterflies[bi];
      if(hit(x,y,bf.x,bf.y,22)){
        butterflyCatch(bf);
        return;
      }
    }
  }
  /* щенок: погладить или поймать в мини-игре */
  if(G.pet&&hit(x,y,G.pet.x,G.pet.y-6,Math.max(34,Math.min(W,H)/14))){
    if(G.game.active){
      petGameCatch();
      return;
    }
    sfx('dog');haptic('light');
    G.pet.joy=1;G.pet.happy=Math.min(100,G.pet.happy+8);P.petPats=(P.petPats||0)+1;
    burstXY(G.pet.x,G.pet.y-24,'#ff5a7a',6);
    popText(G.pet.x,G.pet.y-40,'❤️','#ff5a7a');
    if(!P.tutorPet){P.tutorPet=1;save();}
    return;
  }
  /* кот: погладить */
  if(G.cat&&hit(x,y,G.cat.x,G.cat.y-4,Math.max(30,Math.min(W,H)/16))){
    sfx('cat');haptic('light');
    G.cat.joy=1;G.cat.happy=Math.min(100,G.cat.happy+8);P.petPats=(P.petPats||0)+1;
    burstXY(G.cat.x,G.cat.y-22,'#ff5a7a',6);
    popText(G.cat.x,G.cat.y-36,'❤️','#ff5a7a');
    if(!P.tutorCat){P.tutorCat=1;save();}
    return;
  }
  /* уточка в пруду */
  if(L.pond&&G.duck&&G.duck.x!=null&&hit(x,y,G.duck.x,G.duck.y-6,26)){petDuck();return;}
  /* ярмарочный шатёр */
  if(fairActive()&&L.tent&&hit(x,y,L.tent.x,L.tent.y-14,42)){sfx('tap');openPanel('fair');return;}
  /* помощник */
  if(G.helper&&helperActive()&&hit(x,y,G.helper.x,G.helper.y-8,30)){
    sfx('tap');
    toast('🧑‍🌾 Помощник собирает всё сам ещё '+mmss((P.helperUntil-now())/1000));
    return;
  }
  /* амбар */
  if(L.barn&&hit(x,y,L.barn.x,L.barn.y,L.barn.r*1.15)){
    sfx('tap');openPanel('barn');return;
  }
  /* цеха */
  for(var m=0;m<L.machs.length;m++){
    var mp=L.machs[m];
    if(hit(x,y,mp.x,mp.y,mp.r*1.2)){
      /* если что-то готово — забираем, иначе открываем амбар с рецептами */
      var got=false;
      var mm=P.machines[m];
      for(var q=mm.queue.length-1;q>=0;q--){
        if(cookReady(mm.queue[q])&&collectCook(m,q)){got=true;break;}
      }
      if(got){save();paintAll();}
      else{sfx('tap');openPanel('barn');}
      return;
    }
  }
  /* животные (загоны) */
  if(L.pens){
    for(var p=0;p<L.pens.length;p++){
      var pen=L.pens[p];
      var dx=Math.abs(x-pen.x), dy=Math.abs(y-pen.y);
      if(dx<=pen.w*0.52 && dy<=pen.h*0.56){
        onTapPen(pen);
        return;
      }
    }
  }
  /* грядки */
  for(var i=0;i<L.plots.length;i++){
    var pp=L.plots[i];
    /* ромб проверяем как эллипс — так попадать удобнее */
    var dx=(x-pp.x)/(pp.w*0.55),dy=(y-pp.y)/(pp.h*0.62);
    if(dx*dx+dy*dy<=1){
      var st2=plotState(P.plots[i]);
      if(st2==='ready'){harvestPlot(i);save();paintAll();}
      else if(st2==='empty'){sfx('tap');openPanel('shop');}
      else{
        var d=CMAP[P.plots[i].crop];
        var lf=d.t-(now()-P.plots[i].at)/1000;
        toast('⏳ '+d.n+' через '+mmss(lf));
      }
      return;
    }
  }
}

var prev=0,badgeT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!prev)prev=ts;
  var dt=Math.min((ts-prev)/1000,0.05);prev=ts;
  if(W<2){resize();return;}
  if(!G.paused){
    G.t+=dt;
    stepFx(dt);
  }
  render(dt);
  /* значок готовых заказов обновляем нечасто — это дешевле */
  badgeT+=dt;
  if(badgeT>1.1){badgeT=0;paintBadges();refillOrders();}
}
