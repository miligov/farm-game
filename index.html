/* ---------- навешиваем обработчики после отрисовки ---------- */
function bindPanel(){
  var b=$('pBody');
  /* иконки внутри карточек */
  var cvs=b.querySelectorAll('canvas[data-ico]');
  for(var i=0;i<cvs.length;i++)icon(cvs[i],cvs[i].getAttribute('data-ico'),0.42);

  function tap(el,fn){
    if(!el)return;
    el.addEventListener('pointerdown',function(e){
      e.preventDefault();e.stopPropagation();fn(e);
    },{passive:false});
    el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();});
  }
  /* заказы */
  b.querySelectorAll('[data-deliver]').forEach(function(el){
    tap(el,function(){deliverOrder(el.getAttribute('data-deliver'));});
  });
  b.querySelectorAll('[data-skip]').forEach(function(el){
    tap(el,function(){
      var id=el.getAttribute('data-skip');
      modal('truck','Отказаться?','Заказ пропадёт, вместо него придёт новый.',
        [{t:'Отказаться',f:function(){closeModal();skipOrder(id);}},
         {t:'Оставить',c:'ghost',f:closeModal}]);
    });
  });
  /* магазин */
  b.querySelectorAll('[data-plant]').forEach(function(el){
    tap(el,function(){askPlant(el.getAttribute('data-plant'));});
  });
  b.querySelectorAll('[data-animal]').forEach(function(el){
    tap(el,function(){buyAnimal(el.getAttribute('data-animal'));});
  });
  b.querySelectorAll('[data-machine]').forEach(function(el){
    tap(el,function(){buyMachine(el.getAttribute('data-machine'));});
  });
  tap($('buyPlot'),buyPlot);
  /* амбар */
  b.querySelectorAll('[data-sell]').forEach(function(el){
    tap(el,function(){
      var id=el.getAttribute('data-sell');
      var m=sellItem(id,1);
      if(m){toast('💰 +'+fmt(m));renderPanel();}
    });
  });
  b.querySelectorAll('[data-cook]').forEach(function(el){
    tap(el,function(){
      var p=el.getAttribute('data-cook').split('_');
      if(startCook(+p[0],+p[1]))renderPanel();
    });
  });
  tap($('upBarn'),function(){upgradeBarn();renderPanel();});
  /* ещё */
  tap($('daily'),function(){takeDaily();renderPanel();});
  var pg=$('petGame');if(pg)tap(pg,function(){closePanel();startPetGame();});
  var fc=$('feedCat');if(fc)tap(fc,function(){feedCat();renderPanel();});
  var bg=$('butterflyGame');if(bg)tap(bg,function(){closePanel();startButterflyGame();});
  var sb=$('seasonBtn');if(sb)tap(sb,function(){
    var s=['spring','summer','autumn','winter'];
    var i=s.indexOf(G.season);
    G.season=s[(i+1)%4];
    P.season=G.season;save();
    sfx('tap');
    toast('🍂 Теперь '+seasonName(G.season)+'!');
    renderPanel();
  });
  tap($('adCoins'),function(){
    var el=$('adCoins');if(el.disabled)return;el.disabled=true;
    watchAd(function(ok){
      if(!ok){el.disabled=false;return;}
      var m=120+P.lvl*45;
      P.coins+=m;P.totalCoins+=m;
      sfx('coin');haptic('medium');save();paintTop();
      toast('💰 +'+fmt(m)+' монет');
      renderPanel();
    });
  });
  tap($('adSpeed'),function(){
    var el=$('adSpeed');if(el.disabled)return;
    el.disabled=true;
    watchAd(function(ok){
      if(!ok){el.disabled=false;return;}
      if(speedUpAll()){
        sfx('done');haptic('medium');save();paintAll();
        toast('⚡ Всё готово к сбору!');
      }else toast('Сейчас нечего ускорять');
      renderPanel();
    });
  });
  tap($('adBarn'),function(){
    var el=$('adBarn');if(el.disabled)return;el.disabled=true;
    watchAd(function(ok){
      if(!ok){el.disabled=false;return;}
      P.barnCap+=10;
      sfx('build');haptic('medium');save();paintAll();
      toast('🏚 Амбар: +10 мест');
      renderPanel();
    });
  });
  tap($('shareBtn'),function(){share();});
  tap($('grpBtn'),joinGroup);
  tap($('vibBtn2'),function(){toggleVib();});
  tap($('howBtn'),showHow);
  paintVibBtns();
}

/* выбор: посадить на одну грядку или засеять все */
function askPlant(cropId){
  var d=CMAP[cropId];
  var free=P.plots.filter(function(p){return !p.crop;}).length;
  if(!free){sfx('err');toast('Нет свободных грядок');return;}
  var canAll=Math.min(free,Math.floor(P.coins/d.seed));
  modal(d.art,d.n,
    'Растёт <b>'+mmss(d.t)+'</b>, продаётся за <b>'+d.pr+'</b> монет.<br>'+
    'Свободных грядок: <b>'+free+'</b>',
    [{t:'Засеять все ('+canAll+')',f:function(){closeModal();plantAll(cropId);}},
     {t:'Закрыть',c:'ghost',f:closeModal}]);
}
function showHow(){
  modal('farm','Как играть',
    '🌱 Тапни по <b>пустой грядке</b> — посадишь семена.<br>'+
    '🌾 Когда вырастет — тапни ещё раз, соберёшь урожай.<br>'+
    '🐔 Зверей корми пшеницей, они дают продукты.<br>'+
    '🥖 В цехах готовь товары подороже.<br>'+
    '🚚 Отдавай товары <b>по заказам</b> — так выгоднее всего.<br><br>'+
    '<b>Ферма растёт, даже когда ты вышел.</b>',
    [{t:'Понятно!',f:closeModal}]);
}

/* ---------- шапка ---------- */
function paintTop(){
  $('coins').textContent=fmt(P.coins);
  $('lvlNum').textContent=P.lvl;
  $('lvlName').textContent=rankName();
  var need=xpNeed(P.lvl);
  $('xpFill').style.width=clamp(P.xp/need*100,0,100)+'%';
}
function paintBadges(){
  var n=readyOrders();
  var b=$('ordBdg');
  b.textContent=n;
  b.classList.toggle('on',n>0);
}
function paintAll(){
  paintTop();paintBadges();
  if(curTab)renderPanel();
}

/* ============================================================
   16. ВВОД
   ============================================================ */
function hit(x,y,cx,cy,r){
  var dx=x-cx,dy=y-cy;
  return dx*dx+dy*dy<=r*r;
}
function onTap(x,y){
  if(modalOpen||PWID.paused)return;
  audioWake();
  /* бабочки: поймать (в мини-игре) */
  if(G.butterflyGame.active){
    for(var bi=0;bi<G.butterflies.length;bi++){
      var bf=G.butterflies[bi];
      if(hit(x,y,bf.x,bf.y,22)){
        butterflyCatch(bf);
        return;
      }
    }
  }
  /* щенок: погладить или поймать в мини-игре */
  if(G.pet&&hit(x,y,G.pet.x,G.pet.y-6,Math.max(34,Math.min(W,H)/14))){
    if(G.game.active){
      petGameCatch();
      return;
    }
    sfx('dog');haptic('light');
    G.pet.joy=1;G.pet.happy=Math.min(100,G.pet.happy+8);
    burstXY(G.pet.x,G.pet.y-24,'#ff5a7a',6);
    popText(G.pet.x,G.pet.y-40,'❤️','#ff5a7a');
    if(!P.tutorPet){P.tutorPet=1;save();}
    return;
  }
  /* кот: погладить */
  if(G.cat&&hit(x,y,G.cat.x,G.cat.y-4,Math.max(30,Math.min(W,H)/16))){
    sfx('cat');haptic('light');
    G.cat.joy=1;G.cat.happy=Math.min(100,G.cat.happy+8);
    burstXY(G.cat.x,G.cat.y-22,'#ff5a7a',6);
    popText(G.cat.x,G.cat.y-36,'❤️','#ff5a7a');
    if(!P.tutorCat){P.tutorCat=1;save();}
    return;
  }
  /* амбар */
  if(L.barn&&hit(x,y,L.barn.x,L.barn.y,L.barn.r*1.15)){
    sfx('tap');openPanel('barn');return;
  }
  /* цеха */
  for(var m=0;m<L.machs.length;m++){
    var mp=L.machs[m];
    if(hit(x,y,mp.x,mp.y,mp.r*1.2)){
      /* если что-то готово — забираем, иначе открываем амбар с рецептами */
      var got=false;
      var mm=P.machines[m];
      for(var q=mm.queue.length-1;q>=0;q--){
        if(cookReady(mm.queue[q])&&collectCook(m,q)){got=true;break;}
      }
      if(got){save();paintAll();}
      else{sfx('tap');openPanel('barn');}
      return;
    }
  }
  /* животные */
  for(var a=0;a<L.anims.length;a++){
    var ap=L.anims[a];
    if(hit(x,y,ap.x,ap.y,ap.r*1.25)){
      var st=animalState(P.animals[a]);
      if(st==='hungry')feedAnimal(a);
      else if(st==='ready'){collectAnimal(a);save();paintAll();}
      else{
        var left=AMAP[P.animals[a].kind].t-(now()-P.animals[a].fedAt)/1000;
        toast('⏳ Через '+mmss(left));
      }
      return;
    }
  }
  /* грядки */
  for(var i=0;i<L.plots.length;i++){
    var pp=L.plots[i];
    /* ромб проверяем как эллипс — так попадать удобнее */
    var dx=(x-pp.x)/(pp.w*0.55),dy=(y-pp.y)/(pp.h*0.62);
    if(dx*dx+dy*dy<=1){
      var st2=plotState(P.plots[i]);
      if(st2==='ready'){harvestPlot(i);save();paintAll();}
      else if(st2==='empty'){sfx('tap');openPanel('shop');}
      else{
        var d=CMAP[P.plots[i].crop];
        var lf=d.t-(now()-P.plots[i].at)/1000;
        toast('⏳ '+d.n+' через '+mmss(lf));
      }
      return;
    }
  }
}
(function(){
  var downX=0,downY=0,moved=false;
  cv.addEventListener('pointerdown',function(e){
    downX=e.clientX;downY=e.clientY;moved=false;
  },{passive:true});
  cv.addEventListener('pointermove',function(e){
    if(Math.abs(e.clientX-downX)>12||Math.abs(e.clientY-downY)>12)moved=true;
  },{passive:true});
  cv.addEventListener('pointerup',function(e){
    if(moved)return;
    var r=cv.getBoundingClientRect();
    onTap(e.clientX-r.left,e.clientY-r.top);
  },{passive:true});
})();

/* ============================================================
   17. ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
var prev=0,badgeT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!prev)prev=ts;
  var dt=Math.min((ts-prev)/1000,0.05);prev=ts;
  if(W<2){resize();return;}
  if(!G.paused){
    G.t+=dt;
    stepFx(dt);
  }
  render(dt);
  /* значок готовых заказов обновляем нечасто — это дешевле */
  badgeT+=dt;
  if(badgeT>1.1){badgeT=0;paintBadges();refillOrders();}
}

/* ============================================================
   18. СТАРТ
   ============================================================ */
function enterGame(){
  var i=$('intro');
  if(!i||i.classList.contains('hide'))return;
  audioWake();sfx('done');
  i.classList.add('hide');
  /* Заставку не удаляем: это главное меню, в него можно вернуться
     через паузу (требование модерации ВК). */
  var rep=offlineReport();
  if(rep.total>=3){
    setTimeout(function(){
      modal('farm','С возвращением!',
        'Пока тебя не было, на ферме поспело:<br>'+
        (rep.crops?'🌾 урожай на <b>'+rep.crops+'</b> грядках<br>':'')+
        (rep.anim?'🥚 продукты от <b>'+rep.anim+'</b> зверей<br>':'')+
        (rep.cook?'✨ товары в цехах: <b>'+rep.cook+'</b>':''),
        [{t:'Собрать всё',f:function(){
          closeModal();
          harvestAll();collectAllAnimals();collectAllCooks();
        }},{t:'Позже',c:'ghost',f:closeModal}]);
    },700);
  }else if(!P.seen.how){
    P.seen.how=1;save();
    setTimeout(showHow,700);
  }
}
$('iGo').addEventListener('pointerdown',function(e){
  e.preventDefault();e.stopPropagation();enterGame();
},{passive:false});
$('intro').addEventListener('pointerdown',function(e){
  if(e.target.id==='iGo')return;
  enterGame();
},{passive:true});

/* пауза-виджет: «игра идёт», пока заставка скрыта */
setPauseHooks({
  isPlaying:function(){
    var i=$('intro');
    return !!(i&&i.classList.contains('hide'));
  },
  pause:function(){G.paused=true;},
  resume:function(){G.paused=false;},
  quit:function(){
    G.paused=false;
    closePanel();
    var i=$('intro');
    if(i)i.classList.remove('hide');
    save();
  }
});

document.addEventListener('visibilitychange',function(){
  if(document.hidden)save();

});

icon($('introArt'),'farm',0.44);
