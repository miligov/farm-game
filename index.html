<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7cc447">
<title>Солнечная Ферма 🌻</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:#12200f;color:#f2f8ee;display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;
}
#app{
  position:relative;width:100%;height:100%;max-width:540px;max-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#8fd3f4 0%,#b7e59a 38%,#7cc447 100%);
}
canvas{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1}

/* ---------- верхняя панель ---------- */
#top{
  position:relative;z-index:5;flex:0 0 auto;pointer-events:none;
  padding:calc(7px + env(safe-area-inset-top)) 9px 0;
  display:flex;align-items:flex-start;gap:7px;
}
.chip{
  pointer-events:auto;
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(236,246,228,.92));
  border:2px solid rgba(90,140,60,.35);border-radius:999px;
  padding:5px 12px 5px 6px;
  box-shadow:0 3px 0 rgba(60,100,40,.30),0 6px 14px rgba(0,0,0,.20);
  font-weight:900;font-size:15px;color:#33501f;line-height:1;
  font-variant-numeric:tabular-nums;
}
.chip canvas{width:22px;height:22px;flex:0 0 auto}
#lvlChip{flex-direction:column;align-items:stretch;gap:3px;padding:5px 11px;min-width:96px}
#lvlTop{display:flex;align-items:center;gap:5px;font-size:13px}
#lvlNum{
  background:linear-gradient(180deg,#ffd964,#f0a92c);color:#4a2f00;
  border-radius:999px;padding:1px 7px;font-size:12px;font-weight:900;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
#xpBar{height:6px;border-radius:99px;background:rgba(60,100,40,.22);overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
#xpFill{height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#8fe36a,#4fc12a);
  box-shadow:0 0 8px rgba(120,230,90,.7),inset 0 1px 0 rgba(255,255,255,.5);
  transition:width .35s}
#spacer{flex:1}
.icoBtn{
  pointer-events:auto;width:40px;height:40px;flex:0 0 auto;border:0;cursor:pointer;
  border-radius:13px;font-size:17px;line-height:1;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(226,240,216,.92));
  border:2px solid rgba(90,140,60,.32);
  box-shadow:0 3px 0 rgba(60,100,40,.3),0 5px 12px rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;
}
.icoBtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,100,40,.3)}

/* ---------- нижняя навигация ---------- */
#nav{
  position:relative;z-index:6;flex:0 0 auto;margin-top:auto;
  display:flex;gap:5px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(24,46,16,.0),rgba(24,46,16,.55) 45%,rgba(18,36,12,.85));
}
#nav button{
  flex:1;border:0;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px 6px;border-radius:15px;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(228,242,218,.88));
  border:2px solid rgba(255,255,255,.5);
  box-shadow:0 4px 0 rgba(40,80,26,.45),0 6px 14px rgba(0,0,0,.28);
  color:#33501f;font-size:10.5px;font-weight:900;letter-spacing:.2px;
  transition:transform .12s cubic-bezier(.34,1.6,.5,1),box-shadow .12s;
}
#nav button canvas{width:26px;height:26px}
#nav button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(40,80,26,.45)}
#nav button.on{
  background:linear-gradient(180deg,#ffe07a,#f5b731);
  border-color:rgba(255,255,255,.75);
  box-shadow:0 4px 0 #b57d12,0 7px 18px rgba(245,183,49,.45);
}
#nav button .bdg{
  position:absolute;top:2px;right:8px;min-width:17px;height:17px;border-radius:99px;
  background:linear-gradient(180deg,#ff7a6b,#e03b28);color:#fff;font-size:10px;font-weight:900;
  display:none;align-items:center;justify-content:center;padding:0 4px;
  box-shadow:0 2px 5px rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.85);
}
#nav button{position:relative}
#nav button .bdg.on{display:flex}

/* ---------- всплывающая подсказка ---------- */
#toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
  background:linear-gradient(180deg,rgba(28,52,18,.97),rgba(18,36,12,.97));
  border:2px solid rgba(150,220,110,.45);color:#eaf7e2;
  padding:10px 18px;border-radius:15px;font-size:13.5px;font-weight:800;
  opacity:0;pointer-events:none;max-width:88%;text-align:center;
  box-shadow:0 8px 26px rgba(0,0,0,.5);
}
#toast.on{animation:tst 2.1s ease}
@keyframes tst{
  0%{opacity:0;transform:translate(-50%,10px)}
  12%{opacity:1;transform:translate(-50%,0)}
  80%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-8px)}
}

/* ---------- панели ---------- */
.panel{
  position:absolute;left:0;right:0;bottom:0;top:auto;max-height:76%;z-index:30;
  display:none;flex-direction:column;
  background:linear-gradient(180deg,#f6fbf1,#e4f0d8);
  border-top:3px solid rgba(90,140,60,.4);
  border-radius:22px 22px 0 0;
  box-shadow:0 -10px 34px rgba(0,0,0,.4);
  color:#2c4519;
}
.panel.on{display:flex;animation:pIn .26s cubic-bezier(.22,1,.36,1)}
@keyframes pIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.pHead{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:12px 14px 9px;border-bottom:2px solid rgba(90,140,60,.16);
}
.pHead h3{font-size:17px;font-weight:900;flex:1;letter-spacing:-.2px}
.pHead .x{
  width:32px;height:32px;border:0;border-radius:11px;cursor:pointer;flex:0 0 auto;
  background:rgba(90,140,60,.16);color:#3d5c26;font-size:17px;font-weight:900;
}
.pHead .x:active{transform:translateY(2px)}
.pBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:11px 12px 18px;
  scroll-behavior:smooth}

/* карточки товаров/семян */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.gi{
  background:linear-gradient(180deg,#fff,#eef7e4);
  border:2px solid rgba(90,140,60,.22);border-radius:16px;
  padding:9px 7px 8px;text-align:center;cursor:pointer;position:relative;
  box-shadow:0 3px 0 rgba(90,140,60,.22),inset 0 1px 0 #fff;
  transition:transform .12s cubic-bezier(.34,1.6,.5,1),box-shadow .12s;
}
.gi:active{transform:translateY(3px);box-shadow:0 0 0 rgba(90,140,60,.22)}
.gi canvas{width:46px;height:46px;display:block;margin:0 auto 4px}
.gi .n{font-size:11.5px;font-weight:800;line-height:1.2;color:#2c4519}
.gi .p{font-size:12px;font-weight:900;color:#c47b06;margin-top:3px;
  display:flex;align-items:center;justify-content:center;gap:3px}
.gi .p canvas{width:14px;height:14px;margin:0;display:inline-block}
.gi.lock{opacity:.5;cursor:default}
.gi .lk{font-size:10px;color:#7a8f66;font-weight:800;margin-top:2px}
.gi .cnt{
  position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:99px;
  background:linear-gradient(180deg,#8fe36a,#3fa724);color:#fff;font-size:11.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 5px;
  border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.28);
}

/* строки заказов */
.ord{
  background:linear-gradient(180deg,#fff,#f0f8e7);
  border:2px solid rgba(90,140,60,.22);border-radius:18px;
  padding:11px 12px;margin-bottom:10px;
  box-shadow:0 3px 0 rgba(90,140,60,.2),inset 0 1px 0 #fff;
}
.ord .who{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ord .who canvas{width:34px;height:34px;flex:0 0 auto}
.ord .who b{font-size:13.5px;font-weight:900;flex:1}
.ord .items{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.oi{
  display:flex;align-items:center;gap:4px;
  background:rgba(90,140,60,.1);border:1.5px solid rgba(90,140,60,.2);
  border-radius:11px;padding:4px 8px 4px 5px;font-size:12.5px;font-weight:900;
}
.oi canvas{width:24px;height:24px}
.oi.ok{background:rgba(80,190,60,.18);border-color:rgba(60,170,40,.45);color:#2a6b16}
.oi.no{opacity:.75}
.ord .foot{display:flex;align-items:center;gap:8px}
.ord .rew{display:flex;align-items:center;gap:9px;flex:1;font-size:13px;font-weight:900}
.ord .rew span{display:flex;align-items:center;gap:3px}
.ord .rew canvas{width:17px;height:17px}
.btn{
  border:0;cursor:pointer;font-family:inherit;font-weight:900;color:#22400d;
  background:linear-gradient(180deg,#b6ec86,#68c43a 50%,#469b22);
  padding:11px 18px;border-radius:15px;font-size:14px;
  box-shadow:0 4px 0 #2e7415,0 6px 16px rgba(80,180,50,.32),inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .12s cubic-bezier(.34,1.6,.5,1),box-shadow .12s;
}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 #2e7415}
.btn:disabled{filter:saturate(.4);opacity:.6;cursor:default}
.btn.sm{font-size:12.5px;padding:9px 14px;border-radius:13px}
.btn.gold{
  color:#4a2f00;background:linear-gradient(180deg,#ffe488,#f5b731 50%,#d3900f);
  box-shadow:0 4px 0 #9c6a08,0 6px 16px rgba(245,183,49,.35),inset 0 1px 0 rgba(255,255,255,.6);
}
.btn.gold:active{box-shadow:0 0 0 #9c6a08}
.btn.ad{
  color:#04263f;background:linear-gradient(180deg,#bfe9ff,#4fb3f5 46%,#1f7fd0);
  box-shadow:0 4px 0 #14568f,0 6px 18px rgba(60,160,240,.42),inset 0 1px 0 rgba(255,255,255,.6);
  position:relative;overflow:hidden;
}
.btn.ad:active{box-shadow:0 0 0 #14568f}
.btn.ad::before{
  content:'';position:absolute;top:0;bottom:0;width:38%;left:-45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  animation:adShine 3.4s ease-in-out infinite;pointer-events:none;
}
@keyframes adShine{0%,62%{left:-45%}100%{left:115%}}
.btn.ghost{
  color:#3d5c26;background:linear-gradient(180deg,#fff,#e6f2da);
  box-shadow:0 4px 0 rgba(90,140,60,.34),inset 0 1px 0 #fff;
}
.btn.ghost:active{box-shadow:0 0 0 rgba(90,140,60,.34)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.muted{font-size:12px;color:#6d8459;line-height:1.5}
.sec{font-size:12px;font-weight:900;color:#5d7a45;text-transform:uppercase;
  letter-spacing:.5px;margin:14px 0 8px;display:flex;align-items:center;gap:7px}
.sec::before{content:'';width:3px;height:13px;border-radius:2px;background:#7cc447}
.sec:first-child{margin-top:0}

/* модалка */
#modal{
  position:absolute;inset:0;z-index:70;display:none;
  align-items:center;justify-content:center;padding:22px;
  background:rgba(14,28,10,.72);backdrop-filter:blur(6px);
}
#modal.on{display:flex;animation:mIn .22s ease}
@keyframes mIn{from{opacity:0}to{opacity:1}}
#mBox{
  width:100%;max-width:330px;text-align:center;
  background:linear-gradient(180deg,#f8fcf4,#e3efd6);
  border:3px solid rgba(255,255,255,.8);border-radius:24px;
  padding:20px 18px 17px;color:#2c4519;
  box-shadow:0 18px 50px rgba(0,0,0,.55);
  animation:mPop .3s cubic-bezier(.22,1.5,.4,1);
}
@keyframes mPop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
#mIco{margin:0 auto 9px;display:block;width:72px;height:72px}
#mTtl{font-size:19px;font-weight:900;margin-bottom:7px;letter-spacing:-.3px}
#mTxt{font-size:13.5px;line-height:1.55;color:#48633180;color:#4a6633}
#mTxt b{color:#2c4519}
#mBtns{display:flex;flex-direction:column;gap:8px;margin-top:15px}

/* экран-заставка */
#intro{
  position:absolute;inset:0;z-index:80;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:26px;
  background:
    radial-gradient(70% 40% at 50% 12%,rgba(255,232,140,.55),transparent 65%),
    linear-gradient(180deg,#8fd3f4 0%,#b7e59a 42%,#6fbb3d 100%);
  text-align:center;
}
#intro.hide{opacity:0;pointer-events:none;transition:opacity .6s}
#introArt{width:150px;height:150px}
#intro h1{
  font-size:clamp(30px,9vw,44px);font-weight:900;letter-spacing:-1px;line-height:1;
  color:#fff;
  text-shadow:0 3px 0 #4b8a26,0 6px 0 rgba(40,80,20,.5),0 12px 26px rgba(0,0,0,.35);
}
#intro .sub{font-size:14px;font-weight:700;color:#2f5418;max-width:290px;line-height:1.55}
#intro .sub b{color:#1f3d0e}

/* пауза-виджет */
#pw{
  position:fixed;top:calc(9px + env(safe-area-inset-top));
  right:calc(9px + env(safe-area-inset-right));
  width:42px;height:42px;border-radius:13px;cursor:pointer;z-index:2147483000;
  border:2px solid rgba(90,140,60,.35);
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(226,240,216,.92));
  color:#33501f;font:900 15px/1 inherit;letter-spacing:1px;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(60,100,40,.3),0 5px 12px rgba(0,0,0,.2);padding:0;
}
#pw.on{display:flex}
#pw:active{transform:translateY(2px)}
#pwScr{
  position:fixed;inset:0;z-index:2147483001;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:rgba(14,28,10,.85);backdrop-filter:blur(10px);padding:24px;
}
#pwScr.on{display:flex}
#pwScr h3{font-size:26px;font-weight:900;color:#fff;margin-bottom:4px;
  text-shadow:0 3px 0 rgba(0,0,0,.35)}
#pwScr button{
  width:100%;max-width:280px;min-height:48px;border:0;cursor:pointer;
  font-family:inherit;font-weight:900;font-size:16px;border-radius:16px;
  color:#22400d;background:linear-gradient(180deg,#eaf7e0,#c2e0a8);
  box-shadow:0 4px 0 rgba(0,0,0,.4);
  transition:transform .1s cubic-bezier(.34,1.6,.5,1),box-shadow .1s;
}
#pwScr button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
#pwScr .pwGo{background:linear-gradient(180deg,#b6ec86,#68c43a 55%,#469b22)}
#pwScr .pwOut{background:linear-gradient(180deg,#ffd0d8,#ff8fa3 55%,#e05b74);color:#3a0c16}
#pwScr .pwSm{
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.07));
  color:#eaf7e2;border:1px solid rgba(255,255,255,.2);font-size:14px;min-height:42px;
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<button id="pw" aria-label="Пауза">II</button>
<div id="pwScr" role="dialog" aria-modal="true" aria-label="Пауза">
  <h3>Пауза</h3>
  <button class="pwGo" id="pwGo">Продолжить</button>
  <button class="pwSm vibBtn" id="pwVib">Вибрация: вкл</button>
  <button class="pwOut" id="pwOut">Выйти в главное меню</button>
</div>

<div id="app">
  <canvas id="cv"></canvas>

  <div id="top">
    <div class="chip" id="coinChip"><canvas id="coinIco" width="44" height="44"></canvas><span id="coins">0</span></div>
    <div class="chip" id="lvlChip">
      <div id="lvlTop"><span id="lvlNum">1</span><span id="lvlName">Новичок</span></div>
      <div id="xpBar"><div id="xpFill"></div></div>
    </div>
    <div id="spacer"></div>
    <button class="icoBtn" id="sndBtn" aria-label="Звук">🔊</button>
  </div>

  <div id="nav">
    <button data-t="farm" class="on"><canvas width="52" height="52" data-ico="farm"></canvas>Ферма</button>
    <button data-t="orders"><canvas width="52" height="52" data-ico="truck"></canvas>Заказы<span class="bdg" id="ordBdg">0</span></button>
    <button data-t="shop"><canvas width="52" height="52" data-ico="shop"></canvas>Магазин</button>
    <button data-t="barn"><canvas width="52" height="52" data-ico="barn"></canvas>Амбар</button>
    <button data-t="more"><canvas width="52" height="52" data-ico="star"></canvas>Ещё</button>
  </div>

  <div class="panel" id="panel">
    <div class="pHead"><h3 id="pTtl">Магазин</h3><button class="x" id="pClose">✕</button></div>
    <div class="pBody" id="pBody"></div>
  </div>

  <div id="toast"></div>

  <div id="modal"><div id="mBox">
    <canvas id="mIco" width="144" height="144"></canvas>
    <div id="mTtl"></div><div id="mTxt"></div><div id="mBtns"></div>
  </div></div>

  <div id="intro">
    <canvas id="introArt" width="300" height="300"></canvas>
    <h1>Солнечная Ферма</h1>
    <div class="sub">Сажай урожай, корми зверей, готовь вкусности<br>и выполняй <b>заказы соседей</b>.</div>
    <button class="btn gold" id="iGo" style="font-size:18px;padding:15px 40px">НАЧАТЬ ФЕРМУ</button>
    <div class="muted" style="color:#2f5418;font-weight:700">Урожай растёт, даже когда ты вышел 🌱</div>
  </div>
</div>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script>
(function(){
'use strict';
/* ============================================================
   1. УТИЛИТЫ
   ============================================================ */
function $(id){return document.getElementById(id);}
function nop(){}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rf(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[(Math.random()*a.length)|0];}
function fmt(n){
  n=Math.round(n);
  if(n>=1000000)return (n/1000000).toFixed(n<10000000?1:0).replace('.',',')+'M';
  if(n>=10000)return (n/1000).toFixed(n<100000?1:0).replace('.',',')+'K';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}
function mmss(s){
  s=Math.max(0,Math.ceil(s));
  var h=(s/3600)|0,m=((s%3600)/60)|0,c=s%60;
  if(h>0)return h+'ч '+m+'м';
  if(m>0)return m+'м '+(c<10?'0':'')+c+'с';
  return c+'с';
}
function now(){return Date.now();}

/* ============================================================
   2. ЗВУК — синтез через WebAudio, без файлов
   ============================================================ */

function loadSfxBuf(key,cb){
  if(A.buf[key]){if(cb)cb(A.buf[key]);return;}
  var b64=SFX_B64[key];
  if(!b64||!actx()){if(cb)cb(null);return;}
  try{
    var bin=atob(b64.split(',')[1]);
    var ab=new ArrayBuffer(bin.length),u8=new Uint8Array(ab);
    for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    A.ctx.decodeAudioData(ab,function(buf){A.buf[key]=buf;if(cb)cb(buf);},function(){if(cb)cb(null);});
  }catch(e){if(cb)cb(null);}
}
function loadAllSfx(){
  if(!A.ctx)return;
  for(var k in SFX_B64)loadSfxBuf(k);
}
function playSfxBuf(n,v){
  var buf=A.buf[n];if(!buf)return false;
  try{
    var c=A.ctx,src=c.createBufferSource();src.buffer=buf;
    var g=c.createGain();g.gain.value=(v===undefined?1:v);
    src.connect(g);g.connect(A.master);src.start();
    return true;
  }catch(e){return false;}
}
function actx(){
  if(!A.ctx){
    try{
      A.ctx=new (window.AudioContext||window.webkitAudioContext)();
      A.master=A.ctx.createGain();
      A.master.gain.value=P.snd===false?0:0.7;
      A.master.connect(A.ctx.destination);
    }catch(e){A.on=false;}
  }
  if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();
  return A.ctx;
}
function audioWake(){actx();loadAllSfx();}
function tone(f,dur,type,vol,slide){
  if(!A.on||P.snd===false)return;
  var c=actx();if(!c)return;
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f,c.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),c.currentTime+dur);
  g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(vol||0.16,c.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
  o.connect(g);g.connect(A.master);
  o.start();o.stop(c.currentTime+dur+0.02);
}
function noise(dur,vol,freq){
  if(!A.on||P.snd===false)return;
  var c=actx();if(!c)return;
  var n=Math.floor(c.sampleRate*dur);
  var buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var src=c.createBufferSource();src.buffer=buf;
  var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1400;
  var g=c.createGain();g.gain.value=vol||0.12;
  src.connect(f);f.connect(g);g.connect(A.master);
  src.start();
}

   'totalCoins','adFree','dailyDate','dailyDone','tutor'].forEach(function(k){

  if(Array.isArray(o.machines))P.machines=o.machines;

function addXp(n){
  P.xp+=n;

    P.xp-=xpNeed(P.lvl);P.lvl++;up=true;
    P.coins+=P.lvl*18;

  if(up){

  return 'Открылось:<br>'+out.join('<br>');

/* Щит от «хвоста» тапа: после закрытия листа палец отпускается уже
   над кнопкой меню, и она срабатывает сама собой. */
function pwGuard(){
  var d=$('pwGuard');
  if(!d){
    d=document.createElement('div');
    d.id='pwGuard';
    d.style.cssText='position:fixed;inset:0;z-index:2147483002;background:transparent';
    ['pointerdown','pointerup','click','touchstart','touchend'].forEach(function(ev){
      d.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();},{passive:false});
    });
  }
  if(!d.parentNode)document.body.appendChild(d);
  clearTimeout(pwGuard._t);
  pwGuard._t=setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},500);
}
(function(){
  function tap(el,fn){
    if(!el)return;
    el.addEventListener('pointerdown',function(e){
      e.preventDefault();e.stopPropagation();fn();
    },{passive:false});
    el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();});
  }
  function init(){
    tap($('pw'),pwOpen);tap($('pwGo'),pwClose);tap($('pwOut'),pwQuit);
    tap($('pwVib'),function(){toggleVib();});
    paintVibBtns();
    setInterval(function(){
      if(PWID.paused)return;
      var play=false;
      try{play=PWID.isPlaying?!!PWID.isPlaying():false;}catch(e){}
      pwShow(play);
    },400);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();

/* ============================================================
   10. АМБАР
   ============================================================ */
function barnCount(){
  var s=0;
  for(var k in P.barn)s+=P.barn[k]|0;
  return s;
}
function barnFree(){return Math.max(0,P.barnCap-barnCount());}
function barnAdd(id,n){
  n=n||1;
  var free=barnFree();
  var put=Math.min(n,free);
  if(put>0)P.barn[id]=(P.barn[id]|0)+put;
  return put;                       /* сколько реально влезло */
}
function barnHas(id,n){return (P.barn[id]|0)>=(n||1);}
function barnTake(id,n){
  n=n||1;
  if(!barnHas(id,n))return false;
  P.barn[id]-=n;
  if(P.barn[id]<=0)delete P.barn[id];
  return true;
}
function canPay(need){
  for(var k in need)if(!barnHas(k,need[k]))return false;
  return true;
}
function payNeed(need){
  for(var k in need)barnTake(k,need[k]);
}

/* ============================================================
   11. ЗАКАЗЫ
   ============================================================ */
/* что игрок в принципе способен добыть на своём уровне */
function availableItems(){
  var out=[];
  CROPS.forEach(function(c){if(c.lvl<=P.lvl)out.push(c.id);});
  ANIMALS.forEach(function(a){
    if(a.lvl<=P.lvl&&P.animals.some(function(x){return x.kind===a.id;}))out.push(a.give);
  });
  P.machines.forEach(function(m){
    var d=MMAP[m.kind];
    if(d)d.rec.forEach(function(r){
      /* рецепт доступен, только если сырьё реально добывается */
      var ok=true;
      for(var k in r.need){
        if(CMAP[k]&&CMAP[k].lvl>P.lvl)ok=false;
        if(GMAP[k]){
          var src=ANIMALS.filter(function(a){return a.give===k;})[0];
          if(src&&!P.animals.some(function(x){return x.kind===src.id;}))ok=false;
        }
      }
      if(ok)out.push(r.out);
    });
  });
  return out;
}
function makeOrder(){
  var pool=availableItems();
  if(!pool.length)return null;
  var cnt=P.lvl<3?1:(P.lvl<6?ri(1,2):ri(1,3));
  var items={},total=0,xp=0;
  for(var i=0;i<cnt;i++){
    var id=pick(pool);
    var q=ri(1,Math.max(1,Math.min(4,Math.ceil(P.lvl/3))));
    items[id]=(items[id]|0)+q;
  }
  for(var k in items){
    total+=itemPrice(k)*items[k];
    xp+=Math.max(1,Math.round(itemPrice(k)*items[k]/14));
  }
  /* наценка: заказы выгоднее прямой продажи — иначе их не будут брать */
  var pay=Math.round(total*rf(1.32,1.68));
  return {
    id:'o'+now()+'_'+ri(100,999),
    who:ri(0,BUYERS.length-1),
    items:items,coins:pay,xp:Math.max(2,xp),
    at:now()
  };
}
function refillOrders(){
  var want=P.lvl<3?2:(P.lvl<7?3:4);
  var changed=false;
  while(P.orders.length<want){
    var o=makeOrder();
    if(!o)break;
    P.orders.push(o);changed=true;
  }

    /* голова */
    c.fillStyle=rg(-r*.2,-r*.35,r*.04,r*.9,'#fff2e0',skin);
    c.beginPath();c.arc(0,-r*.22,r*.56,0,7);c.fill();
    ink(r*.1,'rgba(120,80,50,.55)');
    /* волосы */
    c.fillStyle=g==='f'?'#8a5a3a':'#4a3a2a';
    c.beginPath();c.arc(0,-r*.3,r*.58,Math.PI*1.05,Math.PI*1.95);c.fill();
    if(g==='f'){
      c.beginPath();c.ellipse(-r*.52,-r*.1,r*.16,r*.3,0,0,7);c.fill();
      c.beginPath();c.ellipse(r*.52,-r*.1,r*.16,r*.3,0,0,7);c.fill();
    }
    c.save();c.translate(0,-r*.2);
    eyes(r*.2,0,r*.11);
    c.restore();
    blush(r*.34,-r*.02,r*.13);
    smile(r*.14,r*.16,r*.07);
  }

  return {
    draw:function(g,kind,r,t){
      var f=A[kind];
      if(!f)return false;
      c=g;g.save();f(r,t||0);g.restore();
      return true;
    },
    has:function(k){return !!A[k];}
  };
})();

/* нарисовать иконку в отдельный canvas-элемент */
function icon(el,kind,scale){
  if(!el)return;
  var w=el.width,h=el.height;
  var g=el.getContext('2d');
  g.clearRect(0,0,w,h);
  g.save();g.translate(w/2,h/2);
  ART.draw(g,kind,Math.min(w,h)*(scale||0.42),0);
  g.restore();
}
/* html-строка с canvas-иконкой (для списков) */
var icoSeq=0;
function icoTag(kind,size){
  var id='ic'+(++icoSeq);
  setTimeout(function(){
    var el=$(id);
    if(el)icon(el,kind,0.44);
  },0);
  var s=size||24;
  return '<canvas id="'+id+'" width="'+(s*2)+'" height="'+(s*2)+
         '" style="width:'+s+'px;height:'+s+'px"></canvas>';
}

   13. ИГРОВАЯ ЛОГИКА

var G={t:0,cam:{x:0,y:0},sel:null,parts:[],pops:[],paused:false,
  pet:{x:60,y:0,dir:1,t:0,state:'walk',joy:0,happy:0},
  cat:{x:W-60||100,y:0,dir:-1,t:0,state:'walk',joy:0,happy:0,prankT:0,prankCd:rf(25,45),fedT:0},

function initFarm(){
  /* грядки */
  while(P.plots.length<P.plotsOpen)P.plots.push({crop:null,at:0});
  /* стартовая подсказка-туториал */
  if(!P.tutor){
    P.tutor=1;
    P.barn.wheat=(P.barn.wheat|0)+3;
  }
  refillOrders();
  /* бабочки */
  G.butterflies=[];
  for(var b=0;b<3;b++){
    G.butterflies.push({x:rf(30,W-30),y:rf(H*0.15,H*0.45),a:rf(0,6.28),sp:rf(20,45),fl:rf(0,6)});
  }
  /* сезон: лето по умолчанию; можно сменить в «Ещё» */
  if(!P.season)P.season='summer';
  G.season=P.season;
  initPets();
}
/* питомцы и светлячки — позиции зависят от размера экрана,
   поэтому вызываем и здесь, и после resize() */
function initPets(){
  if(W<2)return;
  if(G.pet){
    if(!G.pet.x||G.pet.x<40||G.pet.x>W*0.4){
      G.pet.x=rf(50,Math.max(60,W*0.3));
      G.pet.y=H-86;
      G.pet.dir=Math.random()<.5?1:-1;
    }
  }
  if(G.cat){
    if(!G.cat.x||G.cat.x<W*0.55||G.cat.x>W-40){
      G.cat.x=rf(Math.min(W*0.7,W-60),W-50);
      G.cat.y=H-96;
      G.cat.dir=Math.random()<.5?1:-1;
    }
  }
  if(!G.fireflies.length||G.fireflies[0].x>W||G.fireflies[0].y>H){
    G.fireflies=[];
    for(var fl2=0;fl2<12;fl2++){
      G.fireflies.push({x:rf(10,W-10),y:rf(H*0.15,H*0.8),ph:rf(0,6.28),sp:rf(8,20)});
    }

}

/* ---------- грядки ---------- */
function plotState(p){
  if(!p.crop)return 'empty';
  var d=CMAP[p.crop];
  if(!d)return 'empty';
  var el=(now()-p.at)/1000;
  return el>=d.t?'ready':'grow';
}
function plotProgress(p){
  if(!p.crop)return 0;
  var d=CMAP[p.crop];
  return clamp((now()-p.at)/1000/d.t,0,1);
}
function plantCrop(i,cropId){
  var p=P.plots[i];
  if(!p||p.crop)return false;
  var d=CMAP[cropId];
  if(!d||d.lvl>P.lvl)return false;
  if(P.coins<d.seed){sfx('err');toast('Не хватает монет на семена');return false;}
  P.coins-=d.seed;
  p.crop=cropId;p.at=now();
  sfx('plant');haptic('light');
  popText(plotCX(i),plotCY(i)-14,'-'+d.seed,'#c0392b');
  paintTop();save();
  return true;
}

/* Амбар забит — предлагаем бесплатное место за ролик.
   Это самый честный момент для рекламы: игрок сам упёрся в лимит. */
function askBarnAd(){
  modal('barn','Амбар переполнен',
    'Урожай некуда складывать.<br>Освободи место — или расширь склад.',
    [{t:'📺 +10 мест бесплатно',c:'ad',f:function(){
       var btns=document.querySelectorAll('#mBtns button');
       for(var i=0;i<btns.length;i++)btns[i].disabled=true;
       watchAd(function(ok){
         if(!ok){for(var i=0;i<btns.length;i++)btns[i].disabled=false;return;}
         P.barnCap+=10;
         sfx('build');haptic('medium');save();paintAll();
         toast('🏚 Амбар: +10 мест');
         closeModal();
       });
     }},
     {t:'Продать лишнее',f:function(){closeModal();openPanel('barn');}},
     {t:'Закрыть',c:'ghost',f:closeModal}]);
}
function harvestPlot(i,silent){
  var p=P.plots[i];
  if(!p||plotState(p)!=='ready')return false;
  var d=CMAP[p.crop];
  var got=barnAdd(d.id,1);
  if(!got){
    if(!silent){sfx('err');askBarnAd();}
    return false;
  }
  p.crop=null;p.at=0;
  P.totalHarvest++;
  ach('firstHarvest','Первый урожай! 🌾');
  if(P.totalHarvest===10)ach('tenHarvest','10 урожаев! 🌾🎉');
  addXp(d.xp);
  if(!silent){
    sfx('harvest');haptic('light');
    burstXY(plotCX(i),plotCY(i),'#8fe36a',10);
    popText(plotCX(i),plotCY(i)-16,'+1 '+d.n,'#2e7d32');
  }
  return true;
}
function harvestAll(){
  var n=0,full=false;
  for(var i=0;i<P.plots.length;i++){
    if(plotState(P.plots[i])==='ready'){
      if(barnFree()<=0){full=true;break;}
      if(harvestPlot(i,true))n++;
    }
  }
  if(n){
    sfx('harvest');haptic('medium');
    toast('🌾 Собрано: '+n);
    save();paintAll();
  }else if(full)toast('🏚 Амбар переполнен!');
  else toast('Пока нечего собирать');
  return n;
}
/* засеять все свободные грядки той же культурой */
function plantAll(cropId){
  var d=CMAP[cropId];
  if(!d)return 0;
  var n=0;
  for(var i=0;i<P.plots.length;i++){
    if(P.plots[i].crop)continue;
    if(P.coins<d.seed)break;
    P.coins-=d.seed;
    P.plots[i].crop=cropId;P.plots[i].at=now();
    n++;
  }
  if(n){sfx('plant');haptic('light');toast('🌱 Засеяно грядок: '+n);save();paintAll();}
  else toast(P.coins<d.seed?'Не хватает монет':'Нет свободных грядок');
  return n;
}
function buyPlot(){
  var cost=plotCost(),need=plotLvlNeed();
  if(P.lvl<need){sfx('err');toast('Нужен '+need+' уровень');return;}
  if(P.coins<cost){sfx('err');toast('Не хватает '+fmt(cost-P.coins)+' монет');return;}
  P.coins-=cost;P.plotsOpen++;
  P.plots.push({crop:null,at:0});
  sfx('build');haptic('medium');
  toast('🌱 Новая грядка!');

}

}
function animalProgress(a){

  if(!a.fedAt)return 0;

}
function feedAnimal(idx){

/* ---------- производства ---------- */
function buyMachine(kind){
  var d=MMAP[kind];
  if(!d)return;
  if(d.lvl>P.lvl){sfx('err');toast('Нужен '+d.lvl+' уровень');return;}
  if(P.machines.some(function(m){return m.kind===kind;})){
    toast('Такой цех уже есть');return;
  }
  if(P.coins<d.cost){sfx('err');toast('Не хватает '+fmt(d.cost-P.coins)+' монет');return;}
  P.coins-=d.cost;
  P.machines.push({kind:kind,queue:[]});
  confettiBurst();
  ach('machine'+kind,'🏭 Построено: '+d.n+'!');
  sfx('build');haptic('heavy');
  modal(d.art,d.n+' построена!','Теперь можно делать товары подороже.',
    [{t:'Отлично!',f:closeModal}]);
  save();paintAll();layout();
}
function machineDef(m){return MMAP[m.kind];}
function startCook(mi,recIdx){
  var m=P.machines[mi];
  if(!m)return false;
  var d=machineDef(m),r=d.rec[recIdx];
  if(!r)return false;
  if(m.queue.length>=d.slots){sfx('err');toast('Все слоты заняты');return false;}
  if(!canPay(r.need)){
    sfx('err');
    var miss=[];
    for(var k in r.need){
      var have=P.barn[k]|0;
      if(have<r.need[k])miss.push(itemName(k)+' ×'+(r.need[k]-have));
    }
    toast('Не хватает: '+miss.join(', '));
    return false;
  }
  payNeed(r.need);
  m.queue.push({out:r.out,at:now(),t:r.t,xp:r.xp});
  sfx('cook');haptic('light');
  save();paintAll();
  return true;
}
function cookReady(q){return (now()-q.at)/1000>=q.t;}
function cookProgress(q){return clamp((now()-q.at)/1000/q.t,0,1);}
function collectCook(mi,qi,silent){
  var m=P.machines[mi];
  if(!m)return false;
  var q=m.queue[qi];
  if(!q||!cookReady(q))return false;
  if(!barnAdd(q.out,1)){
    if(!silent){sfx('err');toast('🏚 Амбар переполнен!');}
    return false;
  }
  m.queue.splice(qi,1);
  addXp(q.xp);
  if(!silent){
    sfx('done');haptic('medium');
    toast('✨ Готово: '+itemName(q.out));
  }
  return true;
}
function collectAllCooks(){
  var n=0;
  for(var i=0;i<P.machines.length;i++){
    var m=P.machines[i];
    for(var j=m.queue.length-1;j>=0;j--){
      if(barnFree()<=0)break;
      if(cookReady(m.queue[j])&&collectCook(i,j,true))n++;
    }
  }
  if(n){sfx('done');haptic('medium');toast('✨ Забрано: '+n);save();paintAll();}
  return n;
}
/* ускорить всё производство за рекламу */
function speedUpAll(){
  var any=false;
  P.machines.forEach(function(m){
    m.queue.forEach(function(q){
      if(!cookReady(q)){q.at=now()-q.t*1000;any=true;}
    });
  });
  P.animals.forEach(function(a){
    if(animalState(a)==='grow'){a.fedAt=now()-AMAP[a.kind].t*1000;any=true;}
  });
  P.plots.forEach(function(p){
    if(p.crop&&plotState(p)==='grow'){p.at=now()-CMAP[p.crop].t*1000;any=true;}
  });
  return any;
}

/* ---------- амбар и продажа ---------- */
function sellItem(id,n){

  if(!barnHas(id,n)){sfx('err');return 0;}
  barnTake(id,n);

function upgradeBarn(){

  if(P.coins<cost){sfx('err');toast('Не хватает '+fmt(cost-P.coins)+' монет');return;}

/* ---------- заказы ---------- */
function deliverOrder(oid){
  var idx=-1;
  for(var i=0;i<P.orders.length;i++)if(P.orders[i].id===oid)idx=i;
  if(idx<0)return false;
  var o=P.orders[idx];
  if(!orderReady(o)){sfx('err');toast('Товары ещё не готовы');return false;}
  for(var k in o.items)barnTake(k,o.items[k]);
  P.coins+=o.coins;P.totalCoins+=o.coins;P.totalOrders++;
  addXp(o.xp);
  P.orders.splice(idx,1);
  sfx('order');haptic('medium');
  refillOrders();save();paintAll();
  /* Плюшка за ролик: удвоить оплату заказа. */
  var buy=BUYERS[o.who]||BUYERS[0];
  modal(buy.art,'Заказ доставлен!',
    'Получено <b>'+fmt(o.coins)+'</b> монет и <b>'+o.xp+'</b> опыта.',
    [{t:'📺 Удвоить оплату',c:'ad',f:function(){
       var btns=document.querySelectorAll('#mBtns button');
       for(var i=0;i<btns.length;i++)btns[i].disabled=true;
       watchAd(function(ok){
         if(!ok){for(var i=0;i<btns.length;i++)btns[i].disabled=false;return;}
         P.coins+=o.coins;P.totalCoins+=o.coins;
         sfx('coin');haptic('medium');save();paintAll();
         toast('💰 +'+fmt(o.coins)+' сверху!');
         closeModal();
       });
     }},
     {t:'Спасибо!',c:'ghost',f:closeModal}]);
  return true;
}
function skipOrder(oid){
  var idx=-1;
  for(var i=0;i<P.orders.length;i++)if(P.orders[i].id===oid)idx=i;
  if(idx<0)return;
  P.orders.splice(idx,1);
  refillOrders();save();paintAll();

}

/* ---------- ежедневный подарок ---------- */
function todayKey(){
  var d=new Date();
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function dailyReady(){return P.dailyDate!==todayKey();}
function takeDaily(){
  if(!dailyReady()){toast('Сегодня уже забирал');return;}
  P.dailyDate=todayKey();P.dailyDone++;
  var money=60+P.lvl*24;
  P.coins+=money;
  var seeds=Math.min(4,1+Math.floor(P.lvl/3));
  barnAdd('wheat',seeds);
  sfx('done');haptic('medium');
  modal('gift','Ежедневный подарок',
    'Держи <b>'+fmt(money)+'</b> монет<br>и <b>'+seeds+'</b> пшеницы в амбар.',
    [{t:'Спасибо!',f:closeModal}]);
  save();paintAll();
}

/* ---------- офлайн-прогресс ----------
   Ничего не «доначисляем» задним числом: всё считается от меток
   времени, поэтому урожай просто оказывается готов. Показываем
   игроку сводку, чтобы возвращаться было приятно. */
function offlineReport(){
  var crops=0,anim=0,cook=0;
  P.plots.forEach(function(p){if(p.crop&&plotState(p)==='ready')crops++;});
  P.animals.forEach(function(a){if(animalState(a)==='ready')anim++;});
  P.machines.forEach(function(m){m.queue.forEach(function(q){if(cookReady(q))cook++;});});
  return {crops:crops,anim:anim,cook:cook,total:crops+anim+cook};
}

/* ---------- частицы и всплывающий текст ---------- */
function burstXY(x,y,col,n){
  for(var i=0;i<(n||12);i++){
    var a=Math.random()*6.283,s=rf(40,150);
    G.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,
      life:rf(.4,.8),t:0,c:col,r:rf(2.5,5)});
  }
}
function popText(x,y,txt,col){
  G.pops.push({x:x,y:y,t:0,life:1.1,txt:txt,c:col||'#fff'});
}
/* ---------- КОНФЕТТИ (радость!) ---------- */
function confettiBurst(){
  var cols=['#ff5a7a','#ffd24a','#7ef0b0','#6ac8ff','#c39aff','#ff9a3a','#ff6a7a','#fff'];
  for(var i=0;i<30;i++){
    G.parts.push({x:W/2+rf(-40,40),y:H*0.3+rf(-20,40),
      vx:rf(-160,160),vy:rf(-260,-60),
      life:rf(.8,1.4),t:0,c:cols[i%cols.length],r:rf(2.5,5)});
  }
}
/* ---------- ДОСТИЖЕНИЯ (одноразовые тосты) ---------- */
function ach(id,txt){
  if(P.seen[id])return;
  P.seen[id]=1;save();
  sfx('win');haptic('medium');
  toast('🏆 '+txt);
}
function stepFx(dt){
  for(var i=G.parts.length-1;i>=0;i--){
    var p=G.parts[i];p.t+=dt;
    if(p.t>=p.life){G.parts.splice(i,1);continue;}
    p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  for(var k=G.pops.length-1;k>=0;k--){
    var q=G.pops[k];q.t+=dt;q.y-=34*dt;
    if(q.t>=q.life)G.pops.splice(k,1);
  }
  stepPet(dt);stepCat(dt);stepButterflies(dt);stepWeather(dt);
  stepNight(dt);stepFireflies(dt);stepPetGame(dt);stepButterflyGame(dt);stepSeason(dt);
  stepCatPrank(dt);
}
/* ---------- КОТ ---------- */
function stepCat(dt){
  var c=G.cat;
  if(!c||W<2)return;
  if(c.joy>0)c.joy-=dt;
  c.happy=Math.max(0,c.happy-dt*0.004);
  c.t+=dt;
  if(c.state==='walk'){
    c.x+=c.dir*26*dt;
    if(c.x<W*0.55){c.x=W*0.55;c.dir=1;}
    if(c.x>W-40){c.x=W-40;c.dir=-1;}
    if(Math.random()<dt*0.5){c.state='sit';c.t=0;}
  }else if(c.state==='sit'){
    if(c.t>rf(1.5,3)){c.state='walk';if(Math.random()<.4)c.dir*=-1;}
  }
  c.y=H-96+Math.sin(c.t*2.5)*2;
}
/* ---------- КОТ-ШАЛУН: сбивает урожай ---------- */
function stepCatPrank(dt){
  var c=G.cat;
  if(!c||W<2)return;
  /* сытый кот не шалит */
  c.fedT=Math.max(0,c.fedT-dt);
  c.prankT=Math.max(0,c.prankT-dt);
  if(c.fedT>0||c.prankT>0)return;
  c.prankCd-=dt;
  if(c.prankCd>0)return;
  /* найдём поспевшую грядку */
  var target=-1;
  for(var i=0;i<P.plots.length;i++){
    if(plotState(P.plots[i])==='ready'){target=i;break;}
  }
  if(target<0){c.prankCd=rf(15,30);return;}
  /* кот крадётся к грядке и сбивает её */
  c.prankT=1.6;
  c.prankCd=rf(30,55);
  c.targetPlot=target;
  var px=plotCX(target),py=plotCY(target);
  c.targetX=px;c.targetY=py-8;
  sfx('jump');haptic('light');
}
/* подкрадывание: рисуется в drawCat через состояние prankT */
function catPrankHit(){
  var c=G.cat;
  if(!c||c.prankT>1.0)return;
  var t=c.targetPlot;
  if(t<0||t>=P.plots.length)return;
  var p=P.plots[t];
  if(!p||plotState(p)!=='ready')return;
  var d=CMAP[p.crop];
  p.crop=null;p.at=0;
  sfx('cat');sfx('pop');haptic('medium');
  burstXY(plotCX(t),plotCY(t),'#e8c878',10);
  popText(plotCX(t),plotCY(t)-14,'😹 Сбил!','#d97a1a');
  c.prankHit=1;
  /* если урожай был — кот «приносит» монетку-извинение */
  if(d){
    var coin=Math.max(1,Math.round(d.pr/10));
    P.coins+=coin;
    popText(plotCX(t),plotCY(t)-30,'+'+coin+' 🪙','#ffd24a');
  }
  save();
}
/* ---------- КОРМ ДЛЯ КОТА (за монеты — кот не шалит) ---------- */
var CAT_FEED_COST=15;
function feedCat(){
  if(P.coins<CAT_FEED_COST){sfx('err');toast('Не хватает монет!');return;}
  P.coins-=CAT_FEED_COST;
  G.cat.fedT=90;
  G.cat.joy=1;G.cat.happy=Math.min(100,G.cat.happy+15);
  sfx('cat');haptic('light');
  burstXY(G.cat.x,G.cat.y-20,'#ffd24a',8);
  popText(G.cat.x,G.cat.y-34,'🐟 Мур!','#9ad87a');
  save();
  toast('🐟 Кот сыт и не шалит 90с!');
}
/* ---------- МИНИ-ИГРА «ПОЙМАЙ БАБОЧКУ» ---------- */
function startButterflyGame(){
  var g=G.butterflyGame;
  g.active=true;g.t=0;g.caught=0;g.target=5;
  /* бабочек побольше и быстрее */
  if(G.butterflies.length<8){
    for(var i=G.butterflies.length;i<8;i++){
      G.butterflies.push({x:rf(30,W-30),y:rf(H*0.15,H*0.45),a:rf(0,6.28),sp:rf(40,80),fl:rf(0,6)});
    }
  }
  toast('🦋 Лови бабочек! Тапай по ним!');
}
function stepButterflyGame(dt){
  var g=G.butterflyGame;
  if(!g.active)return;
  g.t+=dt;
  /* бабочки летают быстрее во время игры */
  for(var i=0;i<G.butterflies.length;i++){
    var b=G.butterflies[i];
    b.a+=b.sp*dt*0.12*(Math.random()<.5?1:-1);
    b.x+=Math.cos(b.a)*(b.sp*1.6)*dt;
    b.y+=Math.sin(b.a*1.3)*40*dt;
    if(b.x<20){b.x=20;b.a=Math.PI-b.a;}
    if(b.x>W-20){b.x=W-20;b.a=Math.PI-b.a;}
    if(b.y<H*0.1)b.y=H*0.1;
    if(b.y>H*0.55)b.y=H*0.55;
  }
  if(g.t>8){
    g.active=false;
    if(g.caught>=g.target){
      var prize=25+P.lvl*6;
      P.coins+=prize;
      sfx('win');haptic('heavy');
      confettiBurst();
      toast('🎉 Поймал '+g.caught+' бабочек! +'+prize+' 🪙');
      save();
    }else{
      toast('😅 Поймал '+g.caught+' из '+g.target+'. Ещё раз?');
    }
  }
}
function butterflyCatch(b){
  var g=G.butterflyGame;
  if(!g.active)return;
  /* убираем пойманную и добавляем новую */
  var idx=G.butterflies.indexOf(b);
  if(idx>=0)G.butterflies.splice(idx,1);
  g.caught++;
  sfx('score');haptic('light');
  burstXY(b.x,b.y,'#ff9ac8',8);
  popText(b.x,b.y-14,'+1','#ff6aa8');
  G.butterflies.push({x:rf(30,W-30),y:rf(H*0.15,H*0.45),a:rf(0,6.28),sp:rf(40,80),fl:rf(0,6)});
  if(g.caught>=g.target){
    /* досрочно — сразу награда */
    g.t=99;
    stepButterflyGame(0.1);
  }
}
/* ---------- НОЧЬ ---------- */
function stepNight(dt){
  var n=G.night;
  n.t+=dt;
  if(n.t>n.cycle){
    n.t=0;
    n.on=!n.on;
    toast(n.on?'🌙 Наступила ночь!':'☀️ Снова день!');
  }
}
function nightFactor(){
  /* 0 = день, 1 = ночь */
  var n=G.night;
  var p=n.t/n.cycle;
  return n.on?Math.min(1,p*3):Math.max(0,1-p*3);
}
/* ---------- СВЕТЛЯЧКИ ---------- */
function stepFireflies(dt){
  for(var i=0;i<G.fireflies.length;i++){
    var f=G.fireflies[i];
    f.ph+=dt;
    f.x+=Math.sin(f.ph*0.7)*f.sp*dt;
    f.y+=Math.cos(f.ph*0.9)*f.sp*0.6*dt;
    if(f.x<8)f.x=8;if(f.x>W-8)f.x=W-8;
    if(f.y<H*0.1)f.y=H*0.1;if(f.y>H*0.85)f.y=H*0.85;
  }
}
/* ---------- МИНИ-ИГРА «ДОГОНИ ЩЕНКА» ---------- */
function startPetGame(){
  var g=G.game;
  g.active=true;g.t=0;g.catches=0;
  g.target=3;
  G.pet.state='run';G.pet.dir=Math.random()<.5?1:-1;
  toast('🐶 Догони щенка! Тапай по нему '+g.target+' раз!');
}
function stepPetGame(dt){
  var g=G.game;
  if(!g.active)return;
  g.t+=dt;
  /* щенок убегает быстрее */
  if(G.pet.state==='run'){
    G.pet.x+=G.pet.dir*(90+Math.sin(g.t*6)*20)*dt;
    if(G.pet.x<40){G.pet.x=40;G.pet.dir=1;}
    if(G.pet.x>W-40){G.pet.x=W-40;G.pet.dir=-1;}
    G.pet.y=H-86+Math.sin(G.pet.t*6)*4;
  }
  if(g.t>9){
    g.active=false;
    G.pet.state='sit';
    toast('😅 Щенок убежал! Попробуй ещё!');
  }
}
function petGameCatch(){
  var g=G.game;
  if(!g.active)return;
  g.catches++;
  sfx('dog');haptic('light');
  burstXY(G.pet.x,G.pet.y-24,'#ffd24a',8);
  if(g.catches>=g.target){
    g.active=false;
    G.pet.state='sit';
    var prize=20+P.lvl*5;
    P.coins+=prize;
    sfx('win');haptic('heavy');
    confettiBurst();
    popText(G.pet.x,G.pet.y-30,'+'+prize+' 🪙','#ffd24a');
    toast('🎉 Поймал щенка! +'+prize+' монет');
    save();
  }else{
    popText(G.pet.x,G.pet.y-30,(g.target-g.catches)+'!','#fff');
    /* щенок меняет направление — сложнее */
    G.pet.dir=Math.random()<.5?1:-1;
  }
}
/* ---------- СЕЗОНЫ ---------- */
function stepSeason(dt){
  G.seasonT+=dt;
  if(G.seasonT>60){
    G.seasonT=0;
    if(P.season&&P.season!=='auto'){G.season=P.season;return;}
    var s=['spring','summer','autumn','winter'];
    var i=s.indexOf(G.season);
    G.season=s[(i+1)%4];
    toast('🍂 Наступила '+seasonName(G.season)+'!');
  }
}
function seasonName(s){
  return s==='spring'?'весна':(s==='summer'?'лето':(s==='autumn'?'осень':'зима'));
}
/* ---------- ЩЕНОК-ПИТОМЕЦ ---------- */
function stepPet(dt){
  var pet=G.pet;
  if(!pet||W<2)return;
  if(pet.joy>0)pet.joy-=dt;
  pet.happy=Math.max(0,pet.happy-dt*0.004);
  pet.t+=dt;
  if(pet.state==='walk'){
    pet.x+=pet.dir*38*dt;
    if(pet.x<40){pet.x=40;pet.dir=1;}
    if(pet.x>W*0.42){pet.x=W*0.42;pet.dir=-1;}
    if(Math.random()<dt*0.8){pet.state='sit';pet.t=0;}
  }else if(pet.state==='sit'){
    if(pet.t>rf(1.2,2.5)){pet.state='walk';if(Math.random()<.4)pet.dir*=-1;}
  }
  pet.y=H-86+Math.sin(pet.t*3)*2;
}
function petXY(){return {x:G.pet.x,y:G.pet.y};}
/* ---------- БАБОЧКИ ---------- */
function stepButterflies(dt){
  for(var i=0;i<G.butterflies.length;i++){
    var b=G.butterflies[i];
    b.a+=b.sp*dt*0.05*(Math.random()<.5?1:-1);
    b.x+=Math.cos(b.a)*b.sp*dt;
    b.y+=Math.sin(b.a*1.3)*26*dt;
    b.fl+=dt;
    if(b.x<20){b.x=20;b.a=Math.PI-b.a;}
    if(b.x>W-20){b.x=W-20;b.a=Math.PI-b.a;}
    if(b.y<H*0.12)b.y=H*0.12;
    if(b.y>H*0.5)b.y=H*0.5;
  }
}
/* ---------- ПОГОДА: дождик и радуга ---------- */
function stepWeather(dt){
  var w=G.weather;
  w.t+=dt;w.next-=dt;
  if(w.type==='sun'&&w.next<=0){
    w.type='rain';w.t=0;w.rain=[];
    toast('🌧 Поливает дождик!');
  }else if(w.type==='rain'){
    /* капли */
    if(Math.random()<dt*26&&w.rain.length<40){
      w.rain.push({x:rf(0,W),y:rf(-40,H*0.4),v:rf(260,420)});
    }
    for(var i=w.rain.length-1;i>=0;i--){
      var d=w.rain[i];d.y+=d.v*dt;d.x-=d.v*0.12*dt;
      if(d.y>H){w.rain.splice(i,1);}
    }
    if(w.t>5){w.type='rainbow';w.t=0;w.rainbow=1;}
  }else if(w.type==='rainbow'){
    w.rainbow=Math.max(0,w.rainbow-dt/3);
    if(w.t>12){w.type='sun';w.next=rf(40,70);}
  }
}
/* ============================================================
   14. ОТРИСОВКА ФЕРМЫ
   Псевдо-изометрия: грядки лежат ромбами, постройки стоят рядами.
   Всё позиционируется от layout() — он же даёт координаты для тапов.
   ============================================================ */
var cv=$('cv'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
var L={plots:[],anims:[],machs:[],barn:null,tile:60};

function resize(){
  var r=$('app').getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=r.width;H=r.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
  initPets();
}
window.addEventListener('resize',function(){setTimeout(resize,80);});
window.addEventListener('orientationchange',function(){setTimeout(resize,260);});

/* Раскладка сцены. Считаем один раз при изменениях, а не каждый кадр:
   так тапы и отрисовка гарантированно совпадают. */
function layout(){
  if(W<2)return;
  var top=78,bot=104;
  var free=H-top-bot;
  L.plots=[];L.anims=[];L.machs=[];

  /* Сцена делится на три зоны по высоте. Доли подобраны так, чтобы
     на пустой ферме грядки занимали центр, а с ростом хозяйства
     звери и цеха получали своё место без наложений. */
  var hasA=P.animals.length>0, hasM=P.machines.length>0;
  var fP=(hasA&&hasM)?0.46:(hasA||hasM)?0.58:0.86;
  var fA=hasA?((hasM)?0.27:0.36):0;
  var fM=hasM?((hasA)?0.27:0.36):0;

  /* --- грядки --- */
  var n=P.plots.length;
  var cols=n<=4?2:(n<=9?3:4);
  var rows=Math.ceil(n/cols);
  var zoneP=free*fP;
  var tw=Math.min(W*0.88/cols,92,(zoneP/rows)/0.62/0.9);
  var th=tw*0.62;
  L.tile=tw;
  var gw=(cols-1)*tw+tw;
  var ox=(W-gw)/2+tw/2;
  var gh=(rows-1)*th*0.86;
  var oy=top+(zoneP-gh)/2;
  for(var i=0;i<n;i++){
    var cx=i%cols,cy=(i/cols)|0;
    var rowN=Math.min(cols,n-cy*cols);
    var rowW=(rowN-1)*tw;
    var sx0=(W-rowW)/2;
    L.plots.push({x:sx0+cx*tw,y:oy+cy*th*0.86,w:tw,h:th});
  }

  /* --- животные --- */
  var yA=top+zoneP;
  if(hasA){
    var an=P.animals.length;
    var perRow=Math.min(4,Math.max(2,an));
    var arows=Math.ceil(an/perRow);
    var zoneA=free*fA;
    var aw=Math.min(W*0.84/perRow,84,(zoneA/arows)/0.78);
    var ah=aw*0.78;
    var ay=yA+(zoneA-(arows-1)*ah)/2;
    for(var k=0;k<an;k++){
      var rx=k%perRow,ry=(k/perRow)|0;
      var rowA=Math.min(perRow,an-ry*perRow);
      var startX=(W-(rowA-1)*aw)/2;
      L.anims.push({x:startX+rx*aw,y:ay+ry*ah,r:aw*0.34});
    }
  }

  /* --- цеха --- */
  var yM=yA+free*fA;
  if(hasM){
    var mn=P.machines.length;
    var perM=Math.min(3,Math.max(2,mn));
    var mrows=Math.ceil(mn/perM);
    var zoneM=free*fM;
    var mw=Math.min(W*0.86/perM,104,(zoneM/mrows)/0.82);
    var mh=mw*0.82;
    var my=yM+(zoneM-(mrows-1)*mh)/2;
    for(var j=0;j<mn;j++){
      var mx=j%perM,myy=(j/perM)|0;
      var rowM=Math.min(perM,mn-myy*perM);
      var sX=(W-(rowM-1)*mw)/2;
      L.machs.push({x:sX+mx*mw,y:my+myy*mh,r:mw*0.36});
    }
  }

  /* амбар — в правом нижнем углу, вне рядов зверей и цехов */
  L.barn={x:W-46,y:H-bot-26,r:30};
}
function plotCX(i){return L.plots[i]?L.plots[i].x:W/2;}
function plotCY(i){return L.plots[i]?L.plots[i].y:H/2;}
function animCX(i){return L.anims[i]?L.anims[i].x:W/2;}
function animCY(i){return L.anims[i]?L.anims[i].y:H/2;}

/* ---------- фон: небо, холмы, облака ---------- */
var clouds=[];
function initClouds(){
  clouds=[];
  for(var i=0;i<4;i++)clouds.push({x:rf(-60,W+60),y:rf(18,H*0.2),s:rf(.6,1.15),v:rf(3,9)});
}
function drawSky(dt){
  /* небо */
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#8fd3f4');g.addColorStop(.32,'#c7e9a0');g.addColorStop(1,'#7cc447');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* солнце */
  ctx.save();
  var sx=W*0.82,sy=H*0.07;
  var sg=ctx.createRadialGradient(sx,sy,4,sx,sy,64);
  sg.addColorStop(0,'rgba(255,244,180,.95)');
  sg.addColorStop(.45,'rgba(255,226,120,.55)');
  sg.addColorStop(1,'rgba(255,226,120,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,64,0,7);ctx.fill();
  ctx.fillStyle='#fff3a8';
  ctx.beginPath();ctx.arc(sx,sy,22,0,7);ctx.fill();
  ctx.restore();
  /* дальние холмы */
  ctx.fillStyle='#8fc86a';
  ctx.beginPath();ctx.moveTo(0,H*0.24);
  ctx.quadraticCurveTo(W*0.22,H*0.16,W*0.46,H*0.235);
  ctx.quadraticCurveTo(W*0.72,H*0.30,W,H*0.20);
  ctx.lineTo(W,H*0.34);ctx.lineTo(0,H*0.34);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7cc447';
  ctx.beginPath();ctx.moveTo(0,H*0.28);
  ctx.quadraticCurveTo(W*0.3,H*0.235,W*0.62,H*0.30);
  ctx.quadraticCurveTo(W*0.85,H*0.34,W,H*0.28);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  /* деревья на дальнем плане */
  for(var i=0;i<5;i++){
    var tx=W*(0.08+i*0.21),ty=H*0.245+Math.sin(i*1.7)*8;
    ctx.fillStyle='#5c8a3a';
    ctx.beginPath();ctx.arc(tx,ty,13,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(tx-8,ty+5,10,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(tx+8,ty+5,10,0,7);ctx.fill();
    ctx.fillStyle='#6b4a24';
    ctx.fillRect(tx-2.5,ty+10,5,10);
  }
  /* облака */
  ctx.fillStyle='rgba(255,255,255,.9)';
  for(var c=0;c<clouds.length;c++){
    var cl=clouds[c];
    cl.x+=cl.v*dt;
    if(cl.x>W+70){cl.x=-70;cl.y=rf(18,H*0.2);}
    var s=cl.s;
    ctx.beginPath();
    ctx.arc(cl.x,cl.y,17*s,0,7);
    ctx.arc(cl.x+19*s,cl.y+5*s,13*s,0,7);
    ctx.arc(cl.x-19*s,cl.y+6*s,12*s,0,7);
    ctx.arc(cl.x+5*s,cl.y-11*s,13*s,0,7);
    ctx.fill();
  }
}

/* ---------- грядка ---------- */
function drawPlot(i){
  var pos=L.plots[i],p=P.plots[i];
  if(!pos||!p)return;
  var x=pos.x,y=pos.y,w=pos.w*0.46,h=pos.h*0.46;
  ctx.save();
  ctx.translate(x,y);
  /* тень под грядкой */
  ctx.globalAlpha=.16;ctx.fillStyle='#1e3a10';
  ctx.beginPath();ctx.ellipse(0,h*0.34,w*1.02,h*0.6,0,0,7);ctx.fill();
  ctx.globalAlpha=1;
  /* земля-ромб */
  var g=ctx.createLinearGradient(0,-h,0,h);
  g.addColorStop(0,'#a97a4a');g.addColorStop(1,'#6b4a24');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(0,-h);ctx.lineTo(w,0);ctx.lineTo(0,h);ctx.lineTo(-w,0);
  ctx.closePath();ctx.fill();
  ctx.lineWidth=Math.max(2,w*0.07);
  ctx.strokeStyle='rgba(60,38,14,.65)';ctx.lineJoin='round';ctx.stroke();
  /* борозды */
  ctx.strokeStyle='rgba(52,32,12,.3)';ctx.lineWidth=Math.max(1.5,w*0.05);
  for(var k=-1;k<=1;k++){
    ctx.beginPath();
    ctx.moveTo(-w*0.62+k*w*0.3,h*0.3-k*h*0.05);
    ctx.lineTo(w*0.38+k*w*0.3,-h*0.3-k*h*0.05);
    ctx.stroke();
  }
  var st=plotState(p);
  if(st==='empty'){
    /* подсказка «посади» — пунктирный плюс */
    ctx.globalAlpha=.5;
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=Math.max(2,w*0.06);
    ctx.setLineDash([w*0.12,w*0.1]);
    ctx.beginPath();ctx.arc(0,-h*0.1,w*0.28,0,7);ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(-w*0.14,-h*0.1);ctx.lineTo(w*0.14,-h*0.1);
    ctx.moveTo(0,-h*0.1-w*0.14);ctx.lineTo(0,-h*0.1+w*0.14);
    ctx.stroke();
    ctx.globalAlpha=1;
  }else{
    var d=CMAP[p.crop],pr=plotProgress(p);
    var sz=w*0.62;
    if(st==='ready'){
      /* готово: подпрыгивает и светится */
      var bob=Math.sin(G.t*4+i)*h*0.10;
      ctx.save();
      ctx.globalAlpha=.42;
      var rg2=ctx.createRadialGradient(0,-h*0.3+bob,2,0,-h*0.3+bob,sz*1.5);
      rg2.addColorStop(0,'rgba(255,240,150,.9)');
      rg2.addColorStop(1,'rgba(255,240,150,0)');
      ctx.fillStyle=rg2;
      ctx.beginPath();ctx.arc(0,-h*0.3+bob,sz*1.5,0,7);ctx.fill();
      ctx.restore();
      ctx.save();ctx.translate(0,-h*0.34+bob);
      ART.draw(ctx,d.art,sz,G.t);
      ctx.restore();
      /* галочка «собери» */
      ctx.save();
      ctx.translate(w*0.62,-h*0.72+bob);
      ctx.fillStyle='#3fa724';
      ctx.beginPath();ctx.arc(0,0,w*0.20,0,7);ctx.fill();
      ctx.lineWidth=w*0.05;ctx.strokeStyle='#fff';
      ctx.beginPath();ctx.arc(0,0,w*0.20,0,7);ctx.stroke();
      ctx.lineWidth=w*0.07;ctx.lineCap='round';ctx.strokeStyle='#fff';
      ctx.beginPath();
      ctx.moveTo(-w*0.08,0);ctx.lineTo(-w*0.02,w*0.06);ctx.lineTo(w*0.09,-w*0.07);
      ctx.stroke();
      ctx.restore();
    }else{
      /* растёт: росток тянется вверх */
      var k2=0.35+pr*0.65;
      ctx.save();ctx.translate(0,-h*0.22);
      if(pr<0.45)ART.draw(ctx,'sprout',sz*0.62*k2,G.t);
      else{ctx.globalAlpha=.55+pr*0.45;ART.draw(ctx,d.art,sz*k2,G.t);}
      ctx.restore();
      /* таймер-полоска */
      var bw=w*1.05,bh=Math.max(4,h*0.16);
      var by=h*0.48;
      ctx.fillStyle='rgba(20,40,12,.55)';
      rrect(ctx,-bw/2,by,bw,bh,bh/2);ctx.fill();
      var fg=ctx.createLinearGradient(-bw/2,0,bw/2,0);
      fg.addColorStop(0,'#8fe36a');fg.addColorStop(1,'#4fc12a');
      ctx.fillStyle=fg;
      rrect(ctx,-bw/2,by,Math.max(bh,bw*pr),bh,bh/2);ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------- животное ---------- */
function drawAnimal(i){
  var pos=L.anims[i],a=P.animals[i];
  if(!pos||!a)return;
  var d=AMAP[a.kind],st=animalState(a);
  var x=pos.x,y=pos.y,r=pos.r;
  ctx.save();ctx.translate(x,y);
  /* тень */
  ctx.globalAlpha=.2;ctx.fillStyle='#1e3a10';
  ctx.beginPath();ctx.ellipse(0,r*0.86,r*0.86,r*0.28,0,0,7);ctx.fill();
  ctx.globalAlpha=1;
  /* лёгкое покачивание — зверь «живой» */
  var bob=Math.sin(G.t*2.2+i*1.3)*r*0.06;
  ctx.translate(0,bob);
  ART.draw(ctx,d.art,r,G.t);
  ctx.restore();
  /* значок состояния */
  ctx.save();ctx.translate(x+r*0.72,y-r*0.78);
  if(st==='hungry'){
    /* просит корм */
    var pul=1+Math.sin(G.t*5+i)*0.08;
    ctx.scale(pul,pul);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(0,0,r*0.34,0,7);ctx.fill();
    ctx.lineWidth=r*0.07;ctx.strokeStyle='#e0952c';
    ctx.beginPath();ctx.arc(0,0,r*0.34,0,7);ctx.stroke();
    ctx.save();ctx.scale(.62,.62);ART.draw(ctx,'wheat',r*0.5,0);ctx.restore();
  }else if(st==='ready'){
    var bob2=Math.sin(G.t*4+i)*r*0.1;
    ctx.translate(0,bob2);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(0,0,r*0.36,0,7);ctx.fill();
    ctx.lineWidth=r*0.07;ctx.strokeStyle='#3fa724';
    ctx.beginPath();ctx.arc(0,0,r*0.36,0,7);ctx.stroke();
    ctx.save();ctx.scale(.6,.6);ART.draw(ctx,GMAP[d.give].art,r*0.55,0);ctx.restore();
  }else{
    /* растёт — кольцевой таймер */
    var pr=animalProgress(a);
    ctx.lineWidth=r*0.14;
    ctx.strokeStyle='rgba(20,40,12,.35)';
    ctx.beginPath();ctx.arc(0,0,r*0.3,0,7);ctx.stroke();
    ctx.strokeStyle='#8fe36a';ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,0,r*0.3,-Math.PI/2,-Math.PI/2+pr*6.283);ctx.stroke();
  }
  ctx.restore();
}

/* ---------- цех ---------- */
function drawMachine(i){
  var pos=L.machs[i],m=P.machines[i];
  if(!pos||!m)return;
  var d=machineDef(m),r=pos.r;
  ctx.save();ctx.translate(pos.x,pos.y);
  ctx.globalAlpha=.2;ctx.fillStyle='#1e3a10';
  ctx.beginPath();ctx.ellipse(0,r*0.9,r*0.95,r*0.28,0,0,7);ctx.fill();
  ctx.globalAlpha=1;
  ART.draw(ctx,d.art,r,G.t);
  ctx.restore();
  /* очередь производства над цехом */
  var qn=m.queue.length;
  if(qn){
    var bw=r*1.7,bh=r*0.3,bx=pos.x-bw/2,by=pos.y-r*1.28;
    for(var q=0;q<qn;q++){
      var item=m.queue[q];
      var yy=by-q*(bh+3);
      ctx.fillStyle='rgba(20,40,12,.6)';
      rrect(ctx,bx,yy,bw,bh,bh/2);ctx.fill();
      var pr=cookProgress(item);
      var col=cookReady(item)?'#ffd964':'#8fe36a';
      ctx.fillStyle=col;
      rrect(ctx,bx,yy,Math.max(bh,bw*pr),bh,bh/2);ctx.fill();
      if(cookReady(item)){
        ctx.save();
        ctx.translate(bx+bw+r*0.24,yy+bh/2);
        var b3=Math.sin(G.t*4+q)*2;
        ctx.translate(0,b3);
        ART.draw(ctx,itemArt(item.out),r*0.26,0);
        ctx.restore();
      }
    }
  }
}

/* ---------- амбар ---------- */
function drawBarn(){
  if(!L.barn)return;
  var b=L.barn;
  ctx.save();ctx.translate(b.x,b.y);
  ctx.globalAlpha=.2;ctx.fillStyle='#1e3a10';
  ctx.beginPath();ctx.ellipse(0,b.r*0.88,b.r*0.9,b.r*0.26,0,0,7);ctx.fill();
  ctx.globalAlpha=1;
  ART.draw(ctx,'barn',b.r,G.t);
  ctx.restore();
  /* заполненность */
  var cnt=barnCount(),cap=P.barnCap;
  var bw=b.r*1.7,bh=8,bx=b.x-bw/2,by=b.y+b.r*0.95;
  ctx.fillStyle='rgba(20,40,12,.55)';
  rrect(ctx,bx,by,bw,bh,4);ctx.fill();
  var pr=clamp(cnt/cap,0,1);
  ctx.fillStyle=pr>0.9?'#ff7a6b':(pr>0.7?'#ffd964':'#8fe36a');
  rrect(ctx,bx,by,Math.max(4,bw*pr),bh,4);ctx.fill();
  ctx.font='900 10px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,255,255,.95)';
  ctx.strokeStyle='rgba(20,40,12,.8)';ctx.lineWidth=3;
  ctx.strokeText(cnt+'/'+cap,b.x,by+bh+2);
  ctx.fillText(cnt+'/'+cap,b.x,by+bh+2);
}

function rrect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}

/* ---------- главный кадр ---------- */
function render(dt){
  if(W<2)return;
  drawSky(dt);
  /* забор и мелочи на траве */
  drawFence();
  drawGround();
  drawSeasonDecor();
  for(var i=0;i<P.plots.length;i++)drawPlot(i);
  drawBarn();
  for(var a=0;a<P.animals.length;a++)drawAnimal(a);
  for(var m=0;m<P.machines.length;m++)drawMachine(m);
  /* бабочки */
  for(var bb=0;bb<G.butterflies.length;bb++)drawButterfly(G.butterflies[bb]);
  /* щенок и кот */
  drawPet();
  drawCat();
  /* частицы */
  for(var p=0;p<G.parts.length;p++){
    var q=G.parts[p];
    ctx.globalAlpha=Math.max(0,1-q.t/q.life);
    ctx.fillStyle=q.c;
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  /* всплывающий текст */
  ctx.font='900 15px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var k=0;k<G.pops.length;k++){
    var t=G.pops[k];
    ctx.globalAlpha=Math.max(0,1-t.t/t.life);
    ctx.lineWidth=4;ctx.strokeStyle='rgba(20,40,12,.7)';
    ctx.strokeText(t.txt,t.x,t.y);
    ctx.fillStyle=t.c;ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;
  drawWeather();
  drawNightOverlay();
  drawFireflies();
}

/* ---------- КОТ ---------- */
function drawCat(){
  var c=G.cat;
  if(!c||W<2)return;
  var x=c.x,y=c.y,s=Math.min(W,H)/470;
  /* подкрадывание к грядке: кот прыгает к цели */
  if(c.prankT>0){
    var pr=1-c.prankT/1.6;
    var sx=c.x,sy=H-96;
    var tx=c.targetX||c.x,ty=c.targetY||(H-96);
    x=sx+(tx-sx)*Math.min(1,pr*1.4);
    /* дуга прыжка */
    var arc=Math.sin(Math.min(1,pr*1.4)*Math.PI)*46*s;
    y=sy+(ty-sy)*Math.min(1,pr*1.4)-arc;
    c.dir=(tx>=sx)?1:-1;
    /* в момент приземления — сбиваем урожай */
    if(pr>0.72&&!c.prankHit)catPrankHit();
    if(c.prankT<=0.2){c.prankHit=0;c.targetPlot=-1;}
  }
  /* тень */
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath();ctx.ellipse(x,y+20*s,14*s,3.6*s,0,0,7);ctx.fill();
  var sit=c.state==='sit';
  var bob=Math.sin(c.t*3)*1.5;
  /* хвост-крючок */
  ctx.strokeStyle='#3a6a2a';ctx.lineWidth=3*s;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-c.dir*11*s,y+4*s+bob);
  ctx.quadraticCurveTo(x-c.dir*16*s,y-4*s+bob,x-c.dir*14*s,y-12*s+bob);
  ctx.stroke();
  /* тело */
  ctx.fillStyle='#4a8a3a';
  ctx.beginPath();ctx.ellipse(x,y+4*s+bob,11*s,8*s,0,0,7);ctx.fill();
  ctx.fillStyle='#5aa04a';
  ctx.beginPath();ctx.ellipse(x,y+5*s+bob,6*s,4*s,0,0,7);ctx.fill();
  /* голова */
  ctx.fillStyle='#4a8a3a';
  ctx.beginPath();ctx.arc(x+c.dir*9*s,y-5*s+bob,7*s,0,7);ctx.fill();
  /* уши-треугольники */
  ctx.fillStyle='#4a8a3a';
  ctx.beginPath();
  ctx.moveTo(x+c.dir*3*s,y-10*s+bob);
  ctx.lineTo(x+c.dir*1*s,y-19*s+bob);
  ctx.lineTo(x+c.dir*8*s,y-11*s+bob);
  ctx.closePath();ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+c.dir*10*s,y-10*s+bob);
  ctx.lineTo(x+c.dir*14*s,y-18*s+bob);
  ctx.lineTo(x+c.dir*15*s,y-9*s+bob);
  ctx.closePath();ctx.fill();
  /* мордочка */
  ctx.fillStyle='#d8f0c8';
  ctx.beginPath();ctx.ellipse(x+c.dir*13*s,y-4*s+bob,3.6*s,3*s,0,0,7);ctx.fill();
  /* нос */
  ctx.fillStyle='#ff9ab0';
  ctx.beginPath();ctx.arc(x+c.dir*15*s,y-4*s+bob,1.2*s,0,7);ctx.fill();
  /* глаз */
  ctx.fillStyle='#1a2a10';
  ctx.beginPath();ctx.arc(x+c.dir*10*s,y-7*s+bob,1.6*s,0,7);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(x+c.dir*10.5*s,y-7.6*s+bob,.6*s,0,7);ctx.fill();
  /* усы */
  ctx.strokeStyle='rgba(40,60,30,.5)';ctx.lineWidth=.8*s;
  ctx.beginPath();
  ctx.moveTo(x+c.dir*12*s,y-3*s+bob);ctx.lineTo(x+c.dir*20*s,y-5*s+bob);
  ctx.moveTo(x+c.dir*12*s,y-2*s+bob);ctx.lineTo(x+c.dir*20*s,y-1*s+bob);
  ctx.stroke();
  /* сердечки при поглаживании */
  if(c.joy>0){
    ctx.font='900 '+(12+c.joy*8)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ff5a7a';
    ctx.fillText('❤️',x,y-28*s-c.joy*14);
    ctx.font='900 11px sans-serif';
    ctx.fillStyle='#9ad87a';
    ctx.fillText('Мур!',x,y-18*s);
  }
  if(P.tutorCat&&c.happy<5){
    ctx.font='900 10px sans-serif';ctx.textAlign='center';
    ctx.fillStyle='rgba(20,40,12,.75)';
    ctx.fillText('Погладь котика!',x,y+32*s);
  }
}
/* ---------- СВЕТЛЯЧКИ ---------- */
function drawFireflies(){
  var nf=nightFactor();
  if(nf<=0.05)return;
  ctx.save();
  ctx.globalAlpha=nf;
  for(var i=0;i<G.fireflies.length;i++){
    var f=G.fireflies[i];
    var glow=.4+.6*Math.abs(Math.sin(f.ph*2.5));
    ctx.fillStyle='rgba(255,244,120,'+(0.5+glow*0.5)+')';
    ctx.beginPath();ctx.arc(f.x,f.y,2.2,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,244,120,.25)';
    ctx.beginPath();ctx.arc(f.x,f.y,5.5,0,7);ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha=1;
}
/* ---------- НОЧНОЙ ОВЕРЛЕЙ ---------- */
function drawNightOverlay(){
  var nf=nightFactor();
  if(nf<=0.02)return;
  ctx.save();
  ctx.globalAlpha=nf*0.5;
  ctx.fillStyle='#0a1030';
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=nf;
  /* звёзды */
  for(var i=0;i<26;i++){
    var sx=(i*83+17)%W, sy=(i*53+11)%(H*0.55);
    var tw=.5+.5*Math.abs(Math.sin(G.t*1.3+i));
    ctx.fillStyle='rgba(255,255,255,'+(0.4+tw*0.6)+')';
    ctx.fillRect(sx,sy,2,2);
  }
  /* луна */
  var mx=W*0.82,my=H*0.09;
  ctx.fillStyle='#f0f0c8';
  ctx.beginPath();ctx.arc(mx,my,18,0,7);ctx.fill();
  ctx.fillStyle='#d8d8a8';
  ctx.beginPath();ctx.arc(mx+4,my-3,13,0,7);ctx.fill();
  ctx.fillStyle='rgba(10,16,48,.5)';
  ctx.beginPath();ctx.arc(mx-5,my+4,4,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(mx+6,my+8,3,0,7);ctx.fill();
  ctx.restore();
  ctx.globalAlpha=1;
}
/* ---------- СЕЗОННЫЕ УКРАШЕНИЯ ---------- */
function drawSeasonDecor(){
  var s=G.season;
  if(s==='spring'){
    /* цветочки + пасхальные яйца */
    for(var i=0;i<14;i++){
      var x=(i*71+23)%W, y=H*0.38+((i*47)%(H*0.5));
      ctx.fillStyle='#ff8ab0';
      ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();
      ctx.fillStyle='#ffd24a';
      ctx.beginPath();ctx.arc(x,y,1.2,0,7);ctx.fill();
    }
    /* пасхальные яйца */
    var eggCols=['#ff6aa8','#6ac8ff','#ffd24a','#7ef0b0','#c39aff'];
    for(var e=0;e<6;e++){
      var ex=(e*113+37)%W, ey=H*0.42+((e*61)%(H*0.45));
      ctx.fillStyle=eggCols[e%5];
      ctx.beginPath();ctx.ellipse(ex,ey,3.2,4.2,0,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.7)';
      ctx.beginPath();ctx.ellipse(ex-1,ey-1.2,1,1.4,0,0,7);ctx.fill();
    }
  }else if(s==='autumn'){
    /* листья + тыквы-хэллоуин */
    for(var i=0;i<12;i++){
      var x=(i*89+11)%W, y=H*0.36+((i*53)%(H*0.55));
      ctx.fillStyle=(i%2)?'#d98a2a':'#c05a1e';
      ctx.beginPath();ctx.ellipse(x,y,3.4,2.2,0.5,0,7);ctx.fill();
    }
    for(var p=0;p<4;p++){
      var px=(p*167+53)%W, py=H*0.46+((p*73)%(H*0.4));
      ctx.fillStyle='#e8821a';
      ctx.beginPath();ctx.ellipse(px,py,5,4.4,0,0,7);ctx.fill();
      ctx.fillStyle='#c06a10';
      ctx.beginPath();ctx.arc(px,py-4,1.4,0,7);ctx.fill();
      /* глаза-треугольники */
      ctx.fillStyle='#2a1000';
      ctx.beginPath();ctx.arc(px-2,py-1,1,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(px+2,py-1,1,0,7);ctx.fill();
      ctx.fillStyle='#ffd24a';
      ctx.beginPath();ctx.arc(px-2,py-1,.5,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(px+2,py-1,.5,0,7);ctx.fill();
    }
  }else if(s==='winter'){
    /* снежинки + новогодняя гирлянда */
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.2;
    for(var i=0;i<16;i++){
      var x=(i*67+G.t*8)%W, y=(i*41+G.t*30)%H;
      ctx.beginPath();
      ctx.moveTo(x,y-4);ctx.lineTo(x,y+4);
      ctx.moveTo(x-3,y-2);ctx.lineTo(x+3,y+2);
      ctx.moveTo(x+3,y-2);ctx.lineTo(x-3,y+2);
      ctx.stroke();
    }
    /* гирлянда по забору (верхняя линия) */
    var gy=H*0.36;
    var garCols=['#ff5a5a','#ffd24a','#6ac8ff','#7ef0b0','#ff9ac8'];
    ctx.strokeStyle='rgba(60,80,30,.6)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(0,gy);
    for(var gx=0;gx<=W;gx+=40){
      ctx.quadraticCurveTo(gx+20,gy+(Math.sin(gx*0.1+G.t)*6),gx+40,gy);
    }
    ctx.stroke();
    for(var g=0;g<W/24;g++){
      var lx=g*24+12;
      var on=Math.sin(G.t*2+g*1.7)>-0.2;
      ctx.fillStyle=garCols[g%5];
      ctx.globalAlpha=on?1:.25;
      ctx.beginPath();ctx.arc(lx,gy+Math.sin(lx*0.1+G.t)*6,2.6,0,7);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}
function drawPet(){
  var pet=G.pet;
  if(!pet||W<2)return;
  var x=pet.x,y=pet.y,s=Math.min(W,H)/430;
  /* тень */
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath();ctx.ellipse(x,y+22*s,16*s,4*s,0,0,7);ctx.fill();
  var sit=pet.state==='sit';
  var bob=Math.sin(pet.t*4)*1.5;
  /* лапки */
  ctx.strokeStyle='#7a4a1e';ctx.lineWidth=3.4*s;ctx.lineCap='round';
  ctx.beginPath();
  if(sit){
    ctx.moveTo(x-8*s,y+8*s);ctx.lineTo(x-9*s,y+18*s);
    ctx.moveTo(x+8*s,y+8*s);ctx.lineTo(x+9*s,y+18*s);
  }else{
    var leg=Math.sin(pet.t*10)*4;
    ctx.moveTo(x-9*s,y+6*s);ctx.lineTo(x-11*s+leg,y+19*s);
    ctx.moveTo(x+9*s,y+6*s);ctx.lineTo(x+11*s-leg,y+19*s);
  }
  ctx.stroke();
  /* тело */
  ctx.fillStyle='#c98a4a';
  ctx.beginPath();ctx.ellipse(x,y+2*s+bob,13*s,9*s,0,0,7);ctx.fill();
  ctx.fillStyle='#e8b878';
  ctx.beginPath();ctx.ellipse(x,y+4*s+bob,8*s,5*s,0,0,7);ctx.fill();
  /* голова */
  ctx.fillStyle='#c98a4a';
  ctx.beginPath();ctx.arc(x+pet.dir*10*s,y-6*s+bob,8*s,0,7);ctx.fill();
  /* уши */
  ctx.fillStyle='#7a4a1e';
  ctx.beginPath();
  ctx.moveTo(x+pet.dir*4*s,y-12*s+bob);
  ctx.lineTo(x+pet.dir*2*s,y-22*s+bob);
  ctx.lineTo(x+pet.dir*10*s,y-10*s+bob);
  ctx.closePath();ctx.fill();
  /* мордочка */
  ctx.fillStyle='#f4d9b0';
  ctx.beginPath();ctx.ellipse(x+pet.dir*14*s,y-5*s+bob,4.5*s,3.6*s,0,0,7);ctx.fill();
  /* нос */
  ctx.fillStyle='#3a2010';
  ctx.beginPath();ctx.arc(x+pet.dir*17*s,y-5*s+bob,1.6*s,0,7);ctx.fill();
  /* глаз */
  ctx.fillStyle='#241505';
  ctx.beginPath();ctx.arc(x+pet.dir*11*s,y-8*s+bob,1.8*s,0,7);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(x+pet.dir*11.6*s,y-8.6*s+bob,.7*s,0,7);ctx.fill();
  /* хвост — виляет */
  var wag=Math.sin(pet.t*12)*5;
  ctx.strokeStyle='#7a4a1e';ctx.lineWidth=3*s;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-pet.dir*12*s,y-2*s+bob);
  ctx.quadraticCurveTo(x-pet.dir*18*s,y-10*s+wag,x-pet.dir*20*s,y-16*s+wag);
  ctx.stroke();
  /* сердечки при поглаживании */
  if(pet.joy>0){
    ctx.font='900 '+(13+pet.joy*8)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ff5a7a';
    ctx.fillText('❤️',x,y-30*s-pet.joy*14);
    ctx.font='900 12px sans-serif';
    ctx.fillStyle='#ffd24a';
    ctx.fillText('Гав!',x,y-20*s);
  }
  /* подсказка при первом знакомстве */
  if(P.tutorPet&&pet.happy<5){
    ctx.font='900 10px sans-serif';ctx.textAlign='center';
    ctx.fillStyle='rgba(20,40,12,.75)';
    ctx.fillText('Погладь меня!',x,y+34*s);
  }
}

function drawButterfly(b){

  ctx.globalAlpha=.9;

  ctx.fillStyle='#ff9ac8';
  ctx.beginPath();ctx.ellipse(-3,-2*fl,3.5,2.5,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(3,-2*fl,3.5,2.5,0,0,7);ctx.fill();
  ctx.fillStyle='#ff6aa8';
  ctx.beginPath();ctx.ellipse(-2.5,2*fl,2.4,1.8,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(2.5,2*fl,2.4,1.8,0,0,7);ctx.fill();
  /* тело */
  ctx.fillStyle='#3a2010';

/* ---------- ДОЖДЬ И РАДУГА ---------- */
function drawWeather(){
  var w=G.weather;
  if(w.type==='rain'){
    ctx.strokeStyle='rgba(140,190,255,.55)';ctx.lineWidth=1.6;
    for(var i=0;i<w.rain.length;i++){
      var d=w.rain[i];
      ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-2,d.y+10);ctx.stroke();
    }
  }
  if(w.rainbow>0){
    var cx=W*0.5,cy=H*0.95,rad=Math.min(W*0.6,H*0.8);
    var cols=['#ff5a5a','#ff9a3a','#ffd24a','#7ef0b0','#6ac8ff','#c39aff'];
    ctx.save();
    ctx.globalAlpha=Math.min(1,w.rainbow)*0.75;
    ctx.lineWidth=6;
    for(var c=0;c<cols.length;c++){
      ctx.strokeStyle=cols[c];
      ctx.beginPath();ctx.arc(cx,cy,rad-c*6,Math.PI,0);ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }
}
/* Детали лужайки: кустики, цветы, камешки, дорожка.
   Позиции считаются один раз по фиксированному зерну — сцена
   стабильна между кадрами и не «мигает». */
var groundPts=null,groundKey='';
function buildGround(){
  var seed=1337;
  function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
  var pts=[];
  var y0=H*0.36,y1=H-96;
  for(var i=0;i<26;i++){
    pts.push({
      x:rnd()*W,
      y:y0+rnd()*(y1-y0),
      t:rnd(),
      s:0.7+rnd()*0.7
    });
  }
  groundPts=pts;
}
function drawGround(){
  var key=W+'x'+H;
  if(!groundPts||groundKey!==key){buildGround();groundKey=key;}
  /* мягкая дорожка от амбара вглубь фермы */
  ctx.save();
  ctx.globalAlpha=.20;
  ctx.strokeStyle='#d8c89a';
  ctx.lineWidth=Math.max(16,W*0.055);
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(W*0.5,H*0.38);
  ctx.quadraticCurveTo(W*0.62,H*0.62,W*0.86,H-120);
  ctx.stroke();
  ctx.restore();

  for(var i=0;i<groundPts.length;i++){
    var g=groundPts[i],s=g.s*7;
    ctx.save();ctx.translate(g.x,g.y);
    if(g.t<0.42){
      /* пучок травы */
      ctx.strokeStyle='rgba(78,150,44,.55)';
      ctx.lineWidth=s*0.28;ctx.lineCap='round';
      for(var k=-1;k<=1;k++){
        ctx.beginPath();
        ctx.moveTo(k*s*0.34,0);
        ctx.quadraticCurveTo(k*s*0.5,-s*0.6,k*s*0.75,-s*1.0);
        ctx.stroke();
      }
    }else if(g.t<0.66){
      /* ромашка */
      ctx.fillStyle='#fff';
      for(var f=0;f<5;f++){
        var a=f*1.256;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a)*s*0.34,Math.sin(a)*s*0.34,s*0.24,s*0.16,a,0,7);
        ctx.fill();
      }
      ctx.fillStyle='#ffd964';
      ctx.beginPath();ctx.arc(0,0,s*0.22,0,7);ctx.fill();
    }else if(g.t<0.84){
      /* кустик */
      ctx.fillStyle='#5c9c38';
      ctx.beginPath();ctx.arc(-s*0.32,0,s*0.42,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(s*0.3,s*0.06,s*0.36,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(0,-s*0.24,s*0.44,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.16)';
      ctx.beginPath();ctx.arc(-s*0.12,-s*0.4,s*0.18,0,7);ctx.fill();
    }else{
      /* камешек */
      ctx.fillStyle='rgba(150,160,150,.5)';
      ctx.beginPath();ctx.ellipse(0,0,s*0.4,s*0.28,0.3,0,7);ctx.fill();
    }
    ctx.restore();
  }
}
function drawFence(){
  var y=H*0.335;
  ctx.strokeStyle='#c49a68';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,y+9);ctx.lineTo(W,y+9);ctx.stroke();
  ctx.strokeStyle='#a87f52';ctx.lineWidth=7;
  for(var x=14;x<W;x+=52){
    ctx.beginPath();ctx.moveTo(x,y-9);ctx.lineTo(x,y+17);ctx.stroke();
  }
}
