function stepFx(dt){
  /* воздушный шар с подарком */
  if(G.balloon){
    if(!G.balloon.active){
      G.balloon.timer-=dt;
      if(G.balloon.timer<=0&&W>100){
        G.balloon.active=true;
        G.balloon.x=-50;
        G.balloon.y=rf(35,Math.min(130,H*0.2));
        G.balloon.speed=rf(24,36);
        G.balloon.color=Math.floor(Math.random()*4);
        G.balloon.t=0;
      }
    }else{
      G.balloon.t+=dt;
      G.balloon.x+=G.balloon.speed*dt;
      if(G.balloon.x>W+60){
        G.balloon.active=false;
        G.balloon.timer=rf(55,100);
      }
    }
  }
  for(var i=G.parts.length-1;i>=0;i--){
    var p=G.parts[i];p.t+=dt;
    if(p.t>=p.life){G.parts.splice(i,1);continue;}
    p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  for(var k=G.pops.length-1;k>=0;k--){
    var q=G.pops[k];q.t+=dt;q.y-=34*dt;
    if(q.t>=q.life)G.pops.splice(k,1);
  }
  stepPet(dt);stepCat(dt);stepButterflies(dt);stepWeather(dt);
  stepGifts(dt);stepCoinRain(dt);stepTruck(dt);
  stepDuck(dt);stepFair(dt);stepHelper(dt);stepPetals(dt);
  stepNight(dt);stepFireflies(dt);stepPetGame(dt);stepButterflyGame(dt);stepSeason(dt);
  stepCatPrank(dt);
}
/* ---------- КОТ ---------- */
function stepCat(dt){
  var c=G.cat;
  if(!c||W<2)return;
  if(c.joy>0)c.joy-=dt;
  c.happy=Math.max(0,c.happy-dt*0.004);
  c.t+=dt;
  if(c.state==='walk'){
    c.x+=c.dir*26*dt;
    if(c.x<W*0.55){c.x=W*0.55;c.dir=1;}
    if(c.x>W-40){c.x=W-40;c.dir=-1;}
    if(Math.random()<dt*0.5){c.state='sit';c.t=0;}
  }else if(c.state==='sit'){
    if(c.t>rf(1.5,3)){c.state='walk';if(Math.random()<.4)c.dir*=-1;}
  }
  c.y=H-96+Math.sin(c.t*2.5)*2;
}
/* ---------- КОТ-ШАЛУН: сбивает урожай ---------- */
function stepCatPrank(dt){
  var c=G.cat;
  if(!c||W<2)return;
  /* сытый кот не шалит */
  c.fedT=Math.max(0,c.fedT-dt);
  c.prankT=Math.max(0,c.prankT-dt);
  if(c.fedT>0||c.prankT>0)return;
  c.prankCd-=dt;
  if(c.prankCd>0)return;
  /* найдём поспевшую грядку */
  var target=-1;
  for(var i=0;i<P.plots.length;i++){
    if(plotState(P.plots[i])==='ready'){target=i;break;}
  }
  if(target<0){c.prankCd=rf(15,30);return;}
  /* кот крадётся к грядке и сбивает её */
  c.prankT=1.6;
  c.prankCd=rf(30,55);
  c.targetPlot=target;
  var px=plotCX(target),py=plotCY(target);
  c.targetX=px;c.targetY=py-8;
  sfx('jump');haptic('light');
}
/* подкрадывание: рисуется в drawCat через состояние prankT */
function catPrankHit(){
  var c=G.cat;
  if(!c||c.prankT>1.0)return;
  var t=c.targetPlot;
  if(t<0||t>=P.plots.length)return;
  var p=P.plots[t];
  if(!p||plotState(p)!=='ready')return;
  var d=CMAP[p.crop];
  p.crop=null;p.at=0;
  sfx('cat');sfx('pop');haptic('medium');
  burstXY(plotCX(t),plotCY(t),'#e8c878',10);
  popText(plotCX(t),plotCY(t)-14,'😹 Сбил!','#d97a1a');
  c.prankHit=1;
  /* если урожай был — кот «приносит» монетку-извинение */
  if(d){
    var coin=Math.max(1,Math.round(d.pr/10));
    P.coins+=coin;
    popText(plotCX(t),plotCY(t)-30,'+'+coin+' 🪙','#ffd24a');
  }
  save();
}
/* ---------- КОРМ ДЛЯ КОТА (за монеты — кот не шалит) ---------- */
var CAT_FEED_COST=15;
function feedCat(){
  if(P.coins<CAT_FEED_COST){sfx('err');toast('Не хватает монет!');return;}
  P.coins-=CAT_FEED_COST;
  G.cat.fedT=90;
  G.cat.joy=1;G.cat.happy=Math.min(100,G.cat.happy+15);
  sfx('cat');haptic('light');
  burstXY(G.cat.x,G.cat.y-20,'#ffd24a',8);
  popText(G.cat.x,G.cat.y-34,'🐟 Мур!','#9ad87a');
  save();
  toast('🐟 Кот сыт и не шалит 90с!');
}
/* ---------- МИНИ-ИГРА «ПОЙМАЙ БАБОЧКУ» ---------- */
function startButterflyGame(){
  var g=G.butterflyGame;
  g.active=true;g.t=0;g.caught=0;g.target=5;
  /* бабочек побольше и быстрее */
  if(G.butterflies.length<8){
    for(var i=G.butterflies.length;i<8;i++){
      G.butterflies.push({x:rf(30,W-30),y:rf(H*0.15,H*0.45),a:rf(0,6.28),sp:rf(40,80),fl:rf(0,6)});
    }
  }
  toast('🦋 Лови бабочек! Тапай по ним!');
}
function stepButterflyGame(dt){
  var g=G.butterflyGame;
  if(!g.active)return;
  g.t+=dt;
  /* бабочки летают быстрее во время игры */
  for(var i=0;i<G.butterflies.length;i++){
    var b=G.butterflies[i];
    b.a+=b.sp*dt*0.12*(Math.random()<.5?1:-1);
    b.x+=Math.cos(b.a)*(b.sp*1.6)*dt;
    b.y+=Math.sin(b.a*1.3)*40*dt;
    if(b.x<20){b.x=20;b.a=Math.PI-b.a;}
    if(b.x>W-20){b.x=W-20;b.a=Math.PI-b.a;}
    if(b.y<H*0.1)b.y=H*0.1;
    if(b.y>H*0.55)b.y=H*0.55;
  }
  if(g.t>8){
    g.active=false;
    if(g.caught>=g.target){
      var prize=25+P.lvl*6;
      P.coins+=prize;
      sfx('win');haptic('heavy');
      confettiBurst();
      toast('🎉 Поймал '+g.caught+' бабочек! +'+prize+' 🪙');
      save();
    }else{
      toast('😅 Поймал '+g.caught+' из '+g.target+'. Ещё раз?');
    }
  }
}
function butterflyCatch(b){
  var g=G.butterflyGame;
  if(!g.active)return;
  /* убираем пойманную и добавляем новую */
  var idx=G.butterflies.indexOf(b);
  if(idx>=0)G.butterflies.splice(idx,1);
  g.caught++;
  sfx('score');haptic('light');
  burstXY(b.x,b.y,'#ff9ac8',8);
  popText(b.x,b.y-14,'+1','#ff6aa8');
  G.butterflies.push({x:rf(30,W-30),y:rf(H*0.15,H*0.45),a:rf(0,6.28),sp:rf(40,80),fl:rf(0,6)});
  if(g.caught>=g.target){
    /* досрочно — сразу награда */
    g.t=99;
    stepButterflyGame(0.1);
  }
}
/* ---------- НОЧЬ ---------- */
function stepNight(dt){
  var n=G.night;
  if(!nightOn()){
    /* ночь отключена игроком — всегда день */
    if(n.on||n.t!==n.cycle){n.on=false;n.t=n.cycle;}
    return;
  }
  n.t+=dt;
  if(n.t>n.cycle){
    n.t=0;
    n.on=!n.on;
    toast(n.on?'🌙 Наступила ночь!':'☀️ Снова день!');
    /* один раз подсказываем, что ночь можно отключить */
    if(n.on&&!P.seen.nightHint){
      P.seen.nightHint=1;save();
      setTimeout(function(){toast('☀️ Ночь можно выключить — кнопка в шапке или в «Ещё»');},2800);
    }
  }
}
function nightFactor(){
  /* 0 = день, 1 = ночь */
  if(!nightOn())return 0;
  var n=G.night;
  var p=n.t/n.cycle;
  return n.on?Math.min(1,p*3):Math.max(0,1-p*3);
}
/* ---------- СВЕТЛЯЧКИ ---------- */
function stepFireflies(dt){
  for(var i=0;i<G.fireflies.length;i++){
    var f=G.fireflies[i];
    f.ph+=dt;
    f.x+=Math.sin(f.ph*0.7)*f.sp*dt;
    f.y+=Math.cos(f.ph*0.9)*f.sp*0.6*dt;
    if(f.x<8)f.x=8;if(f.x>W-8)f.x=W-8;
    if(f.y<H*0.1)f.y=H*0.1;if(f.y>H*0.85)f.y=H*0.85;
  }
}
/* ---------- МИНИ-ИГРА «ДОГОНИ ЩЕНКА» ---------- */
function startPetGame(){
  var g=G.game;
  g.active=true;g.t=0;g.catches=0;
  g.target=3;
  G.pet.state='run';G.pet.dir=Math.random()<.5?1:-1;
  toast('🐶 Догони щенка! Тапай по нему '+g.target+' раз!');
}
function stepPetGame(dt){
  var g=G.game;
  if(!g.active)return;
  g.t+=dt;
  /* щенок убегает быстрее */
  if(G.pet.state==='run'){
    G.pet.x+=G.pet.dir*(90+Math.sin(g.t*6)*20)*dt;
    if(G.pet.x<40){G.pet.x=40;G.pet.dir=1;}
    if(G.pet.x>W-40){G.pet.x=W-40;G.pet.dir=-1;}
    G.pet.y=H-86+Math.sin(G.pet.t*6)*4;
  }
  if(g.t>9){
    g.active=false;
    G.pet.state='sit';
    toast('😅 Щенок убежал! Попробуй ещё!');
  }
}
function petGameCatch(){
  var g=G.game;
  if(!g.active)return;
  g.catches++;
  sfx('dog');haptic('light');
  burstXY(G.pet.x,G.pet.y-24,'#ffd24a',8);
  if(g.catches>=g.target){
    g.active=false;
    G.pet.state='sit';
    var prize=20+P.lvl*5;
    P.coins+=prize;
    sfx('win');haptic('heavy');
    confettiBurst();
    popText(G.pet.x,G.pet.y-30,'+'+prize+' 🪙','#ffd24a');
    toast('🎉 Поймал щенка! +'+prize+' монет');
    save();
  }else{
    popText(G.pet.x,G.pet.y-30,(g.target-g.catches)+'!','#fff');
    /* щенок меняет направление — сложнее */
    G.pet.dir=Math.random()<.5?1:-1;
  }
}
/* ---------- СЕЗОНЫ ---------- */
function stepSeason(dt){
  G.seasonT+=dt;
  if(G.seasonT>60){
    G.seasonT=0;
    if(P.season&&P.season!=='auto'){G.season=P.season;return;}
    var s=['spring','summer','autumn','winter'];
    var i=s.indexOf(G.season);
    G.season=s[(i+1)%4];
    toast('🍂 Наступила '+seasonName(G.season)+'!');
  }
}
function seasonName(s){
  return s==='spring'?'весна':(s==='summer'?'лето':(s==='autumn'?'осень':'зима'));
}
/* ---------- ЩЕНОК-ПИТОМЕЦ ---------- */
function stepPet(dt){
  var pet=G.pet;
  if(!pet||W<2)return;
  if(pet.joy>0)pet.joy-=dt;
  pet.happy=Math.max(0,pet.happy-dt*0.004);
  pet.t+=dt;
  if(pet.state==='walk'){
    pet.x+=pet.dir*38*dt;
    if(pet.x<40){pet.x=40;pet.dir=1;}
    if(pet.x>W*0.42){pet.x=W*0.42;pet.dir=-1;}
    if(Math.random()<dt*0.8){pet.state='sit';pet.t=0;}
  }else if(pet.state==='sit'){
    if(pet.t>rf(1.2,2.5)){pet.state='walk';if(Math.random()<.4)pet.dir*=-1;}
  }
  pet.y=H-86+Math.sin(pet.t*3)*2;
}
function petXY(){return {x:G.pet.x,y:G.pet.y};}
/* ---------- БАБОЧКИ ---------- */
function stepButterflies(dt){
  for(var i=0;i<G.butterflies.length;i++){
    var b=G.butterflies[i];
    b.a+=b.sp*dt*0.05*(Math.random()<.5?1:-1);
    b.x+=Math.cos(b.a)*b.sp*dt;
    b.y+=Math.sin(b.a*1.3)*26*dt;
    b.fl+=dt;
    if(b.x<20){b.x=20;b.a=Math.PI-b.a;}
    if(b.x>W-20){b.x=W-20;b.a=Math.PI-b.a;}
    if(b.y<H*0.12)b.y=H*0.12;
    if(b.y>H*0.5)b.y=H*0.5;
  }
}
/* ---------- ПОГОДА: дождик и радуга ---------- */
function stepWeather(dt){
  var w=G.weather;
  w.t+=dt;w.next-=dt;
  if(w.type==='sun'&&w.next<=0){
    w.type='rain';w.t=0;w.rain=[];
    /* дождик поливает грядки: +25% прогресса роста */
    var boosted=0;
    P.plots.forEach(function(p){
      if(p.crop&&plotState(p)==='grow'){p.at=now()-(now()-p.at)*1.25;boosted++;}
    });
    toast(boosted?'🌧 Дождик полил грядки: +25% роста!':'🌧 Поливает дождик!');
  }else if(w.type==='rain'){
    /* капли */
    if(Math.random()<dt*26&&w.rain.length<40){
      w.rain.push({x:rf(0,W),y:rf(-40,H*0.4),v:rf(260,420)});
    }
    for(var i=w.rain.length-1;i>=0;i--){
      var d=w.rain[i];d.y+=d.v*dt;d.x-=d.v*0.12*dt;
      if(d.y>H){w.rain.splice(i,1);}
    }
    if(w.t>5){w.type='rainbow';w.t=0;w.rainbow=1;}
  }else if(w.type==='rainbow'){
    w.rainbow=Math.max(0,w.rainbow-dt/3);
    if(w.t>12){w.type='sun';w.next=rf(40,70);}
  }
}
/* ============================================================
   14. ОТРИСОВКА ФЕРМЫ
   Псевдо-изометрия: грядки лежат ромбами, постройки стоят рядами.
   Всё позиционируется от layout() — он же даёт координаты для тапов.
   ============================================================ */
var cv=$('cv'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
var L={plots:[],anims:[],pens:[],machs:[],barn:null,tile:60,fenceY:0};

function resize(){
  var r=$('app').getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=r.width;H=r.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
  initPets();
}
window.addEventListener('resize',function(){setTimeout(resize,80);});
window.addEventListener('orientationchange',function(){setTimeout(resize,260);});
if(window.visualViewport)window.visualViewport.addEventListener('resize',function(){setTimeout(resize,120);});

/* Раскладка сцены. Считаем один раз при изменениях, а не каждый кадр:
   так тапы и отрисовка гарантированно совпадают. */
function layout(){
  if(W<2)return;
  var top=78,bot=104;
  var PCW=W>=760;   /* широкий экран ПК: крупнее плитки */
  var free=H-top-bot;
  L.plots=[];L.anims=[];L.pens=[];L.machs=[];

  /* Сцена делится на три зоны по высоте: грядки, загоны для зверей и цеха. */
  var hasA=P.animals.length>0, hasM=P.machines.length>0;
  var fP=(hasA&&hasM)?0.42:(hasA||hasM)?0.54:0.84;
  var fA=hasA?((hasM)?0.32:0.42):0;
  var fM=hasM?((hasA)?0.26:0.36):0;

  /* --- грядки --- */
  var n=P.plots.length;
  var cols=n<=4?2:(n<=9?3:(n<=16?4:(n<=25?5:6)));
  var rows=Math.ceil(n/cols);
  var zoneP=free*fP;
  var tw=Math.min(W*0.88/cols,PCW?120:92,(zoneP/rows)/0.62/0.9);
  var th=tw*0.62;
  L.tile=tw;
  var gw=(cols-1)*tw+tw;
  var ox=(W-gw)/2+tw/2;
  var gh=(rows-1)*th*0.86;
  var oy=top+(zoneP-gh)/2;
  for(var i=0;i<n;i++){
    var cx=i%cols,cy=(i/cols)|0;
    var rowN=Math.min(cols,n-cy*cols);
    var rowW=(rowN-1)*tw;
    var sx0=(W-rowW)/2;
    L.plots.push({x:sx0+cx*tw,y:oy+cy*th*0.86,w:tw,h:th});
  }
  L.fenceY = top + zoneP - 6;
  /* пруд с уточкой: в полосе над грядками, а на ПК в узкой полосе — слева под загонами */
  var band=oy-top;
  var plotTop=oy-th*0.46;
  L.pond=null;
  if(band>=46){
    var prx=Math.min(W*0.30,120);
    var pry=Math.min(prx*0.34,band*0.30);
    var py=top+band*0.42;
    var bottomMax=plotTop-16;          /* берег + уточка должны быть над первой грядкой */
    if(py+pry>bottomMax)py=bottomMax-pry;
    if(py-pry-12<top){                 /* полоса узкая — сжимаем пруд */
      pry=(bottomMax-top-12)/2;
      prx=Math.min(prx,Math.max(30,pry/0.34));
      py=top+12+pry;
    }
    if(pry>=(PCW?14:8))L.pond={x:W*0.5,y:py,rx:prx,ry:pry};
  }
  if(!L.pond&&PCW){
    /* широкий экран: пруд на свободной лужайке слева под загонами */
    var yM2=top+free*fP+free*fA;
    var rx3=Math.min(120,W*0.16), ry3=Math.min(rx3*0.34,46);
    var py3=yM2+Math.min(70,free*fM*0.35)+ry3*0.2;
    if(py3+ry3+14<H-bot-20)L.pond={x:rx3+22,y:py3,rx:rx3,ry:ry3};
  }
  /* ярмарочный шатёр стоит на лужайке спереди */
  /* шатёр ярмарки — сбоку, рядом с загонами: у забора слева, всегда на виду */
  L.tent={x:40,y:L.fenceY+22};
  /* мельница — на видимом холме над грядками */
  L.wind={x:W*0.12,y:Math.max(84,Math.min(H*0.205,oy-40)),s:Math.min(1.15,W/400)};

  /* --- животные (загоны / пастбища по видам) --- */
  var yA=top+zoneP;
  if(hasA){
    var activeKinds=ANIMALS.filter(function(a){
      return P.animals.some(function(x){return x.kind===a.id;});
    });
    var kNum=activeKinds.length;
    var zoneA=free*fA;

    if(kNum===1){
      var pw=Math.min(W*0.78, PCW?300:240);
      var ph=Math.min(zoneA*0.84, 115);
      L.pens.push({kind:activeKinds[0].id, x:W/2, y:yA+zoneA/2, w:pw, h:ph});
    } else if(kNum===2){
      var gap=12;
      var pw=Math.min((W*0.92-gap)/2, PCW?210:175);
      var ph=Math.min(zoneA*0.84, 115);
      L.pens.push({kind:activeKinds[0].id, x:W/2-pw/2-gap/2, y:yA+zoneA/2, w:pw, h:ph});
      L.pens.push({kind:activeKinds[1].id, x:W/2+pw/2+gap/2, y:yA+zoneA/2, w:pw, h:ph});
    } else if(kNum===3){
      if(W>=580){
        var gap=12;
        var pw=Math.min((W*0.92-2*gap)/3, PCW?210:175);
        var ph=Math.min(zoneA*0.84, 115);
        for(var k=0;k<3;k++){
          var sx=(W-(3*pw+2*gap))/2 + pw/2 + k*(pw+gap);
          L.pens.push({kind:activeKinds[k].id, x:sx, y:yA+zoneA/2, w:pw, h:ph});
        }
      } else {
        var gapX=12, gapY=8;
        var pw=Math.min((W*0.92-gapX)/2, PCW?200:168);
        var ph=Math.min((zoneA-gapY)/2, 85);
        var y0=yA+ph/2+2;
        var y1=yA+ph+gapY+ph/2;
        L.pens.push({kind:activeKinds[0].id, x:W/2-pw/2-gapX/2, y:y0, w:pw, h:ph});
        L.pens.push({kind:activeKinds[1].id, x:W/2+pw/2+gapX/2, y:y0, w:pw, h:ph});
        L.pens.push({kind:activeKinds[2].id, x:W/2, y:y1, w:pw, h:ph});
      }
    } else if(kNum>=4){
      if(W>=720){
        var gap=12;
        var pw=Math.min((W*0.94-(kNum-1)*gap)/kNum, PCW?210:175);
        var ph=Math.min(zoneA*0.84, 115);
        var totalW=kNum*pw+(kNum-1)*gap;
        for(var k=0;k<kNum;k++){
          var sx=(W-totalW)/2 + pw/2 + k*(pw+gap);
          L.pens.push({kind:activeKinds[k].id, x:sx, y:yA+zoneA/2, w:pw, h:ph});
        }
      } else {
        var gapX=12, gapY=8;
        var pw=Math.min((W*0.92-gapX)/2, PCW?200:168);
        var ph=Math.min((zoneA-gapY)/2, 85);
        var y0=yA+ph/2+2;
        var y1=yA+ph+gapY+ph/2;
        L.pens.push({kind:activeKinds[0].id, x:W/2-pw/2-gapX/2, y:y0, w:pw, h:ph});
        L.pens.push({kind:activeKinds[1].id, x:W/2+pw/2+gapX/2, y:y0, w:pw, h:ph});
        L.pens.push({kind:activeKinds[2].id, x:W/2-pw/2-gapX/2, y:y1, w:pw, h:ph});
        L.pens.push({kind:activeKinds[3].id, x:W/2+pw/2+gapX/2, y:y1, w:pw, h:ph});
      }
    }

    var penMap={};
    for(var pi=0;pi<L.pens.length;pi++){
      var pen=L.pens[pi];
      pen.def=AMAP[pen.kind];
      pen.animalR=Math.min(32, Math.max(24, Math.min(pen.w*0.22, pen.h*0.36)));
      pen.count=0;pen.hungry=0;pen.ready=0;pen.grow=0;
      pen.minLeft=Infinity;pen.avgProgress=0;
      penMap[pen.kind]=pen;
    }

    for(var ai=0;ai<P.animals.length;ai++){
      var a=P.animals[ai];
      var pen=penMap[a.kind];
      if(pen){
        pen.count++;
        var st=animalState(a);
        if(st==='hungry')pen.hungry++;
        else if(st==='ready')pen.ready++;
        else if(st==='grow'){
          pen.grow++;
          var d=AMAP[a.kind];
          var left=Math.max(0,d.t-(now()-a.fedAt)/1000);
          if(left<pen.minLeft)pen.minLeft=left;
          pen.avgProgress+=animalProgress(a);
        }
        L.anims.push({x:pen.x, y:pen.y, r:pen.animalR, kind:a.kind});
      } else {
        L.anims.push({x:W/2, y:yA+zoneA/2, r:28, kind:a.kind});
      }
    }

    for(var pj=0;pj<L.pens.length;pj++){
      var pObj=L.pens[pj];
      if(pObj.grow>0)pObj.avgProgress=pObj.avgProgress/pObj.grow;
      if(pObj.minLeft===Infinity)pObj.minLeft=0;
    }
  }

  /* --- цеха --- */
  var yM=yA+free*fA;
  if(hasM){
    var mn=P.machines.length;
    var perM=Math.min(PCW?4:3,Math.max(2,mn));
    var mrows=Math.ceil(mn/perM);
    var zoneM=free*fM;
    var mw=Math.min(W*0.86/perM,104,(zoneM/mrows)/0.82);
    var mh=mw*0.82;
    var my=yM+(zoneM-(mrows-1)*mh)/2;
    for(var j=0;j<mn;j++){
      var mx=j%perM,myy=(j/perM)|0;
      var rowM=Math.min(perM,mn-myy*perM);
      var sX=(W-(rowM-1)*mw)/2;
      L.machs.push({x:sX+mx*mw,y:my+myy*mh,r:mw*0.36});
    }
  }

  /* амбар — в правом нижнем углу, вне рядов зверей и цехов */
  L.barn={x:W-46,y:H-bot-26,r:30};
}
function plotCX(i){return L.plots[i]?L.plots[i].x:W/2;}
function plotCY(i){return L.plots[i]?L.plots[i].y:H/2;}
function animCX(i){return L.anims[i]?L.anims[i].x:W/2;}
function animCY(i){return L.anims[i]?L.anims[i].y:H/2;}

/* ---------- фон: небо, холмы, облака ---------- */
var clouds=[];
function initClouds(){
  clouds=[];
  for(var i=0;i<4;i++)clouds.push({x:rf(-60,W+60),y:rf(18,H*0.2),s:rf(.6,1.15),v:rf(3,9)});
}
function drawSky(dt){
  /* яркое мультяшное небо в духе Hay Day */
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#54c1ff');g.addColorStop(.30,'#a5e6ff');
  g.addColorStop(.46,'#d9f7b2');g.addColorStop(1,'#8fd44f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* солнце с вращающимися лучами */
  var sx=W*0.84,sy=H*0.075;
  ctx.save();
  ctx.translate(sx,sy);ctx.rotate(G.t*0.22);
  ctx.fillStyle='rgba(255,236,140,.45)';
  for(var r=0;r<10;r++){
    ctx.rotate(Math.PI/5);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(48,-9);ctx.lineTo(48,9);ctx.closePath();ctx.fill();
  }
  ctx.restore();
  var sg=ctx.createRadialGradient(sx,sy,4,sx,sy,70);
  sg.addColorStop(0,'rgba(255,250,200,.95)');
  sg.addColorStop(.5,'rgba(255,226,120,.5)');
  sg.addColorStop(1,'rgba(255,226,120,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,70,0,7);ctx.fill();
  ctx.fillStyle='#fff6b0';ctx.beginPath();ctx.arc(sx,sy,21,0,7);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='rgba(255,190,60,.75)';
  ctx.beginPath();ctx.arc(sx,sy,21,0,7);ctx.stroke();
  /* дальние холмы — светлее и мягче */
  ctx.fillStyle='#a8dd7a';
  ctx.beginPath();ctx.moveTo(0,H*0.235);
  ctx.quadraticCurveTo(W*0.22,H*0.155,W*0.46,H*0.23);
  ctx.quadraticCurveTo(W*0.72,H*0.295,W,H*0.195);
  ctx.lineTo(W,H*0.34);ctx.lineTo(0,H*0.34);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8ed454';
  ctx.beginPath();ctx.moveTo(0,H*0.28);
  ctx.quadraticCurveTo(W*0.3,H*0.235,W*0.62,H*0.30);
  ctx.quadraticCurveTo(W*0.85,H*0.34,W,H*0.28);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  /* сочный луг */
  ctx.fillStyle='#7cc447';
  ctx.beginPath();ctx.moveTo(0,H*0.36);
  ctx.quadraticCurveTo(W*0.5,H*0.325,W,H*0.36);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  /* цветы эпох: чем старше эпоха, тем наряднее долина */
  if(eraNum()>=1){
    for(var fl=0;fl<10;fl++){
      var fx=(fl*97+31)%W, fy=H*0.30+((fl*53)%(H*0.05));
      ctx.fillStyle=(fl%2)?'#ff8ab0':'#ffffff';
      for(var pt2=0;pt2<4;pt2++){
        var aa=pt2*1.5708;
        ctx.beginPath();ctx.ellipse(fx+Math.cos(aa)*2.4,fy+Math.sin(aa)*2.4,2.2,1.4,aa,0,7);ctx.fill();
      }
      ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.arc(fx,fy,1.4,0,7);ctx.fill();
    }
  }
  /* ветряная мельница на холме: сперва зелёный бугор — она всегда стоит на земле */
  var wd=L.wind||{x:W*0.12,y:Math.max(84,H*0.16),s:1};
  var wb=wd.y+34*wd.s, ridge=H*0.2035;
  ctx.fillStyle='#a8dd7a';
  if(wb<ridge-2){ /* юбка холма до самой гряды, чтобы мельница не «висела» */
    ctx.beginPath();ctx.ellipse(wd.x,(wb+ridge)/2,40*wd.s,(ridge-wb)/2+16*wd.s,0,0,7);ctx.fill();
  }
  ctx.beginPath();ctx.ellipse(wd.x,wb+13*wd.s,44*wd.s,17*wd.s,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(wd.x,wb,54*wd.s,18*wd.s,0,0,7);ctx.fill();
  ctx.fillStyle='#8ed454';
  ctx.beginPath();ctx.ellipse(wd.x,wb+4*wd.s,40*wd.s,12*wd.s,0,0,7);ctx.fill();
  drawWindmill(wd.x,wd.y,wd.s);
  /* деревья с мультяшным контуром */
  for(var i=0;i<5;i++){
    var tx=W*(0.32+i*0.155),ty=H*0.245+Math.sin(i*1.7)*7;
    ctx.fillStyle='#4e8f2f';
    ctx.beginPath();
    ctx.arc(tx,ty,13,0,7);ctx.arc(tx-9,ty+5,10,0,7);ctx.arc(tx+9,ty+5,10,0,7);
    ctx.fill();
    ctx.fillStyle='#63b53c';
    ctx.beginPath();ctx.arc(tx-3,ty-3,9,0,7);ctx.arc(tx+6,ty+2,8,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.beginPath();ctx.arc(tx-4,ty-6,4,0,7);ctx.fill();
    ctx.fillStyle='#7a4a22';ctx.fillRect(tx-2.5,ty+10,5,11);
  }
  /* облака с контуром и тенью */
  for(var c=0;c<clouds.length;c++){
    var cl=clouds[c];
    cl.x+=cl.v*dt;
    if(cl.x>W+70){cl.x=-70;cl.y=rf(18,H*0.2);}
    var s=cl.s;
    ctx.save();
    ctx.fillStyle='#ffffff';
    ctx.strokeStyle='rgba(110,175,230,.5)';ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.arc(cl.x,cl.y,17*s,0,7);
    ctx.arc(cl.x+19*s,cl.y+5*s,13*s,0,7);
    ctx.arc(cl.x-19*s,cl.y+6*s,12*s,0,7);
    ctx.arc(cl.x+5*s,cl.y-11*s,13*s,0,7);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(170,215,245,.45)';
    ctx.beginPath();ctx.ellipse(cl.x,cl.y+11*s,24*s,5.5*s,0,0,7);ctx.fill();
    ctx.restore();
  }
}
/* мультяшная ветряная мельница с крутящимися лопастями */
function drawWindmill(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#fdf3e0';
  ctx.beginPath();ctx.moveTo(-10,34);ctx.lineTo(-6,-6);ctx.lineTo(6,-6);ctx.lineTo(10,34);ctx.closePath();ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='rgba(120,80,30,.6)';ctx.stroke();
  ctx.fillStyle='#e05a4e';
  ctx.beginPath();ctx.moveTo(-9,-6);ctx.lineTo(0,-19);ctx.lineTo(9,-6);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#8a5a28';ctx.fillRect(-2.5,20,5,14);
  ctx.save();ctx.translate(0,-9);ctx.rotate(G.t*1.1);
  for(var b=0;b<4;b++){
    ctx.rotate(Math.PI/2);
    ctx.fillStyle='#fff8ea';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(4.5,-26);ctx.lineTo(-4.5,-26);ctx.closePath();ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle='rgba(120,80,30,.6)';ctx.stroke();
  }
  ctx.fillStyle='#e0a020';ctx.beginPath();ctx.arc(0,0,3.6,0,7);ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle='#8a5a28';ctx.stroke();
  ctx.restore();ctx.restore();
}

/* ---------- грядка ---------- */
function drawPlot(i){
  var pos=L.plots[i],p=P.plots[i];
  if(!pos||!p)return;
  var x=pos.x,y=pos.y,w=pos.w*0.46,h=pos.h*0.46;
  var pLvl=P.plotLvl||1;

  ctx.save();
  ctx.translate(x,y);

  /* тень под грядкой */
  ctx.globalAlpha=.16;ctx.fillStyle='#1e3a10';
  ctx.beginPath();ctx.ellipse(0,h*0.34,w*1.02,h*0.6,0,0,7);ctx.fill();
  ctx.globalAlpha=1;

  /* земля-ромб (цвет зависит от уровня прокачки) */
  var g=ctx.createLinearGradient(0,-h,0,h);
  if(pLvl>=3){
    g.addColorStop(0,'#7d4822');g.addColorStop(1,'#3f1f0a');
  }else if(pLvl===2){
    g.addColorStop(0,'#8a5830');g.addColorStop(1,'#4e2b14');
  }else{
    g.addColorStop(0,'#a97a4a');g.addColorStop(1,'#6b4a24');
  }
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(0,-h);ctx.lineTo(w,0);ctx.lineTo(0,h);ctx.lineTo(-w,0);
  ctx.closePath();ctx.fill();

  /* бортики грядки */
  if(pLvl>=3){
    ctx.lineWidth=Math.max(2.5,w*0.08);
    ctx.strokeStyle='#d49b38';ctx.lineJoin='round';ctx.stroke();
    ctx.lineWidth=Math.max(1,w*0.03);
    ctx.strokeStyle='rgba(255,230,120,.5)';ctx.stroke();
  }else if(pLvl===2){
    ctx.lineWidth=Math.max(2.2,w*0.075);
    ctx.strokeStyle='#a66a30';ctx.lineJoin='round';ctx.stroke();
  }else{
    ctx.lineWidth=Math.max(2,w*0.07);
    ctx.strokeStyle='rgba(60,38,14,.65)';ctx.lineJoin='round';ctx.stroke();
  }

  /* борозды */
  ctx.strokeStyle=pLvl>=2?'rgba(30,15,5,.35)':'rgba(52,32,12,.3)';
  ctx.lineWidth=Math.max(1.5,w*0.05);
  for(var k=-1;k<=1;k++){
    ctx.beginPath();
    ctx.moveTo(-w*0.62+k*w*0.3,h*0.3-k*h*0.05);
    ctx.lineTo(w*0.38+k*w*0.3,-h*0.3-k*h*0.05);
    ctx.stroke();
  }

  /* звёздочки уровня прокачки на уголке грядки */
  if(pLvl>=2){
    ctx.font='900 '+(Math.max(7,w*0.14))+'px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=pLvl>=3?'#ffe066':'#ffcc44';
    var starTxt='';
    for(var si=0;si<Math.min(pLvl,4);si++)starTxt+='★';
    if(pLvl>4)starTxt='★'+pLvl;
    ctx.fillText(starTxt, 0, -h*0.75);
  }

  var st=plotState(p);
  if(st==='empty'){
    /* подсказка «посади» — пунктирный плюс */
    ctx.globalAlpha=.5;
    ctx.strokeStyle=pLvl>=3?'#ffe680':(pLvl===2?'#ffda90':'rgba(255,255,255,.9)');
    ctx.lineWidth=Math.max(2,w*0.06);
    ctx.setLineDash([w*0.12,w*0.1]);
    ctx.beginPath();ctx.arc(0,-h*0.1,w*0.28,0,7);ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(-w*0.14,-h*0.1);ctx.lineTo(w*0.14,-h*0.1);
    ctx.moveTo(0,-h*0.1-w*0.14);ctx.lineTo(0,-h*0.1+w*0.14);
    ctx.stroke();
    ctx.globalAlpha=1;
  }else{
    var d=CMAP[p.crop],pr=plotProgress(p);
    var sz=w*0.62;
    if(st==='ready'){
      /* готово: подпрыгивает и светится */
      var bob=Math.sin(G.t*4+i)*h*0.10;
      ctx.save();
      ctx.globalAlpha=.42;
      var rg2=ctx.createRadialGradient(0,-h*0.3+bob,2,0,-h*0.3+bob,sz*1.5);
      rg2.addColorStop(0,pLvl>=2?'rgba(255,220,100,.95)':'rgba(255,240,150,.9)');
      rg2.addColorStop(1,'rgba(255,240,150,0)');
      ctx.fillStyle=rg2;
      ctx.beginPath();ctx.arc(0,-h*0.3+bob,sz*1.5,0,7);ctx.fill();
      ctx.restore();

      ctx.save();ctx.translate(0,-h*0.34+bob);
      ART.draw(ctx,d.art,sz,G.t);
      ctx.restore();

      /* галочка «собери» с бейджем множителя (×2 или ×3) */
      ctx.save();
      ctx.translate(w*0.62,-h*0.72+bob);
      ctx.fillStyle='#3fa724';
      ctx.beginPath();ctx.arc(0,0,w*0.20,0,7);ctx.fill();
      ctx.lineWidth=w*0.05;ctx.strokeStyle='#fff';
      ctx.beginPath();ctx.arc(0,0,w*0.20,0,7);ctx.stroke();

      if(pLvl>=2){
        ctx.font='900 '+(w*0.18)+'px -apple-system,sans-serif';
        ctx.fillStyle='#fff';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('×'+plotYieldMult(), 0, 0);
      }else{
        ctx.lineWidth=w*0.07;ctx.lineCap='round';ctx.strokeStyle='#fff';
        ctx.beginPath();
        ctx.moveTo(-w*0.08,0);ctx.lineTo(-w*0.02,w*0.06);ctx.lineTo(w*0.09,-w*0.07);
        ctx.stroke();
      }
      ctx.restore();
    }else{
      /* растёт: росток тянется вверх */
      var k2=0.35+pr*0.65;
      ctx.save();ctx.translate(0,-h*0.22);
      if(pr<0.45)ART.draw(ctx,'sprout',sz*0.62*k2,G.t);
      else{ctx.globalAlpha=.55+pr*0.45;ART.draw(ctx,d.art,sz*k2,G.t);}
      ctx.restore();
      /* таймер-полоска */
      var bw=w*1.05,bh=Math.max(4,h*0.16);
      var by=h*0.48;
      ctx.fillStyle='rgba(20,40,12,.55)';
      rrect(ctx,-bw/2,by,bw,bh,bh/2);ctx.fill();
      var fg=ctx.createLinearGradient(-bw/2,0,bw/2,0);
      fg.addColorStop(0,pLvl>=3?'#ffe066':(pLvl===2?'#bbf455':'#8fe36a'));
      fg.addColorStop(1,pLvl>=3?'#f59e0b':(pLvl===2?'#66d928':'#4fc12a'));
      ctx.fillStyle=fg;
      rrect(ctx,-bw/2,by,Math.max(bh,bw*pr),bh,bh/2);ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------- загоны и животные ---------- */
function updatePenStats(pen){
  pen.count=0;pen.hungry=0;pen.ready=0;pen.grow=0;
  pen.minLeft=Infinity;
  var sumProg=0;
  var d=pen.def||AMAP[pen.kind];
  for(var i=0;i<P.animals.length;i++){
    var a=P.animals[i];
    if(a.kind===pen.kind){
      pen.count++;
      var st=animalState(a);
      if(st==='hungry')pen.hungry++;
      else if(st==='ready')pen.ready++;
      else if(st==='grow'){
        pen.grow++;
        var left=Math.max(0,d.t-(now()-a.fedAt)/1000);
        if(left<pen.minLeft)pen.minLeft=left;
        sumProg+=animalProgress(a);
      }
    }
  }
  if(pen.grow>0)pen.avgProgress=sumProg/pen.grow;
  if(pen.minLeft===Infinity)pen.minLeft=0;
}

function drawPen(pen, pIdx){
  if(!pen)return;
  updatePenStats(pen);
  var d=pen.def||AMAP[pen.kind];
  var x=pen.x, y=pen.y, w=pen.w, h=pen.h;
  var ar=pen.animalR||28;

  ctx.save();
  ctx.translate(x, y);

  /* тень под загоном */
  ctx.globalAlpha=.16;
  ctx.fillStyle='#1b380e';
  rrect(ctx,-w/2,-h/2+4,w,h,14);ctx.fill();
  ctx.globalAlpha=1;

  /* грунт загона (сочная зелёная лужайка) */
  var pg=ctx.createLinearGradient(0,-h/2,0,h/2);
  if(pen.kind==='pig'){
    pg.addColorStop(0,'#7ebc42');pg.addColorStop(1,'#5e9e2a');
  }else if(pen.kind==='cow'){
    pg.addColorStop(0,'#6ec23e');pg.addColorStop(1,'#4ea424');
  }else if(pen.kind==='chick'){
    pg.addColorStop(0,'#80c644');pg.addColorStop(1,'#5fa82a');
  }else{
    pg.addColorStop(0,'#7ac846');pg.addColorStop(1,'#5ca82c');
  }
  ctx.fillStyle=pg;
  rrect(ctx,-w/2,-h/2,w,h,14);ctx.fill();

  /* внутренний кант */
  ctx.lineWidth=2;
  ctx.strokeStyle='rgba(255,255,255,.28)';
  ctx.stroke();

  /* декоративные травинки внутри */
  ctx.strokeStyle='rgba(45,100,20,.35)';
  ctx.lineWidth=1.5;ctx.lineCap='round';
  [-w*0.32, w*0.3, -w*0.08].forEach(function(gx, gi){
    var gy=(gi%2===0 ? -h*0.22 : h*0.24);
    ctx.beginPath();
    ctx.moveTo(gx, gy);ctx.lineTo(gx-3, gy-5);
    ctx.moveTo(gx, gy);ctx.lineTo(gx, gy-6);
    ctx.moveTo(gx, gy);ctx.lineTo(gx+3, gy-5);
    ctx.stroke();
  });

  /* деревянный заборчик по периметру */
  var pw2=w/2-4, ph2=h/2-4;
  ctx.lineWidth=2.8;
  ctx.strokeStyle='#c49358';
  ctx.beginPath();
  ctx.moveTo(-pw2, -ph2+4);ctx.lineTo(pw2, -ph2+4);
  ctx.moveTo(-pw2, ph2-4);ctx.lineTo(pw2, ph2-4);
  ctx.moveTo(-pw2+4, -ph2);ctx.lineTo(-pw2+4, ph2);
  ctx.moveTo(pw2-4, -ph2);ctx.lineTo(pw2-4, ph2);
  ctx.stroke();

  /* деревянные столбики по углам */
  var posts=[[-pw2,-ph2],[pw2,-ph2],[-pw2,ph2],[pw2,ph2]];
  if(w>170){posts.push([0,-ph2]);posts.push([0,ph2]);}
  posts.forEach(function(pt){
    ctx.fillStyle='#a6723e';
    ctx.beginPath();ctx.arc(pt[0],pt[1],4.2,0,7);ctx.fill();
    ctx.fillStyle='#d4a36a';
    ctx.beginPath();ctx.arc(pt[0]-1,pt[1]-1,1.8,0,7);ctx.fill();
  });

  /* --- отрисовка крупных живых животных --- */
  var count=pen.count||1;
  var animSprites=[];
  if(count===1){
    animSprites.push({x:0, y:h*0.06});
  }else if(count===2){
    animSprites.push({x:-w*0.22, y:h*0.06});
    animSprites.push({x:w*0.22, y:h*0.06});
  }else if(count===3){
    animSprites.push({x:-w*0.24, y:h*0.1});
    animSprites.push({x:w*0.24, y:h*0.1});
    animSprites.push({x:0, y:-h*0.12});
  }else{
    animSprites.push({x:-w*0.25, y:h*0.1});
    animSprites.push({x:w*0.25, y:h*0.1});
    animSprites.push({x:0, y:-h*0.13});
    if(w>=155&&count>=6){
      animSprites.push({x:-w*0.04, y:h*0.14});
    }
  }

  for(var s=0;s<animSprites.length;s++){
    var sp=animSprites[s];
    ctx.save();
    ctx.translate(sp.x, sp.y);
    /* тень зверя */
    ctx.globalAlpha=.22;ctx.fillStyle='#1e3a10';
    ctx.beginPath();ctx.ellipse(0,ar*0.82,ar*0.84,ar*0.26,0,0,7);ctx.fill();
    ctx.globalAlpha=1;
    /* дыхание и радостное покачивание */
    var bob=Math.sin(G.t*2.4+s*1.7+pIdx*1.1)*(ar*0.06);
    if(pen.ready>0)bob+=Math.sin(G.t*4.6+s*1.4)*(ar*0.10);
    ctx.translate(0, bob);
    ART.draw(ctx, d.art, ar, G.t);
    ctx.restore();
  }

  /* --- плашка с названием вида и количеством --- */
  var badgeTxt=count>1 ? (d.n+' · ×'+count) : d.n;
  ctx.font='900 11px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
  var tw=ctx.measureText(badgeTxt).width;
  var bw=tw+14, bh=18;
  var bx=-w/2+7, by=-h/2+6;
  ctx.fillStyle='rgba(18,38,12,.72)';
  rrect(ctx,bx,by,bw,bh,9);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#ffffff';
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(badgeTxt,bx+7,by+bh/2+0.5);

  /* --- уровень загона, если прокачан --- */
  var plv=penLvl(pen.kind);
  if(plv>0){
    var lvTxt='★'+plv;
    ctx.font='900 10px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
    var lw2=ctx.measureText(lvTxt).width;
    var lx2=w/2-7-(lw2+10), ly2=h/2-6-14;
    ctx.fillStyle='rgba(18,38,12,.72)';
    rrect(ctx,lx2,ly2,lw2+10,14,7);ctx.fill();
    ctx.fillStyle='#ffd964';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(lvTxt,lx2+(lw2+10)/2,ly2+7.5);
  }

  /* --- интерактивный значок состояния в правом верхнем углу --- */
  var sx=w/2-18, sy=-h/2+11;

  if(pen.ready>0){
    /* готово: свечение и прыгающий значок сбора */
    var rg=ctx.createRadialGradient(sx,sy,2,sx,sy,26);
    rg.addColorStop(0,'rgba(255,240,150,.85)');
    rg.addColorStop(1,'rgba(255,240,150,0)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(sx,sy,26,0,7);ctx.fill();

    var bounce=Math.sin(G.t*4.8+pIdx)*3;
    ctx.save();
    ctx.translate(sx, sy+bounce);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle='#3fa724';
    ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.stroke();
    ctx.save();ctx.scale(.64,.64);
    ART.draw(ctx,GMAP[d.give].art,18,0);
    ctx.restore();

    /* бейдж количества готовой продукции */
    if(pen.ready>1){
      var rTxt='+'+pen.ready;
      ctx.font='900 10px -apple-system,sans-serif';
      var rtw=ctx.measureText(rTxt).width;
      ctx.fillStyle='#3fa724';
      rrect(ctx,3,-15,rtw+8,14,7);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(rTxt,3+(rtw+8)/2,-8);
    }
    ctx.restore();
  }else if(pen.hungry>0){
    /* голодные: пульсирующий значок пшеницы */
    var pul=1+Math.sin(G.t*5+pIdx)*0.08;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(pul, pul);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle='#e0952c';
    ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.stroke();
    ctx.save();ctx.scale(.64,.64);
    ART.draw(ctx,'wheat',17,0);
    ctx.restore();

    if(pen.hungry>1){
      var hTxt=''+pen.hungry;
      ctx.font='900 10px -apple-system,sans-serif';
      var htw=ctx.measureText(hTxt).width;
      ctx.fillStyle='#e0952c';
      rrect(ctx,3,-15,htw+8,14,7);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(hTxt,3+(htw+8)/2,-8);
    }
    ctx.restore();
  }else if(pen.grow>0){
    /* растут: таймер */
    ctx.save();
    ctx.translate(sx, sy);
    var pr=pen.avgProgress||0;
    ctx.lineWidth=3.2;
    ctx.strokeStyle='rgba(20,40,12,.35)';
    ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.stroke();
    ctx.strokeStyle='#8fe36a';ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,0,13,-Math.PI/2,-Math.PI/2+pr*6.283);ctx.stroke();

    var timeTxt=mmss(pen.minLeft);
    ctx.font='900 9.5px -apple-system,sans-serif';
    var ttw=ctx.measureText(timeTxt).width;
    ctx.fillStyle='rgba(20,40,12,.75)';
    rrect(ctx,-ttw/2-5,12,ttw+10,13,6);ctx.fill();
    ctx.fillStyle='#8fe36a';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(timeTxt,0,18.5);
    ctx.restore();
  }

  ctx.restore();
}

function drawAnimal(i){
  var pos=L.anims[i],a=P.animals[i];
  if(!pos||!a)return;
  var d=AMAP[a.kind],st=animalState(a);
  var x=pos.x,y=pos.y,r=pos.r;

  var bob=Math.sin(G.t*2.2+i*1.3)*r*0.06;

function onTapPen(pen){
  if(!pen)return;
  updatePenStats(pen);
  var kind=pen.kind;
  var d=pen.def||AMAP[kind];

  /* 1. Если есть готовая продукция — собираем её всю */
  if(pen.ready>0){
    if(barnFree()<=0){
      sfx('err');toast('🏚 Амбар переполнен!');
      return;
    }
    var collected=0;
    for(var i=0;i<P.animals.length;i++){
      var a=P.animals[i];
      if(a.kind===kind&&animalState(a)==='ready'){
        if(barnFree()<=0){
          toast('🏚 Амбар переполнен!');
          break;
        }
        if(collectAnimal(i,true))collected++;
      }
    }
    if(collected>0){
      sfx('coin');haptic('medium');
      burstXY(pen.x,pen.y,'#ffd964',Math.min(22,8+collected*2));
      popText(pen.x,pen.y-20,'+'+collected+' '+GMAP[d.give].n,'#c47b06');
      save();paintAll();
    }
    return;
  }

  /* 2. Если есть голодные — кормим пшеницей из амбара */
  if(pen.hungry>0){
    var haveWheat=P.barn['wheat']||0;
    if(haveWheat<=0){
      sfx('err');toast('Нужна пшеница для корма ('+pen.hungry+' шт.)');
      return;
    }
    var fed=0;
    for(var j=0;j<P.animals.length;j++){
      var a2=P.animals[j];
      if(a2.kind===kind&&animalState(a2)==='hungry'){
        if(!barnHas('wheat',1))break;
        barnTake('wheat',1);
        a2.fedAt=now();
        fed++;
      }
    }
    if(fed>0){
      sfx('feed');haptic('medium');
      burstXY(pen.x,pen.y,'#8fe36a',Math.min(18,6+fed*2));
      popText(pen.x,pen.y-20,'🌾 Покормлено: '+fed,'#3f8a18');
      save();paintAll();
    }
    return;
  }

  /* 3. Если все растут — подсказка о времени */
  if(pen.grow>0){
    toast('⏳ '+d.n+': '+GMAP[d.give].n.toLowerCase()+' через '+mmss(pen.minLeft)+' ('+pen.count+' шт.)');
    return;
  }

  toast(d.n+': '+pen.count+' шт.');
}

/* ---------- цех ---------- */
function drawMachine(i){
  var pos=L.machs[i],m=P.machines[i];
  if(!pos||!m)return;
  var d=machineDef(m),r=pos.r;
  ctx.save();ctx.translate(pos.x,pos.y);
  ctx.globalAlpha=.2;ctx.fillStyle='#1e3a10';
  ctx.beginPath();ctx.ellipse(0,r*0.9,r*0.95,r*0.28,0,0,7);ctx.fill();
  ctx.globalAlpha=1;
  ART.draw(ctx,d.art,r,G.t);
  ctx.restore();
  /* уровень цеха */
  var ml=m.lvl||1;
  if(ml>1){
    var lvTxt='★'+ml;
    ctx.font='900 10px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
    var lw2=ctx.measureText(lvTxt).width;
    var lx2=pos.x+r*0.55, ly2=pos.y-r*0.95;
    ctx.fillStyle='rgba(18,38,12,.72)';
    rrect(ctx,lx2,ly2,lw2+10,14,7);ctx.fill();
    ctx.fillStyle='#ffd964';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(lvTxt,lx2+(lw2+10)/2,ly2+7.5);
  }
  /* очередь производства над цехом */
  var qn=m.queue.length;
  if(qn){
    var bw=r*1.7,bh=r*0.3,bx=pos.x-bw/2,by=pos.y-r*1.28;
    for(var q=0;q<qn;q++){
      var item=m.queue[q];
      var yy=by-q*(bh+3);
      ctx.fillStyle='rgba(20,40,12,.6)';
      rrect(ctx,bx,yy,bw,bh,bh/2);ctx.fill();
      var pr=cookProgress(item);
      var col=cookReady(item)?'#ffd964':'#8fe36a';
      ctx.fillStyle=col;
      rrect(ctx,bx,yy,Math.max(bh,bw*pr),bh,bh/2);ctx.fill();
      if(cookReady(item)){
        ctx.save();
        ctx.translate(bx+bw+r*0.24,yy+bh/2);
        var b3=Math.sin(G.t*4+q)*2;
        ctx.translate(0,b3);
        ART.draw(ctx,itemArt(item.out),r*0.26,0);
        ctx.restore();
      }
    }
  }
}

function drawBarn(){

function rrect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}

/* ---------- КОТ ---------- */
function drawCat(){
  var c=G.cat;
  if(!c||W<2)return;
  var x=c.x,y=c.y,s=Math.min(W,H)/470*1.18;
  /* подкрадывание к грядке: кот прыгает к цели */
  if(c.prankT>0){
    var pr=1-c.prankT/1.6;
    var sx=c.x,sy=H-96;
    var tx=c.targetX||c.x,ty=c.targetY||(H-96);
    x=sx+(tx-sx)*Math.min(1,pr*1.4);
    /* дуга прыжка */
    var arc=Math.sin(Math.min(1,pr*1.4)*Math.PI)*46*s;
    y=sy+(ty-sy)*Math.min(1,pr*1.4)-arc;
    c.dir=(tx>=sx)?1:-1;
    /* в момент приземления — сбиваем урожай */
    if(pr>0.72&&!c.prankHit)catPrankHit();
    if(c.prankT<=0.2){c.prankHit=0;c.targetPlot=-1;}
  }
  /* фаза шага: идём — лапы работают, сидим — стоим */
  var sit=c.state==='sit';
  var moving=!sit;
  var ph=moving?c.t*8.5:0;
  var stride=moving?3.4:0;
  var lift=moving?1.7:0;
  var bob=moving?-Math.abs(Math.sin(ph))*1.3:Math.sin(c.t*2.4)*1.2;
  function legStep(pz,off){
    return {x:Math.sin(pz+off)*stride, y:-Math.max(0,Math.cos(pz+off))*lift};
  }
  var fA=legStep(ph,0),fB=legStep(ph,Math.PI),hL=legStep(ph,Math.PI);

  /* тень */
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath();ctx.ellipse(x,y+17.6*s,15*s,4*s,0,0,7);ctx.fill();

  /* кот рисуется смотрящим вправо; dir — зеркало */
  ctx.save();
  ctx.translate(x,y-2*s+bob);
  ctx.scale(c.dir,1);
  var O='#f4a45c',O2='#e0812f',O3='#c46f1d',CR='#ffe9cf',CR2='#f0d6ae',PK='#ff9db4';

  var inkC='rgba(122,63,14,.55)';
  var blink=(c.t+1.7)%3.6<0.13;
  var wag=Math.sin(c.t*6)*3;

  /* хвост — пушистый крючок со штрихами */
  ctx.lineCap='round';
  ctx.strokeStyle=O;ctx.lineWidth=4.6*s;
  ctx.beginPath();
  ctx.moveTo(-9*s,7*s);
  ctx.quadraticCurveTo(-17*s,9*s,-19.5*s,0+wag);
  ctx.quadraticCurveTo(-20.5*s,-6*s,-15.5*s,-8.5*s+wag);
  ctx.stroke();
  ctx.strokeStyle=O3;ctx.lineWidth=1.7*s;
  ctx.beginPath();
  ctx.moveTo(-16.8*s,6.6*s);ctx.lineTo(-19*s,4.6*s);
  ctx.moveTo(-19.7*s,-2.4*s);ctx.lineTo(-21.2*s,-0.4*s);
  ctx.stroke();

  /* дальняя задняя лапа (за телом, в такт ближней передней) */
  ctx.fillStyle=O2;
  ctx.beginPath();ctx.ellipse(-6.2*s+fA.x*s,(12+fA.y)*s,6*s,4.3*s,0,0,7);ctx.fill();
  ctx.lineWidth=1.8*s;ctx.strokeStyle=inkC;ctx.stroke();

  /* дальняя передняя лапа (за телом) */
  ctx.fillStyle=CR2;
  ctx.beginPath();ctx.ellipse(8.5*s+fB.x*s,(10.5+fB.y)*s,2.5*s,4.4*s,0,0,7);ctx.fill();
  ctx.lineWidth=1.8*s;ctx.strokeStyle=inkC;ctx.stroke();

  /* ближняя задняя лапа */
  ctx.fillStyle=O;
  ctx.beginPath();ctx.ellipse(-5*s+hL.x*s,(12+hL.y)*s,6.5*s,4.6*s,0,0,7);ctx.fill();
  ctx.lineWidth=2*s;ctx.strokeStyle=inkC;ctx.stroke();

  /* тело: рыжее, с кремовым животиком и полосками на спинке */
  ctx.save();
  ctx.beginPath();ctx.ellipse(-1*s,6*s,10.8*s,8.2*s,0,0,7);
  ctx.fillStyle=O;ctx.fill();
  ctx.clip();
  ctx.fillStyle=CR;
  ctx.beginPath();ctx.ellipse(1*s,8.5*s,5.2*s,5.6*s,0,0,7);ctx.fill();
  ctx.strokeStyle=O2;ctx.lineWidth=2.6*s;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-8.5*s,0.5*s);ctx.quadraticCurveTo(-7.4*s,2.6*s,-8.8*s,4.6*s);
  ctx.moveTo(-5.5*s,-2.2*s);ctx.quadraticCurveTo(-4.4*s,-0.2*s,-5.8*s,1.8*s);
  ctx.stroke();
  ctx.restore();
  ctx.beginPath();ctx.ellipse(-1*s,6*s,10.8*s,8.2*s,0,0,7);
  ctx.lineWidth=2.1*s;ctx.strokeStyle=inkC;ctx.stroke();

  /* ближняя передняя лапка */
  ctx.fillStyle=CR;
  ctx.beginPath();ctx.ellipse(4.5*s+fA.x*s,(10.5+fA.y)*s,2.5*s,4.4*s,0,0,7);ctx.fill();
  ctx.lineWidth=1.8*s;ctx.strokeStyle=inkC;ctx.stroke();
  /* ушки (за головой) с розовой изнанкой */
  function ear(ex,ey,rot){
    ctx.save();ctx.translate(ex,ey);ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(-3.4*s,2.4*s);
    ctx.quadraticCurveTo(-3*s,-4.6*s,0,-6*s);
    ctx.quadraticCurveTo(3*s,-4.4*s,3.4*s,2.4*s);
    ctx.closePath();
    ctx.fillStyle=O;ctx.fill();
    ctx.lineWidth=2*s;ctx.strokeStyle=inkC;ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-1.6*s,1.8*s);
    ctx.quadraticCurveTo(-1.3*s,-2.8*s,0,-3.8*s);
    ctx.quadraticCurveTo(1.5*s,-2.6*s,1.6*s,1.8*s);
    ctx.closePath();
    ctx.globalAlpha=.85;ctx.fillStyle=PK;ctx.fill();ctx.globalAlpha=1;
    ctx.restore();
  }
  var hx=7*s,hy=-7*s,hr=9.2*s;
  ear(hx-5.6*s,hy-6.6*s,-0.3);
  ear(hx+5.6*s,hy-6.6*s,0.3);

  /* голова */
  ctx.beginPath();ctx.arc(hx,hy,hr,0,7);
  ctx.fillStyle=O;ctx.fill();
  /* полоски на макушке */
  ctx.strokeStyle=O3;ctx.lineWidth=2.4*s;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(hx,hy-hr+1.2*s);ctx.quadraticCurveTo(hx+0.7*s,hy-hr+3*s,hx,hy-hr+4.8*s);
  ctx.moveTo(hx-2.9*s,hy-hr+1.8*s);ctx.quadraticCurveTo(hx-3.7*s,hy-hr+3.4*s,hx-2.9*s,hy-hr+5*s);
  ctx.moveTo(hx+2.9*s,hy-hr+1.8*s);ctx.quadraticCurveTo(hx+3.7*s,hy-hr+3.4*s,hx+2.9*s,hy-hr+5*s);
  ctx.stroke();
  /* кремовая мордочка */
  ctx.fillStyle=CR;
  ctx.beginPath();ctx.ellipse(hx,hy+2.9*s,5.2*s,3.5*s,0,0,7);ctx.fill();
  /* контур головы */
  ctx.beginPath();ctx.arc(hx,hy,hr,0,7);
  ctx.lineWidth=2.1*s;ctx.strokeStyle=inkC;ctx.stroke();

  /* большие глаза с бликами */
  var ey=hy-1.4*s;
  var exs=[hx-3.5*s,hx+3.5*s];
  for(var ei=0;ei<2;ei++){
    var ex=exs[ei];
    if(blink){
      ctx.strokeStyle='#241505';ctx.lineWidth=1.7*s;ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(ex-1.8*s,ey);
      ctx.quadraticCurveTo(ex,ey+1.5*s,ex+1.8*s,ey);
      ctx.stroke();
    }else{
      ctx.fillStyle='#241505';
      ctx.beginPath();ctx.arc(ex,ey,3*s,0,7);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(ex-1.1*s,ey-1.2*s,1.15*s,0,7);ctx.fill();
      ctx.globalAlpha=.85;
      ctx.beginPath();ctx.arc(ex+1.2*s,ey+1*s,0.6*s,0,7);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  /* носик */
  ctx.fillStyle=PK;
  ctx.beginPath();
  ctx.moveTo(hx-1.5*s,hy+1.1*s);
  ctx.quadraticCurveTo(hx,hy+0.4*s,hx+1.5*s,hy+1.1*s);
  ctx.quadraticCurveTo(hx+1.1*s,hy+2.5*s,hx,hy+2.7*s);
  ctx.quadraticCurveTo(hx-1.1*s,hy+2.5*s,hx-1.5*s,hy+1.1*s);
  ctx.closePath();ctx.fill();
  /* ротик-буква w */
  ctx.strokeStyle='rgba(122,63,14,.75)';ctx.lineWidth=1.3*s;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(hx,hy+2.7*s);
  ctx.quadraticCurveTo(hx-1.4*s,hy+4.3*s,hx-2.8*s,hy+3.2*s);
  ctx.moveTo(hx,hy+2.7*s);
  ctx.quadraticCurveTo(hx+1.4*s,hy+4.3*s,hx+2.8*s,hy+3.2*s);
  ctx.stroke();
  /* румянец */
  ctx.fillStyle='rgba(255,120,150,.45)';
  ctx.beginPath();ctx.ellipse(hx-5.6*s,hy+2.4*s,1.8*s,1.1*s,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(hx+5.6*s,hy+2.4*s,1.8*s,1.1*s,0,0,7);ctx.fill();

  ctx.restore();
  /* сердечки при поглаживании */
  if(c.joy>0){
    ctx.font='900 '+(12+c.joy*8)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ff5a7a';
    ctx.fillText('❤️',x,y-34*s-c.joy*14);
    ctx.font='900 11px sans-serif';
    ctx.fillStyle='#9ad87a';
    ctx.fillText('Мур!',x,y-24*s);
  }
  if(P.tutorCat&&c.happy<5){
    ctx.font='900 10px sans-serif';ctx.textAlign='center';
    ctx.fillStyle='rgba(20,40,12,.75)';
    ctx.fillText('Погладь котика!',x,y+36*s);
  }
}

function drawFireflies(){
  var nf=nightFactor();
  if(nf<=0.05)return;
  ctx.save();
  ctx.globalAlpha=nf;
  for(var i=0;i<G.fireflies.length;i++){
    var f=G.fireflies[i];
    var glow=.4+.6*Math.abs(Math.sin(f.ph*2.5));
    ctx.fillStyle='rgba(255,244,120,'+(0.5+glow*0.5)+')';
    ctx.beginPath();ctx.arc(f.x,f.y,2.2,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,244,120,.25)';
    ctx.beginPath();ctx.arc(f.x,f.y,5.5,0,7);ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha=1;
}
/* ---------- НОЧНОЙ ОВЕРЛЕЙ ---------- */
function drawBalloon(){
  if(!G.balloon||!G.balloon.active||W<2)return;
  var bx=G.balloon.x, by=G.balloon.y + Math.sin(G.balloon.t*2)*4;
  var r=20;
  
  ctx.save();
  ctx.translate(bx, by);
  
  /* тень в небе */
  ctx.globalAlpha=.14;
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(0,r+18,r*0.6,4,0,0,7);ctx.fill();
  ctx.globalAlpha=1;

  /* купол шара */
  var bgCols=[['#ff5252','#ffd32a'],['#0984e3','#74b9ff'],['#6c5ce7','#a29bfe'],['#00b894','#55efc4']];
  var pal=bgCols[G.balloon.color||0];
  var bgGrad=ctx.createRadialGradient(-r*0.3,-r*0.3,2,0,0,r*1.2);
  bgGrad.addColorStop(0,'#ffffff');bgGrad.addColorStop(0.3,pal[1]);bgGrad.addColorStop(1,pal[0]);
  
  ctx.fillStyle=bgGrad;
  ctx.beginPath();
  ctx.arc(0,-4,r,0,Math.PI*2);
  ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(0,0,0,.2)';ctx.stroke();

  /* стропы */
  ctx.strokeStyle='rgba(80,50,20,.6)';ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(-r*0.6,r*0.5);ctx.lineTo(-6,r+10);
  ctx.moveTo(r*0.6,r*0.5);ctx.lineTo(6,r+10);
  ctx.stroke();

  /* корзинка */
  ctx.fillStyle='#9e6834';
  ctx.fillRect(-6,r+10,12,8);
  ctx.fillStyle='#784c20';
  ctx.fillRect(-7,r+9,14,2);

  /* подарочная коробка под корзиной */
  var gw=14,gh=12,gy=r+18;
  ctx.fillStyle='#e84118';
  rrect(ctx,-gw/2,gy,gw,gh,2);ctx.fill();
  /* ленточка */
  ctx.fillStyle='#ffd32a';
  ctx.fillRect(-1.5,gy,3,gh);
  ctx.fillRect(-gw/2,gy+gh/2-1.5,gw,3);
  /* бантик */
  ctx.beginPath();ctx.arc(0,gy-1,2.5,0,7);ctx.fill();

  /* сияние-звёздочки */
  var tw=Math.abs(Math.sin(G.t*4));
  ctx.fillStyle='rgba(255,240,120,'+(0.4+tw*0.5)+')';
  ctx.beginPath();ctx.arc(r*0.7,-r*0.6,2,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(-r*0.7,0,1.5,0,7);ctx.fill();

  ctx.restore();
}

function drawNightOverlay(){
  var nf=nightFactor();
  if(nf<=0.02)return;
  ctx.save();
  ctx.globalAlpha=nf*0.44;
  ctx.fillStyle='#0a1030';
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=nf;
  /* звёзды */
  for(var i=0;i<26;i++){
    var sx=(i*83+17)%W, sy=(i*53+11)%(H*0.55);
    var tw=.5+.5*Math.abs(Math.sin(G.t*1.3+i));
    ctx.fillStyle='rgba(255,255,255,'+(0.4+tw*0.6)+')';
    ctx.fillRect(sx,sy,2,2);
  }
  /* луна */
  var mx=W*0.82,my=H*0.09;
  ctx.fillStyle='#f0f0c8';
  ctx.beginPath();ctx.arc(mx,my,18,0,7);ctx.fill();
  ctx.fillStyle='#d8d8a8';
  ctx.beginPath();ctx.arc(mx+4,my-3,13,0,7);ctx.fill();
  ctx.fillStyle='rgba(10,16,48,.5)';
  ctx.beginPath();ctx.arc(mx-5,my+4,4,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(mx+6,my+8,3,0,7);ctx.fill();
  /* северное сияние в эпохе 4+ */
  if(eraNum()>=4){
    ctx.globalAlpha=nf*0.35;
    var cols2=['#7ef0b0','#6ac8ff','#c39aff'];
    for(var a2=0;a2<3;a2++){
      ctx.strokeStyle=cols2[a2];ctx.lineWidth=10+a2*4;ctx.lineCap='round';
      ctx.beginPath();
      for(var xx=0;xx<=W;xx+=24){
        var yy=H*0.12+a2*14+Math.sin(xx*0.02+G.t*0.8+a2)*10;
        if(xx===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=nf;
  }
  ctx.restore();
  ctx.globalAlpha=1;
}
/* ---------- СЕЗОННЫЕ УКРАШЕНИЯ ---------- */
function drawSeasonDecor(){
  var s=G.season;
  if(s==='spring'){
    /* цветочки + пасхальные яйца */
    for(var i=0;i<14;i++){
      var x=(i*71+23)%W, y=H*0.38+((i*47)%(H*0.5));
      ctx.fillStyle='#ff8ab0';
      ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();
      ctx.fillStyle='#ffd24a';
      ctx.beginPath();ctx.arc(x,y,1.2,0,7);ctx.fill();
    }
    /* пасхальные яйца */
    var eggCols=['#ff6aa8','#6ac8ff','#ffd24a','#7ef0b0','#c39aff'];
    for(var e=0;e<6;e++){
      var ex=(e*113+37)%W, ey=H*0.42+((e*61)%(H*0.45));
      ctx.fillStyle=eggCols[e%5];
      ctx.beginPath();ctx.ellipse(ex,ey,3.2,4.2,0,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.7)';
      ctx.beginPath();ctx.ellipse(ex-1,ey-1.2,1,1.4,0,0,7);ctx.fill();
    }
  }else if(s==='autumn'){
    /* листья + тыквы-хэллоуин */
    for(var i=0;i<12;i++){
      var x=(i*89+11)%W, y=H*0.36+((i*53)%(H*0.55));
      ctx.fillStyle=(i%2)?'#d98a2a':'#c05a1e';
      ctx.beginPath();ctx.ellipse(x,y,3.4,2.2,0.5,0,7);ctx.fill();
    }
    for(var p=0;p<4;p++){
      var px=(p*167+53)%W, py=H*0.46+((p*73)%(H*0.4));
      ctx.fillStyle='#e8821a';
      ctx.beginPath();ctx.ellipse(px,py,5,4.4,0,0,7);ctx.fill();
      ctx.fillStyle='#c06a10';
      ctx.beginPath();ctx.arc(px,py-4,1.4,0,7);ctx.fill();
      /* глаза-треугольники */
      ctx.fillStyle='#2a1000';
      ctx.beginPath();ctx.arc(px-2,py-1,1,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(px+2,py-1,1,0,7);ctx.fill();
      ctx.fillStyle='#ffd24a';
      ctx.beginPath();ctx.arc(px-2,py-1,.5,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(px+2,py-1,.5,0,7);ctx.fill();
    }
  }else if(s==='winter'){
    /* снежинки + новогодняя гирлянда */
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.2;
    for(var i=0;i<16;i++){
      var x=(i*67+G.t*8)%W, y=(i*41+G.t*30)%H;
      ctx.beginPath();
      ctx.moveTo(x,y-4);ctx.lineTo(x,y+4);
      ctx.moveTo(x-3,y-2);ctx.lineTo(x+3,y+2);
      ctx.moveTo(x+3,y-2);ctx.lineTo(x-3,y+2);
      ctx.stroke();
    }
    /* гирлянда по забору (верхняя линия) */
    var gy=H*0.36;
    var garCols=['#ff5a5a','#ffd24a','#6ac8ff','#7ef0b0','#ff9ac8'];
    ctx.strokeStyle='rgba(60,80,30,.6)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(0,gy);
    for(var gx=0;gx<=W;gx+=40){
      ctx.quadraticCurveTo(gx+20,gy+(Math.sin(gx*0.1+G.t)*6),gx+40,gy);
    }
    ctx.stroke();
    for(var g=0;g<W/24;g++){
      var lx=g*24+12;
      var on=Math.sin(G.t*2+g*1.7)>-0.2;
      ctx.fillStyle=garCols[g%5];
      ctx.globalAlpha=on?1:.25;
      ctx.beginPath();ctx.arc(lx,gy+Math.sin(lx*0.1+G.t)*6,2.6,0,7);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}
function drawPet(){
  var pet=G.pet;
  if(!pet||W<2)return;
  var x=pet.x,y=pet.y,s=Math.min(W,H)/430*1.18;
  var sit=pet.state==='sit';
  var run=pet.state==='run';
  var t=pet.t;
  /* фаза шага: идём/бежим — лапы работают, сидим — стоим */
  var moving=!sit;
  var ph=moving?t*(run?15:8.5):0;
  var stride=moving?(run?4.4:3.4):0;
  var lift=moving?(run?2.6:1.7):0;
  var bob=sit?Math.sin(t*2.2)*1.2:-Math.abs(Math.sin(ph))*(run?2.0:1.3);
  var blink=(t%3.4)<0.13;
  var wag=Math.sin(t*(run?16:11))*(pet.joy>0?7:4.5);
  function legStep(pz,off){
    return {x:Math.sin(pz+off)*stride, y:-Math.max(0,Math.cos(pz+off))*lift};
  }
  var fA=legStep(ph,0),fB=legStep(ph,Math.PI),hL=legStep(ph,Math.PI);

  ctx.save();
  /* тень */
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath();ctx.ellipse(x,y+17.6*s,17*s,4.2*s,0,0,7);ctx.fill();

  /* щенок рисуется смотрящим вправо; dir — зеркало */
  ctx.translate(x,y-2*s+bob);
  ctx.scale(pet.dir,1);
  var inkC='rgba(46,34,26,.6)';
  var BW='#332b28',BW2='#25201d',WH='#fffaf2',WH2='#efe4d0',TAN='#c08347',TAN2='#8a5a28';

  /* хвост — виляет, с белым кончиком */
  ctx.lineCap='round';
  ctx.strokeStyle=BW2;ctx.lineWidth=4.4*s;
  ctx.beginPath();
  ctx.moveTo(-10*s,6*s);
  ctx.quadraticCurveTo(-17*s,4*s+wag*0.4,-19*s,-6*s+wag);
  ctx.stroke();
  ctx.fillStyle=WH;
  ctx.beginPath();ctx.arc(-19*s,-6*s+wag,2.6*s,0,7);ctx.fill();

  /* дальняя передняя лапа (за телом) */
  ctx.fillStyle=WH2;
  ctx.beginPath();ctx.ellipse(8.5*s+fB.x*s,(10.5+fB.y)*s,2.6*s,4.6*s,0,0,7);ctx.fill();
  ctx.lineWidth=1.8*s;ctx.strokeStyle=inkC;ctx.stroke();
  ctx.fillStyle=TAN;
  ctx.beginPath();ctx.arc(8.5*s+fB.x*s,(14+fB.y)*s,1.4*s,0,7);ctx.fill();

  /* задняя лапа */
  ctx.fillStyle=WH;
  ctx.beginPath();ctx.ellipse(-5*s+hL.x*s,(12+hL.y)*s,6.5*s,4.6*s,0,0,7);ctx.fill();
  ctx.lineWidth=2*s;ctx.strokeStyle=inkC;ctx.stroke();

  /* тело: белое с чёрным и рыжим пятнами */
  ctx.save();
  ctx.beginPath();ctx.ellipse(-1*s,6*s,11*s,8.4*s,0,0,7);
  ctx.fillStyle=WH;ctx.fill();
  ctx.clip();
  ctx.fillStyle=BW;
  ctx.beginPath();ctx.ellipse(-8.5*s,3*s,8*s,10*s,0.25,0,7);ctx.fill();
  ctx.fillStyle=TAN2;
  ctx.beginPath();ctx.ellipse(-2.5*s,-1.5*s,5.5*s,4.2*s,-0.2,0,7);ctx.fill();
  ctx.restore();
  ctx.beginPath();ctx.ellipse(-1*s,6*s,11*s,8.4*s,0,0,7);
  ctx.lineWidth=2.1*s;ctx.strokeStyle=inkC;ctx.stroke();

  /* ближняя передняя лапка с подушечкой */
  ctx.fillStyle=WH;
  ctx.beginPath();ctx.ellipse(4.5*s+fA.x*s,(10.5+fA.y)*s,2.6*s,4.6*s,0,0,7);ctx.fill();
  ctx.lineWidth=1.8*s;ctx.strokeStyle=inkC;ctx.stroke();
  ctx.fillStyle=TAN;
  ctx.beginPath();ctx.arc(4.5*s+fA.x*s,(14+fA.y)*s,1.4*s,0,7);ctx.fill();

  /* висячие уши (за головой) */
  ctx.fillStyle=BW2;ctx.strokeStyle=inkC;ctx.lineWidth=2*s;
  ctx.save();ctx.translate(-0.5*s,-12*s);ctx.rotate(-0.35);
  ctx.beginPath();ctx.ellipse(0,0,3.4*s,6.8*s,0,0,7);ctx.fill();ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(16.5*s,-12*s);ctx.rotate(0.35);
  ctx.beginPath();ctx.ellipse(0,0,3.4*s,6.8*s,0,0,7);ctx.fill();ctx.stroke();ctx.restore();

  /* голова — крупная */
  var hx=8*s,hy=-7*s,hr=9.6*s;
  ctx.beginPath();ctx.arc(hx,hy,hr,0,7);
  ctx.fillStyle=WH;ctx.fill();
  /* чёрная шапка на макушке */
  ctx.save();
  ctx.beginPath();ctx.arc(hx,hy,hr,0,7);ctx.clip();
  ctx.fillStyle=BW;
  ctx.beginPath();ctx.ellipse(hx,hy-5.6*s,hr*1.06,hr*0.55,0,0,7);ctx.fill();
  /* рыжее пятно вокруг правого глаза */
  ctx.fillStyle=TAN2;
  ctx.beginPath();ctx.ellipse(hx+4.2*s,hy-2*s,4*s,3.4*s,0,0,7);ctx.fill();
  /* рыжие «брови» */
  ctx.beginPath();ctx.arc(hx-3.4*s,hy-5.8*s,1.7*s,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(hx+3.4*s,hy-5.8*s,1.7*s,0,7);ctx.fill();
  ctx.restore();
  /* контур головы */
  ctx.beginPath();ctx.arc(hx,hy,hr,0,7);
  ctx.lineWidth=2.1*s;ctx.strokeStyle=inkC;ctx.stroke();

  /* большие глаза с бликами */
  var ey=hy-1.6*s;
  var exs=[hx-3.6*s,hx+3.6*s];
  for(var ei=0;ei<2;ei++){
    var ex=exs[ei];
    if(blink){
      ctx.strokeStyle='#241a12';ctx.lineWidth=1.8*s;ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(ex-1.9*s,ey);
      ctx.quadraticCurveTo(ex,ey+1.6*s,ex+1.9*s,ey);
      ctx.stroke();
    }else{
      ctx.fillStyle='#2f2018';
      ctx.beginPath();ctx.arc(ex,ey,2.9*s,0,7);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(ex-1*s,ey-1.1*s,1.15*s,0,7);ctx.fill();
      ctx.globalAlpha=.8;
      ctx.beginPath();ctx.arc(ex+1.2*s,ey+1*s,0.55*s,0,7);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  /* носик */
  ctx.fillStyle='#241d18';
  ctx.beginPath();
  ctx.moveTo(hx-1.9*s,hy+1.6*s);
  ctx.quadraticCurveTo(hx,hy+0.8*s,hx+1.9*s,hy+1.6*s);
  ctx.quadraticCurveTo(hx+1.5*s,hy+3.6*s,hx,hy+3.8*s);
  ctx.quadraticCurveTo(hx-1.5*s,hy+3.6*s,hx-1.9*s,hy+1.6*s);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath();ctx.arc(hx-0.7*s,hy+1.9*s,0.5*s,0,7);ctx.fill();
  /* ротик */
  ctx.strokeStyle='rgba(90,70,56,.75)';ctx.lineWidth=1.4*s;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(hx,hy+3.8*s);
  ctx.quadraticCurveTo(hx-1.5*s,hy+5.4*s,hx-3*s,hy+4.4*s);
  ctx.moveTo(hx,hy+3.8*s);
  ctx.quadraticCurveTo(hx+1.5*s,hy+5.4*s,hx+3*s,hy+4.4*s);
  ctx.stroke();
  /* язычок, когда рад или убегает */
  if(pet.joy>0||run){
    ctx.fillStyle='#ff8fa3';
    ctx.beginPath();ctx.ellipse(hx,hy+5.9*s,1.8*s,2.5*s,0,0,7);ctx.fill();
    ctx.strokeStyle='rgba(180,60,90,.5)';ctx.lineWidth=1*s;
    ctx.beginPath();ctx.moveTo(hx,hy+4.8*s);ctx.lineTo(hx,hy+7.6*s);ctx.stroke();
  }
  /* румянец */
  ctx.fillStyle='rgba(255,130,150,.4)';
  ctx.beginPath();ctx.ellipse(hx-6*s,hy+1.8*s,1.9*s,1.2*s,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(hx+6*s,hy+1.8*s,1.9*s,1.2*s,0,0,7);ctx.fill();

  ctx.restore();
  /* сердечки при поглаживании */
  if(pet.joy>0){
    ctx.font='900 '+(13+pet.joy*8)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ff5a7a';
    ctx.fillText('❤️',x,y-34*s-pet.joy*14);
    ctx.font='900 12px sans-serif';
    ctx.fillStyle='#ffd24a';
    ctx.fillText('Гав!',x,y-24*s);
  }
  /* подсказка при первом знакомстве */
  if(P.tutorPet&&pet.happy<5){
    ctx.font='900 10px sans-serif';ctx.textAlign='center';
    ctx.fillStyle='rgba(20,40,12,.75)';
    ctx.fillText('Погладь меня!',x,y+36*s);
  }
}

/* ---------- ДОЖДЬ И РАДУГА ---------- */
function drawWeather(){
  var w=G.weather;
  if(w.type==='rain'){
    ctx.strokeStyle='rgba(140,190,255,.55)';ctx.lineWidth=1.6;
    for(var i=0;i<w.rain.length;i++){
      var d=w.rain[i];
      ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-2,d.y+10);ctx.stroke();
    }
  }
  if(w.rainbow>0){
    var cx=W*0.5,cy=H*0.95,rad=Math.min(W*0.6,H*0.8);
    var cols=['#ff5a5a','#ff9a3a','#ffd24a','#7ef0b0','#6ac8ff','#c39aff'];
    ctx.save();
    ctx.globalAlpha=Math.min(1,w.rainbow)*0.75;
    ctx.lineWidth=6;
    for(var c=0;c<cols.length;c++){
      ctx.strokeStyle=cols[c];
      ctx.beginPath();ctx.arc(cx,cy,rad-c*6,Math.PI,0);ctx.stroke();
    }
    ctx.restore();

/* ---------- буст ×2 ---------- */
function boostOn(){return !!(G.boost&&G.boost.until>now());}

function startBoost(sec){

  sfx('level');haptic('heavy');confettiBurst();
  toast('🚀 Буст ×2 на '+mmss(sec)+'! Монеты капают вдвое быстрее');
  save();
}
function drawBoostChip(){
  if(!boostOn())return;
  var left=(G.boost.until-now())/1000;
  var txt='×2 '+mmss(left);
  ctx.save();
  ctx.font='900 13px -apple-system,Segoe UI,Roboto,sans-serif';

/* ---------- подарочные коробки на ферме ---------- */
function gifts(){if(!G.gifts)G.gifts=[];return G.gifts;}
function stepGifts(dt){
  var gs=gifts();
  if(!G.giftT)G.giftT=rf(30,55);
  G.giftT-=dt;
  if(G.giftT<=0){
    G.giftT=rf(45,85);
    if(gs.length<2&&W>100){
      var pen=L.pens&&L.pens.length?pick(L.pens):null;
      var isGold=pen&&Math.random()<0.4;
      if(isGold){
        gs.push({x:pen.x+rf(-18,18),y:pen.y+rf(-8,8),t:0,life:22,ph:rf(0,6),gold:1});
        toast('🥚 Золотое яйцо блестит в загоне! Успей забрать!');
      }else{
        gs.push({x:rf(36,W-36),y:rf(H*0.42,H-150),t:0,life:26,ph:rf(0,6)});
        toast('🎁 На ферме появилась подарочная коробка!');
      }
      sfx('pop');
    }
  }
  for(var i=gs.length-1;i>=0;i--){
    gs[i].t+=dt;
    if(gs[i].t>=gs[i].life)gs.splice(i,1);
  }
}
function drawGifts(){
  var gs=gifts();
  for(var i=0;i<gs.length;i++){
    var gf=gs[i];
    var blink=(gf.life-gf.t<5)?(Math.sin(G.t*12)>0?1:0.35):1;
    var bob=Math.sin(G.t*3+gf.ph)*3;
    ctx.save();
    ctx.globalAlpha=blink;
    ctx.translate(gf.x,gf.y+bob);
    var rg=ctx.createRadialGradient(0,0,2,0,0,34);
    if(gf.gold){rg.addColorStop(0,'rgba(255,210,80,.95)');rg.addColorStop(1,'rgba(255,210,80,0)');}
    else{rg.addColorStop(0,'rgba(255,240,150,.8)');rg.addColorStop(1,'rgba(255,240,150,0)');}
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,34,0,7);ctx.fill();
    ctx.globalAlpha=blink;
    ctx.globalAlpha=.2;ctx.fillStyle='#1e3a10';
    ctx.beginPath();ctx.ellipse(0,18,16,4.5,0,0,7);ctx.fill();
    ctx.globalAlpha=blink;
    ART.draw(ctx,gf.gold?'egg':'gift',gf.gold?16:19,G.t);
    var twk=Math.abs(Math.sin(G.t*4+gf.ph));
    ctx.fillStyle='rgba(255,255,255,'+(0.4+twk*0.6)+')';
    ctx.beginPath();ctx.arc(16,-16,2.2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(-14,-8,1.6,0,7);ctx.fill();
    ctx.restore();
  }
}
function openGift(i){
  var gs=gifts();var gf=gs[i];if(!gf)return;
  gs.splice(i,1);
  if(gf.gold){
    var gm=Math.round((200+P.lvl*60)*eraCoinMult()*boostMult());
    P.coins+=gm;P.totalCoins+=gm;
    popText(gf.x,gf.y-26,'ЗОЛОТОЕ ЯЙЦО! +'+fmt(gm),'#ffd24a');
    toast('🥚 Золотое яйцо! +'+fmt(gm)+' монет');
    burstXY(gf.x,gf.y,'#ffd964',20);
    save();paintAll();
    return;
  }
  sfx('done');haptic('medium');confettiBurst();
  var r=Math.random();
  if(r<0.4){
    var m=Math.round((80+P.lvl*25)*eraCoinMult()*boostMult());
    P.coins+=m;P.totalCoins+=m;
    popText(gf.x,gf.y-26,'+'+fmt(m)+' монет','#ffd24a');
  }else if(r<0.65){
    barnAdd('wheat',12);
    popText(gf.x,gf.y-26,'+12 пшеницы','#8fe36a');
  }else if(r<0.85){
    var xp=30+P.lvl*8;addXp(xp);
    popText(gf.x,gf.y-26,'+'+xp+' опыта','#6ac8ff');
  }else{
    startBoost(60);
  }
  burstXY(gf.x,gf.y,'#ffd964',14);
  save();paintAll();
}
/* ---------- монетный дождь (за рекламу) ---------- */
function coinRain(){if(!G.coinRain)G.coinRain={active:false,t:0,coins:[],spawn:0};return G.coinRain;}
function startCoinRain(){
  var cr=coinRain();
  cr.active=true;cr.t=0;cr.coins=[];cr.spawn=0;
  sfx('level');haptic('heavy');
  toast('💰 Монетный дождь! Тапай по монетам 10 секунд!');
}
function stepCoinRain(dt){
  var cr=coinRain();
  if(!cr.active)return;
  cr.t+=dt;cr.spawn-=dt;
  if(cr.t<10&&cr.spawn<=0&&cr.coins.length<14){
    cr.spawn=0.28;
    cr.coins.push({x:rf(24,W-24),y:-20,v:rf(90,150),ph:rf(0,6)});
  }
  for(var i=cr.coins.length-1;i>=0;i--){
    var c=cr.coins[i];
    c.y+=c.v*dt;
    c.x+=Math.sin(c.ph+c.y*0.02)*22*dt;
    if(c.y>H-70)cr.coins.splice(i,1);
  }
  if(cr.t>13&&cr.coins.length===0)cr.active=false;
  if(cr.t>16){cr.active=false;cr.coins=[];}
}
function drawCoinRain(){
  var cr=coinRain();
  if(!cr.active)return;
  for(var i=0;i<cr.coins.length;i++){
    var c=cr.coins[i];
    ctx.save();ctx.translate(c.x,c.y);
    ctx.rotate(Math.sin(c.ph+c.y*0.03)*0.4);
    ART.draw(ctx,'coin',13,G.t);
    ctx.restore();
  }
}
function catchCoin(i){
  var cr=coinRain();var c=cr.coins[i];if(!c)return;
  cr.coins.splice(i,1);
  var m=Math.round((8+P.lvl*3)*eraCoinMult());
  P.coins+=m;P.totalCoins+=m;
  sfx('coin');haptic('light');
  burstXY(c.x,c.y,'#ffd964',6);
  popText(c.x,c.y-14,'+'+m,'#ffd24a');
  save();paintTop();
}
/* ---------- грузовик заказа ---------- */
function spawnTruck(){G.truck={t:0};}
function stepTruck(dt){
  if(!G.truck)return;
  G.truck.t+=dt;
  if(G.truck.t>3.2)G.truck=null;
}
function drawTruck(){

/* ---------- уточка ---------- */
function stepDuck(dt){
  var d=G.duck,pd=L.pond;
  if(!d)return;
  if(d.joy>0)d.joy-=dt;
  if(d.quack>0)d.quack-=dt;
  if(!pd){d.x=null;return;}
  d.ph+=dt;
  d.x=pd.x+Math.sin(d.ph*0.30)*pd.rx*0.45;
  d.y=pd.y+Math.sin(d.ph*1.6)*2+2;
}
function petDuck(){
  var d=G.duck;
  if(!d)return;
  d.joy=1.2;d.quack=0.7;
  sfx('quack');haptic('light');
  P.duckPats=(P.duckPats||0)+1;
  burstXY(d.x,d.y-16,'#ff5a7a',6);
  popText(d.x,d.y-30,'Кря!','#ff9ac8');
  if(P.duckPats%7===0){
    var m=Math.round((30+P.lvl*5)*eraCoinMult()*boostMult());
    P.coins+=m;P.totalCoins+=m;
    popText(d.x,d.y-46,'+'+m+' монет','#ffd24a');
    toast('🦆 Уточка довольна и подарила монетки!');
  }
  if(!P.seen.duckHi){P.seen.duckHi=1;ach('duckHello','🦆 Уточка к тебе привыкла!');}
  save();paintTop();
}
function drawPond(){
  var pd=L.pond;
  if(!pd)return;
  ctx.save();ctx.translate(pd.x,pd.y);
  /* песчаный берег */
  ctx.fillStyle='#e8d489';
  ctx.beginPath();ctx.ellipse(0,2,pd.rx+7,pd.ry+6,0,0,7);ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(150,120,50,.4)';ctx.stroke();
  /* вода */
  var g=ctx.createLinearGradient(0,-pd.ry,0,pd.ry);
  g.addColorStop(0,'#7fd4ff');g.addColorStop(1,'#2a8fd0');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(0,0,pd.rx,pd.ry,0,0,7);ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,.65)';ctx.stroke();
  /* волны-блики */
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.6;ctx.lineCap='round';
  for(var i=0;i<3;i++){
    var wx=-pd.rx*0.5+i*pd.rx*0.45+Math.sin(G.t*1.4+i)*3;
    var wy=-pd.ry*0.3+(i%2)*pd.ry*0.5;
    ctx.beginPath();ctx.moveTo(wx-7,wy);ctx.quadraticCurveTo(wx,wy-3,wx+7,wy);ctx.stroke();
  }
  /* кувшинка */
  var lx=pd.rx*0.55,ly=pd.ry*0.35;
  ctx.fillStyle='#3fa832';
  ctx.beginPath();ctx.ellipse(lx,ly,9,5.5,0,0,7);ctx.fill();
  ctx.fillStyle='#ff8ab0';
  for(var p=0;p<5;p++){
    var a=p*1.256;
    ctx.beginPath();ctx.ellipse(lx+Math.cos(a)*3,ly-2+Math.sin(a)*2,3,1.8,a,0,7);ctx.fill();
  }
  ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.arc(lx,ly-2,1.6,0,7);ctx.fill();
  /* камыши */
  for(var s2=0;s2<2;s2++){
    var cx2=-pd.rx*0.85+s2*7,cy2=-pd.ry*0.4;
    ctx.strokeStyle='#4e8f2f';ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cx2,cy2+6);ctx.quadraticCurveTo(cx2-2,cy2-8,cx2-1,cy2-16);ctx.stroke();
    ctx.fillStyle='#7a4a22';
    ctx.beginPath();ctx.ellipse(cx2-1,cy2-18,2.6,6,0,0,7);ctx.fill();
  }
  ctx.restore();
  drawDuck();
}
function drawDuck(){
  var pd=L.pond,d=G.duck;
  if(!pd||!d||d.x==null)return;
  ctx.save();ctx.translate(d.x,d.y);
  var dir=Math.cos(d.ph*0.30)>=0?1:-1;
  ctx.scale(dir,1);
  /* круги на воде */
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.ellipse(0,6,14,4,0,0,7);ctx.stroke();
  ctx.translate(0,Math.sin(G.t*3)*1.2);
  /* тело */
  ctx.fillStyle='#fffdf6';
  ctx.beginPath();ctx.ellipse(-2,0,11,7,0,0,7);ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(90,70,40,.55)';ctx.stroke();
  /* хвостик */
  ctx.beginPath();ctx.moveTo(-11,-1);ctx.lineTo(-16,-6);ctx.lineTo(-9,-5);ctx.closePath();ctx.fill();ctx.stroke();
  /* крыло */
  ctx.fillStyle='#e8e2d0';
  ctx.beginPath();ctx.ellipse(-3,0,5.5,3.6,0.3,0,7);ctx.fill();
  ctx.lineWidth=1.4;ctx.stroke();
  /* голова */
  ctx.fillStyle='#fffdf6';
  ctx.beginPath();ctx.arc(7,-7,6,0,7);ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(90,70,40,.55)';ctx.stroke();
  /* клюв (открыт, когда крякает) */
  ctx.fillStyle='#f5a623';
  if(d.quack>0){
    ctx.beginPath();ctx.moveTo(12,-8);ctx.lineTo(19,-9.5);ctx.lineTo(12,-6);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(12,-5.5);ctx.lineTo(18,-3.5);ctx.lineTo(12,-4.5);ctx.closePath();ctx.fill();
  }else{
    ctx.beginPath();ctx.moveTo(12,-8);ctx.lineTo(18,-6.5);ctx.lineTo(12,-5);ctx.closePath();ctx.fill();
  }
  /* глаз и румянец */
  ctx.fillStyle='#2b1d14';ctx.beginPath();ctx.arc(8,-8,1.5,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7.5,-8.5,0.6,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,130,150,.4)';
  ctx.beginPath();ctx.ellipse(5.5,-4.6,1.6,1,0,0,7);ctx.fill();
  ctx.restore();
  if(d.joy>0){
    ctx.font='900 12px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ff5a7a';
    ctx.fillText('❤️',d.x,d.y-24-d.joy*8);
  }
}
/* ---------- ярмарка ---------- */
function fairActive(){return !!(P.fairUntil&&now()<P.fairUntil);}
function makeFairOrders(){
  var pool=availableItems();
  if(!pool.length)pool=['wheat'];
  var out=[];
  for(var i=0;i<3;i++){
    var id=pick(pool);
    var qty=ri(2,5);
    out.push({
      id:'f'+now()+'_'+i+ri(10,99),
      item:id,qty:qty,
      coins:Math.round(itemPrice(id)*qty*3*eraCoinMult()),
      xp:Math.max(3,Math.round(itemPrice(id)*qty/10))
    });
  }
  return out;
}
function startFair(){
  P.fairUntil=now()+8*60*1000;
  P.fairNext=P.fairUntil+30*60*1000;
  P.fairOrders=makeFairOrders();
  G.fairWas=1;
  sfx('level');haptic('heavy');confettiBurst();
  toast('🎪 Ярмарка приехала! Платит ×3 за товары, 8 минут!');
  save();paintAll();
}
function stepFair(dt){
  if(!P.fairNext)P.fairNext=now()+3*60*1000;
  if(fairActive()){G.fairWas=1;return;}
  if(G.fairWas){
    G.fairWas=0;
    P.fairOrders=[];
    toast('🎪 Ярмарка уехала. Следующий приезд через '+mmss((P.fairNext-now())/1000));
    save();
  }
  if(now()>=P.fairNext)startFair();
}
function deliverFair(oid){
  if(!fairActive()){sfx('err');toast('Ярмарка уже уехала');return false;}
  var idx=-1;
  for(var i=0;i<(P.fairOrders||[]).length;i++)if(P.fairOrders[i].id===oid)idx=i;
  if(idx<0)return false;
  var o=P.fairOrders[idx];
  if(!barnHas(o.item,o.qty)){sfx('err');toast('Нужно '+itemName(o.item)+' ×'+o.qty);return false;}
  barnTake(o.item,o.qty);
  var pay=Math.round(o.coins*boostMult());
  P.coins+=pay;P.totalCoins+=pay;
  P.fairDone=(P.fairDone||0)+1;
  addXp(o.xp);
  P.fairOrders.splice(idx,1);
  sfx('order');haptic('medium');
  burstXY(W/2,H*0.4,'#ffd964',16);
  toast('🎪 Продано на ярмарке: +'+fmt(pay)+' монет!');
  if(!P.fairOrders.length){
    var bonus=Math.round((250+P.lvl*40)*eraCoinMult());
    P.coins+=bonus;P.totalCoins+=bonus;
    setTimeout(function(){
      confettiBurst();sfx('win');
      toast('🏆 Ярмарка довольна! Бонус +'+fmt(bonus)+' монет');
    },900);
  }
  save();paintAll();
  return true;
}
function viewFair(){
  if(!fairActive())
    return '<div class="muted" style="text-align:center;padding:26px 10px">'+
      'Ярмарка уехала по соседним деревням.<br>Следующий приезд: <b>'+
      mmss(Math.max(0,((P.fairNext||0)-now())/1000))+'</b></div>';
  var h='<div class="muted" style="margin-bottom:11px">Ярмарка платит <b>×3</b> от обычной цены! '+

       '<div class="foot"><div class="rew">'+
       '<span>'+icoTag('coin',17)+fmt(o.coins)+(boostOn()?' <b style="color:#c47b06">×2!</b>':'')+'</span>'+
       '<span>'+icoTag('star',17)+o.xp+'</span>'+
       '<span class="muted" style="font-size:11px">×3 цена!</span></div>'+

/* ---------- друзья-помощники ---------- */
function helperActive(){return !!(P.helperUntil&&now()<P.helperUntil);}
function hireHelper(){
  P.helperUntil=now()+5*60*1000;
  P.helperCount=(P.helperCount||0)+1;
  G.helper=null;
  sfx('done');haptic('medium');confettiBurst();
  toast('🧑‍🌾 Помощник нанят на 5 минут — собирает всё сам!');
  save();paintAll();
}
function stepHelper(dt){
  if(!helperActive()){G.helper=null;return;}
  var h=G.helper;
  if(!h)h=G.helper={x:W*0.3,y:(L.fenceY||H*0.335)+10,dir:1,t:0,acc:0};
  /* помощник гуляет вдоль забора — между грядками и загонами */
  h.y=(L.fenceY||H*0.335)+10;
  h.t+=dt;
  h.x+=h.dir*30*dt;
  if(h.x<W*0.12){h.x=W*0.12;h.dir=1;}
  if(h.x>W*0.88){h.x=W*0.88;h.dir=-1;}
  h.acc+=dt;
  if(h.acc>=4){h.acc=0;helperCollect(h);}
}
function helperCollect(h){
  if(barnFree()<=0)return;
  var i;
  for(i=0;i<P.plots.length;i++){
    if(plotState(P.plots[i])==='ready'){
      if(harvestPlot(i,true)){
        sfx('pop');popText(h.x,h.y-34,'собрал!','#9ad87a');
        save();paintAll();return;
      }
    }
  }
  for(i=0;i<P.animals.length;i++){
    if(animalState(P.animals[i])==='ready'&&collectAnimal(i,true)){
      sfx('pop');popText(h.x,h.y-34,'собрал!','#9ad87a');
      save();paintAll();return;
    }
  }
  for(i=0;i<P.machines.length;i++){
    var m=P.machines[i];
    for(var j=m.queue.length-1;j>=0;j--){
      if(cookReady(m.queue[j])&&collectCook(i,j,true)){
        sfx('pop');popText(h.x,h.y-34,'собрал!','#9ad87a');
        save();paintAll();return;
      }
    }
  }
}
function drawTent(){
  if(!fairActive()||!L.tent)return;
  var t=L.tent;

/* ---------- лепестки в поздних эпохах ---------- */
function stepPetals(dt){
  if(eraNum()<3){if(G.petals)G.petals.length=0;return;}
  if(!G.petals)G.petals=[];
  if(G.petals.length<22&&Math.random()<dt*3){
    G.petals.push({x:rf(0,W),y:-10,v:rf(26,48),ph:rf(0,6),r:rf(2.5,4)});
  }
  for(var i=G.petals.length-1;i>=0;i--){
    var p=G.petals[i];
    p.y+=p.v*dt;p.x+=Math.sin(p.ph+p.y*0.02)*20*dt;p.ph+=dt;
    if(p.y>H+12)G.petals.splice(i,1);
  }
}
function drawPetals(){
  if(eraNum()<3||!G.petals||!G.petals.length)return;
  ctx.save();
  for(var i=0;i<G.petals.length;i++){
    var p=G.petals[i];
    ctx.globalAlpha=.85;
    ctx.fillStyle=(i%2)?'#ffb7d0':'#ff8ab0';
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(p.ph)*0.8);
    ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*0.62,0,0,7);ctx.fill();
    ctx.restore();
  }
  ctx.restore();ctx.globalAlpha=1;
}

/* Детали лужайки: кустики, цветы, камешки, дорожка.
   Позиции считаются один раз по фиксированному зерну — сцена
   стабильна между кадрами и не «мигает». */
var groundPts=null,groundKey='';
function buildGround(){
  var seed=1337;
  function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
  var pts=[];
  var y0=H*0.36,y1=H-96;
  for(var i=0;i<26;i++){
    pts.push({
      x:rnd()*W,
      y:y0+rnd()*(y1-y0),
      t:rnd(),
      s:0.7+rnd()*0.7
    });
  }
  groundPts=pts;
}
function drawGround(){
  var key=W+'x'+H;
  if(!groundPts||groundKey!==key){buildGround();groundKey=key;}
  /* мягкая дорожка от амбара вглубь фермы */
  ctx.save();
  ctx.globalAlpha=.20;
  ctx.strokeStyle='#d8c89a';
  ctx.lineWidth=Math.max(16,W*0.055);
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(W*0.5,H*0.38);
  ctx.quadraticCurveTo(W*0.62,H*0.62,W*0.86,H-120);
  ctx.stroke();
  ctx.restore();

  for(var i=0;i<groundPts.length;i++){
    var g=groundPts[i],s=g.s*7;
    ctx.save();ctx.translate(g.x,g.y);
    if(g.t<0.42){
      /* пучок травы */
      ctx.strokeStyle='rgba(78,150,44,.55)';
      ctx.lineWidth=s*0.28;ctx.lineCap='round';
      for(var k=-1;k<=1;k++){
        ctx.beginPath();
        ctx.moveTo(k*s*0.34,0);
        ctx.quadraticCurveTo(k*s*0.5,-s*0.6,k*s*0.75,-s*1.0);
        ctx.stroke();
      }
    }else if(g.t<0.66){
      /* ромашка */
      ctx.fillStyle='#fff';
      for(var f=0;f<5;f++){
        var a=f*1.256;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a)*s*0.34,Math.sin(a)*s*0.34,s*0.24,s*0.16,a,0,7);
        ctx.fill();
      }
      ctx.fillStyle='#ffd964';
      ctx.beginPath();ctx.arc(0,0,s*0.22,0,7);ctx.fill();
    }else if(g.t<0.84){
      /* кустик */
      ctx.fillStyle='#5c9c38';
      ctx.beginPath();ctx.arc(-s*0.32,0,s*0.42,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(s*0.3,s*0.06,s*0.36,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(0,-s*0.24,s*0.44,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.16)';
      ctx.beginPath();ctx.arc(-s*0.12,-s*0.4,s*0.18,0,7);ctx.fill();
    }else{
      /* камешек */
      ctx.fillStyle='rgba(150,160,150,.5)';
      ctx.beginPath();ctx.ellipse(0,0,s*0.4,s*0.28,0.3,0,7);ctx.fill();
    }
    ctx.restore();
  }
}
function drawFence(){
  var y=L.fenceY||(H*0.335);
  var gold=eraNum()>=2;
  /* перекладины в духе Hay Day (со 2-й эпохи — золотые) */
  ctx.strokeStyle=gold?'#ffd964':'#fffdf6';ctx.lineWidth=4.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,y+9);ctx.lineTo(W,y+9);ctx.stroke();
  ctx.strokeStyle='rgba(120,150,190,.35)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(0,y+2.2);ctx.lineTo(W,y+2.2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,y+11.2);ctx.lineTo(W,y+11.2);ctx.stroke();
  /* штакетник с острыми верхушками */
  for(var x=14;x<W;x+=34){
    ctx.fillStyle=gold?'#fff3c4':'#fffdf6';
    ctx.beginPath();
    ctx.moveTo(x-4,y+16);ctx.lineTo(x-4,y-6);ctx.lineTo(x,y-12);
    ctx.lineTo(x+4,y-6);ctx.lineTo(x+4,y+16);
    ctx.closePath();ctx.fill();
    ctx.lineWidth=1.6;ctx.strokeStyle='rgba(120,150,190,.4)';ctx.stroke();
  }
}
