<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7cc447">
<title>Солнечная Ферма 🌻</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{
  font-family:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:#12200f;color:#f2f8ee;display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;
}
#app{
  position:relative;width:100%;height:100%;max-width:980px;max-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#8fd3f4 0%,#b7e59a 38%,#7cc447 100%);
}
canvas{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1}

/* ---------- верхняя панель ---------- */
#top{
  position:relative;z-index:5;flex:0 0 auto;pointer-events:none;
  padding:calc(7px + env(safe-area-inset-top)) 9px 0;
  display:flex;align-items:flex-start;gap:7px;
}
.chip{
  pointer-events:auto;
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,rgba(255,253,244,.98),rgba(250,236,203,.95));
  border:2.5px solid #ffffff;border-radius:999px;
  padding:5px 12px 5px 6px;
  box-shadow:0 3px 0 rgba(60,100,40,.30),0 0 0 2px rgba(150,100,40,.30),0 6px 14px rgba(0,0,0,.20);
  font-weight:900;font-size:15px;color:#33501f;line-height:1;
  font-variant-numeric:tabular-nums;
}
.chip canvas{width:22px;height:22px;flex:0 0 auto}
#lvlChip{flex-direction:column;align-items:stretch;gap:3px;padding:5px 11px;min-width:96px}
#lvlTop{display:flex;align-items:center;gap:5px;font-size:13px}
#lvlNum{
  background:linear-gradient(180deg,#ffd964,#f0a92c);color:#4a2f00;
  border-radius:999px;padding:1px 7px;font-size:12px;font-weight:900;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
#xpBar{height:6px;border-radius:99px;background:rgba(60,100,40,.22);overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
#xpFill{height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#8fe36a,#4fc12a);
  box-shadow:0 0 8px rgba(120,230,90,.7),inset 0 1px 0 rgba(255,255,255,.5);
  transition:width .35s}
#spacer{flex:1}
.nightBtn.off{opacity:.62}
.icoBtn{
  pointer-events:auto;width:40px;height:40px;flex:0 0 auto;border:0;cursor:pointer;
  border-radius:13px;font-size:17px;line-height:1;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(226,240,216,.92));
  border:2px solid rgba(90,140,60,.32);
  box-shadow:0 3px 0 rgba(60,100,40,.3),0 5px 12px rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;
}
.icoBtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,100,40,.3)}

/* ---------- нижняя навигация ---------- */
#nav{
  position:relative;z-index:6;flex:0 0 auto;margin-top:auto;
  display:flex;gap:5px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(24,46,16,.0),rgba(24,46,16,.55) 45%,rgba(18,36,12,.85));
}
#nav button{
  flex:1;border:0;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px 6px;border-radius:15px;
  background:linear-gradient(180deg,#fffdf4,#f7e6c0);
  border:2px solid #ffffff;
  box-shadow:0 4px 0 rgba(40,80,26,.45),0 6px 14px rgba(0,0,0,.28);
  color:#33501f;font-size:10.5px;font-weight:900;letter-spacing:.2px;
  transition:transform .12s cubic-bezier(.34,1.6,.5,1),box-shadow .12s;
}
#nav button canvas{width:26px;height:26px}
#nav button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(40,80,26,.45)}
#nav button.on{
  background:linear-gradient(180deg,#ffe07a,#f5b731);
  border-color:rgba(255,255,255,.75);
  box-shadow:0 4px 0 #b57d12,0 7px 18px rgba(245,183,49,.45);
}
#nav button .bdg{
  position:absolute;top:2px;right:8px;min-width:17px;height:17px;border-radius:99px;
  background:linear-gradient(180deg,#ff7a6b,#e03b28);color:#fff;font-size:10px;font-weight:900;
  display:none;align-items:center;justify-content:center;padding:0 4px;
  box-shadow:0 2px 5px rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.85);
}
#nav button{position:relative}
#nav button .bdg.on{display:flex}

/* ---------- всплывающая подсказка ---------- */
#toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
  background:linear-gradient(180deg,rgba(28,52,18,.97),rgba(18,36,12,.97));
  border:2px solid rgba(150,220,110,.45);color:#eaf7e2;
  padding:10px 18px;border-radius:15px;font-size:13.5px;font-weight:800;
  opacity:0;pointer-events:none;max-width:88%;text-align:center;
  box-shadow:0 8px 26px rgba(0,0,0,.5);
}
#toast.on{animation:tst 2.1s ease}
@keyframes tst{
  0%{opacity:0;transform:translate(-50%,10px)}
  12%{opacity:1;transform:translate(-50%,0)}
  80%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-8px)}
}

/* ---------- панели ---------- */
.panel{
  position:absolute;left:0;right:0;bottom:0;top:auto;max-height:76%;z-index:30;
  display:none;flex-direction:column;
  background:linear-gradient(180deg,#fff9ea,#f4e3bd);
  border-top:3px solid rgba(90,140,60,.4);
  border-radius:22px 22px 0 0;
  box-shadow:0 -10px 34px rgba(0,0,0,.4);
  color:#2c4519;
}
.panel.on{display:flex;animation:pIn .26s cubic-bezier(.22,1,.36,1)}
@keyframes pIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.pHead{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:13px 14px 11px;
  background:linear-gradient(180deg,#cf935a,#a06a33 55%,#8a5a28);
  border-bottom:3px solid #6e4620;
  box-shadow:inset 0 2px 0 rgba(255,235,190,.5),inset 0 -3px 0 rgba(60,35,10,.25);
}
.pHead h3{font-size:18px;font-weight:900;flex:1;letter-spacing:-.2px;color:#fff6e0;
  text-shadow:0 2px 0 rgba(90,55,15,.55)}
.pHead .x{
  width:32px;height:32px;border:0;border-radius:11px;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(180deg,#ffe9c0,#e8c489);color:#6e4620;font-size:17px;font-weight:900;
  box-shadow:0 2px 0 rgba(60,35,10,.4);
}
.pHead .x:active{transform:translateY(2px)}
.pBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:11px 12px 18px;
  scroll-behavior:smooth}

/* карточки товаров/семян */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.gi{
  background:linear-gradient(180deg,#fffdf4,#fbeccb);
  border:2px solid rgba(160,106,51,.38);border-radius:18px;
  padding:9px 7px 8px;text-align:center;cursor:pointer;position:relative;
  box-shadow:0 3px 0 rgba(90,140,60,.22),inset 0 1px 0 #fff;
  transition:transform .12s cubic-bezier(.34,1.6,.5,1),box-shadow .12s;
}
.gi:active{transform:translateY(3px);box-shadow:0 0 0 rgba(90,140,60,.22)}
.gi canvas{width:46px;height:46px;display:block;margin:0 auto 4px}
.gi .n{font-size:11.5px;font-weight:800;line-height:1.2;color:#2c4519}
.gi .p{font-size:12px;font-weight:900;color:#c47b06;margin-top:3px;
  display:flex;align-items:center;justify-content:center;gap:3px}
.gi .p canvas{width:14px;height:14px;margin:0;display:inline-block}
.gi.lock{opacity:.5;cursor:default}
.gi .lk{font-size:10px;color:#7a8f66;font-weight:800;margin-top:2px}
.gi .cnt{
  position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:99px;
  background:linear-gradient(180deg,#8fe36a,#3fa724);color:#fff;font-size:11.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 5px;
  border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.28);
}

/* строки заказов */
.ord{
  background:linear-gradient(180deg,#fffdf4,#fbeccb);
  border:2px solid rgba(160,106,51,.38);border-radius:20px;
  padding:11px 12px;margin-bottom:10px;
  box-shadow:0 3px 0 rgba(90,140,60,.2),inset 0 1px 0 #fff;
}
.ord .who{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ord .who canvas{width:34px;height:34px;flex:0 0 auto}
.ord .who b{font-size:13.5px;font-weight:900;flex:1}
.ord .items{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.oi{
  display:flex;align-items:center;gap:4px;
  background:rgba(90,140,60,.1);border:1.5px solid rgba(90,140,60,.2);
  border-radius:11px;padding:4px 8px 4px 5px;font-size:12.5px;font-weight:900;
}
.oi canvas{width:24px;height:24px}
.oi.ok{background:rgba(80,190,60,.18);border-color:rgba(60,170,40,.45);color:#2a6b16}
.oi.no{opacity:.75}
.ord .foot{display:flex;align-items:center;gap:8px}
.ord .rew{display:flex;align-items:center;gap:9px;flex:1;font-size:13px;font-weight:900}
.ord .rew span{display:flex;align-items:center;gap:3px}
.ord .rew canvas{width:17px;height:17px}
.btn{
  border:0;cursor:pointer;font-family:inherit;font-weight:900;color:#22400d;
  background:linear-gradient(180deg,#b6ec86,#68c43a 50%,#469b22);
  padding:11px 18px;border-radius:16px;font-size:14px;text-shadow:0 1px 0 rgba(255,255,255,.45);
  box-shadow:0 4px 0 #2e7415,0 6px 16px rgba(80,180,50,.32),inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .12s cubic-bezier(.34,1.6,.5,1),box-shadow .12s;
}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 #2e7415}
.btn:disabled{filter:saturate(.4);opacity:.6;cursor:default}
.btn.sm{font-size:12.5px;padding:9px 14px;border-radius:13px}
.btn.gold{
  color:#4a2f00;background:linear-gradient(180deg,#ffe488,#f5b731 50%,#d3900f);
  box-shadow:0 4px 0 #9c6a08,0 6px 16px rgba(245,183,49,.35),inset 0 1px 0 rgba(255,255,255,.6);
}
.btn.gold:active{box-shadow:0 0 0 #9c6a08}
.btn.ad{
  color:#04263f;background:linear-gradient(180deg,#bfe9ff,#4fb3f5 46%,#1f7fd0);
  box-shadow:0 4px 0 #14568f,0 6px 18px rgba(60,160,240,.42),inset 0 1px 0 rgba(255,255,255,.6);
  position:relative;overflow:hidden;
}
.btn.ad:active{box-shadow:0 0 0 #14568f}
.btn.ad::before{
  content:'';position:absolute;top:0;bottom:0;width:38%;left:-45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  animation:adShine 3.4s ease-in-out infinite;pointer-events:none;
}
@keyframes adShine{0%,62%{left:-45%}100%{left:115%}}
.btn.ghost{
  color:#3d5c26;background:linear-gradient(180deg,#fff,#e6f2da);
  box-shadow:0 4px 0 rgba(90,140,60,.34),inset 0 1px 0 #fff;
}
.btn.ghost:active{box-shadow:0 0 0 rgba(90,140,60,.34)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.muted{font-size:12px;color:#6d8459;line-height:1.5}
.sec{font-size:12px;font-weight:900;color:#5d7a45;text-transform:uppercase;
  letter-spacing:.5px;margin:14px 0 8px;display:flex;align-items:center;gap:7px}
.sec::before{content:'';width:3px;height:13px;border-radius:2px;background:#7cc447}
.sec:first-child{margin-top:0}

/* модалка */
#modal{
  position:absolute;inset:0;z-index:70;display:none;
  align-items:center;justify-content:center;padding:22px;
  background:rgba(14,28,10,.72);backdrop-filter:blur(6px);
}
#modal.on{display:flex;animation:mIn .22s ease}
@keyframes mIn{from{opacity:0}to{opacity:1}}
#mBox{
  width:100%;max-width:330px;text-align:center;
  background:linear-gradient(180deg,#f8fcf4,#e3efd6);
  border:3px solid rgba(255,255,255,.8);border-radius:24px;
  padding:20px 18px 17px;color:#2c4519;
  box-shadow:0 18px 50px rgba(0,0,0,.55);
  animation:mPop .3s cubic-bezier(.22,1.5,.4,1);
}
@keyframes mPop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
#mIco{margin:0 auto 9px;display:block;width:72px;height:72px}
#mTtl{font-size:19px;font-weight:900;margin-bottom:7px;letter-spacing:-.3px}
#mTxt{font-size:13.5px;line-height:1.55;color:#48633180;color:#4a6633}
#mTxt b{color:#2c4519}
#mBtns{display:flex;flex-direction:column;gap:8px;margin-top:15px}

/* экран-заставка */
#intro{
  position:absolute;inset:0;z-index:80;display:flex;
  flex-direction:column;align-items:center;justify-content:flex-start;gap:13px;padding:26px;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;

#intro.hide{opacity:0;pointer-events:none;transition:opacity .6s}
#intro>*{position:relative;z-index:1}
#intro::-webkit-scrollbar{display:none}
#intro h1{margin-top:auto}
#intro .note{margin-bottom:auto}
#intro .sub{background:rgba(255,252,240,.9);border-radius:16px;padding:9px 16px;
  box-shadow:0 3px 0 rgba(120,80,20,.25),0 8px 22px rgba(0,0,0,.18)}
#intro h1{text-shadow:0 3px 0 #e05a4e,0 6px 0 rgba(150,50,35,.55),0 12px 26px rgba(0,0,0,.35)}
#intro .btn{font-size:18px;padding:15px 40px;box-shadow:0 5px 0 #9c6a08,0 10px 26px rgba(245,183,49,.5),inset 0 2px 0 rgba(255,255,255,.65)}
#introArt{width:150px;height:150px}
#intro h1{
  font-size:clamp(30px,9vw,44px);font-weight:900;letter-spacing:-1px;line-height:1;
  color:#fff;
  text-shadow:0 3px 0 #4b8a26,0 6px 0 rgba(40,80,20,.5),0 12px 26px rgba(0,0,0,.35);
}
#intro .sub{font-size:14px;font-weight:700;color:#2f5418;max-width:290px;line-height:1.55}
#intro .sub b{color:#1f3d0e}
#intro .note{
  font-size:13px;font-weight:800;color:#1f3d0e;line-height:1.4;
  background:rgba(255,252,240,.9);border-radius:999px;padding:7px 14px;
  box-shadow:0 2px 0 rgba(120,80,20,.25),0 6px 16px rgba(0,0,0,.18);
}
#introArt{animation:floaty 3.4s ease-in-out infinite}
#intro h1{animation:floaty 3.4s ease-in-out .5s infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* пауза-виджет */
#pw{
  position:fixed;top:calc(9px + env(safe-area-inset-top));
  right:calc(9px + env(safe-area-inset-right));
  width:42px;height:42px;border-radius:13px;cursor:pointer;z-index:2147483000;
  border:2px solid rgba(90,140,60,.35);
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(226,240,216,.92));
  color:#33501f;font:900 15px/1 inherit;letter-spacing:1px;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(60,100,40,.3),0 5px 12px rgba(0,0,0,.2);padding:0;
}
#pw.on{display:flex}
#pw:active{transform:translateY(2px)}
#pwScr{
  position:fixed;inset:0;z-index:2147483001;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:rgba(14,28,10,.85);backdrop-filter:blur(10px);padding:24px;
}
#pwScr.on{display:flex}
#pwScr h3{font-size:26px;font-weight:900;color:#fff;margin-bottom:4px;
  text-shadow:0 3px 0 rgba(0,0,0,.35)}
#pwScr button{
  width:100%;max-width:280px;min-height:48px;border:0;cursor:pointer;
  font-family:inherit;font-weight:900;font-size:16px;border-radius:16px;
  color:#22400d;background:linear-gradient(180deg,#eaf7e0,#c2e0a8);
  box-shadow:0 4px 0 rgba(0,0,0,.4);
  transition:transform .1s cubic-bezier(.34,1.6,.5,1),box-shadow .1s;
}
#pwScr button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
#pwScr .pwGo{background:linear-gradient(180deg,#b6ec86,#68c43a 55%,#469b22)}
#pwScr .pwOut{background:linear-gradient(180deg,#ffd0d8,#ff8fa3 55%,#e05b74);color:#3a0c16}
#pwScr .pwSm{
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.07));
  color:#eaf7e2;border:1px solid rgba(255,255,255,.2);font-size:14px;min-height:42px;
}
/* на узких экранах верхняя панель не должна переполняться */
@media (max-width:380px){
  #top{gap:5px;padding-left:6px;padding-right:6px}
  #quickHarv span:nth-child(2),#quickFeed span:nth-child(2){display:none}
  #quickHarv,#quickFeed{padding:4px 7px !important}
  #eraChip{padding:3px 5px !important;gap:2px}
}
@media (min-width:1000px){
  body{background:radial-gradient(70% 70% at 50% 42%,#20391b,#0b1509)}
  #app{height:96vh;max-height:96vh;border-radius:26px;
    box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 3px rgba(255,255,255,.10)}
}
/* низкие экраны: заставка должна влезать целиком, без обрезки */
@media (max-height:520px){
  #intro{gap:8px;padding:12px 18px}
  #intro h1{font-size:clamp(24px,6.5vw,34px);animation:none}
  #intro .sub{font-size:13px;line-height:1.4;padding:7px 12px;max-width:min(460px,90vw)}
  #intro .sub br{display:none}
  #intro .btn{font-size:16px;padding:11px 30px}
  #intro .note{font-size:12px;padding:5px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<button id="pw" aria-label="Пауза">II</button>
<div id="pwScr" role="dialog" aria-modal="true" aria-label="Пауза">
  <h3>Пауза</h3>
  <button class="pwGo" id="pwGo">Продолжить</button>
  <button class="pwSm vibBtn" id="pwVib">Вибрация: вкл</button>
  <button class="pwSm nightBtn" id="pwNight">Ночь: вкл</button>
  <button class="pwOut" id="pwOut">Выйти в главное меню</button>
</div>

<div id="app">
  <canvas id="cv"></canvas>

  <div id="top">
    <div class="chip" id="coinChip"><canvas id="coinIco" width="44" height="44"></canvas><span id="coins">0</span></div>
    <div class="chip" id="lvlChip">
      <div id="lvlTop"><span id="lvlNum">1</span><span id="lvlName">Новичок</span></div>
      <div id="xpBar"><div id="xpFill"></div></div>
    </div>
    <div class="chip" id="eraChip" style="display:none;cursor:pointer;pointer-events:auto;background:linear-gradient(180deg,#fff8e1,#ffe9b0);border:2px solid rgba(200,140,20,.55);padding:3px 7px;gap:3px" title="Эпоха фермы">
      <span style="font-size:13px">⭐</span><span id="eraNum" style="font-size:11px;font-weight:900;color:#8a520e">1</span>
    </div>
    <div id="spacer"></div>
    <button class="chip" id="quickHarv" style="cursor:pointer;pointer-events:auto;background:linear-gradient(180deg,#ffffff,#ebf7e2);border:2px solid rgba(80,140,50,.4);padding:4px 9px;gap:4px" title="Собрать всё">
      <span style="font-size:14px">🌾</span><span style="font-size:11px;font-weight:900;color:#2f5418">Сбор</span>
    </button>
    <button class="chip" id="quickFeed" style="cursor:pointer;pointer-events:auto;background:linear-gradient(180deg,#ffffff,#fff5e2);border:2px solid rgba(220,150,40,.4);padding:4px 9px;gap:4px" title="Покормить всех зверей">
      <span style="font-size:14px">🥖</span><span style="font-size:11px;font-weight:900;color:#8a520e">Корм</span>
    </button>
    <button class="icoBtn nightBtn" id="nightBtn" data-short="1" aria-label="Ночь">🌙</button>
    <button class="icoBtn" id="sndBtn" aria-label="Звук">🔊</button>
  </div>

  <div id="nav">
    <button data-t="farm" class="on"><canvas width="52" height="52" data-ico="farm"></canvas>Ферма</button>
    <button data-t="orders"><canvas width="52" height="52" data-ico="truck"></canvas>Заказы<span class="bdg" id="ordBdg">0</span></button>
    <button data-t="shop"><canvas width="52" height="52" data-ico="shop"></canvas>Магазин</button>
    <button data-t="barn"><canvas width="52" height="52" data-ico="barn"></canvas>Амбар</button>
    <button data-t="more"><canvas width="52" height="52" data-ico="star"></canvas>Ещё</button>
  </div>

  <div class="panel" id="panel">
    <div class="pHead"><h3 id="pTtl">Магазин</h3><button class="x" id="pClose">✕</button></div>
    <div class="pBody" id="pBody"></div>
  </div>

  <div id="toast"></div>

  <div id="modal"><div id="mBox">
    <canvas id="mIco" width="144" height="144"></canvas>
    <div id="mTtl"></div><div id="mTxt"></div><div id="mBtns"></div>
  </div></div>

  <div id="intro">
    <h1>Солнечная Ферма</h1>
    <div class="sub">Сажай урожай, корми зверей, готовь вкусности,<br> выполняй <b>заказы соседей</b> и лови <b>подарки</b>!</div>
    <button class="btn gold" id="iGo">НАЧАТЬ ФЕРМУ</button>
    <div class="note">Урожай растёт, даже когда ты вышел 🌱</div>
  </div>
</div>

function loadSfxBuf(key,cb){
  if(A.buf[key]){if(cb)cb(A.buf[key]);return;}
  var b64=SFX_B64[key];
  if(!b64||!actx()){if(cb)cb(null);return;}
  try{
    var bin=atob(b64.split(',')[1]);
    var ab=new ArrayBuffer(bin.length),u8=new Uint8Array(ab);
    for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    A.ctx.decodeAudioData(ab,function(buf){A.buf[key]=buf;if(cb)cb(buf);},function(){if(cb)cb(null);});
  }catch(e){if(cb)cb(null);}
}
function loadAllSfx(){
  if(!A.ctx)return;
  for(var k in SFX_B64)loadSfxBuf(k);
}
function playSfxBuf(n,v){
  var buf=A.buf[n];if(!buf)return false;
  try{
    var c=A.ctx,src=c.createBufferSource();src.buffer=buf;
    var g=c.createGain();g.gain.value=(v===undefined?1:v);
    src.connect(g);g.connect(A.master);src.start();
    return true;
  }catch(e){return false;}
}
function actx(){
  if(!A.ctx){
    try{
      A.ctx=new (window.AudioContext||window.webkitAudioContext)();
      A.master=A.ctx.createGain();
      A.master.gain.value=P.snd===false?0:0.7;
      A.master.connect(A.ctx.destination);
    }catch(e){A.on=false;}
  }
  if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();
  return A.ctx;
}
function audioWake(){actx();loadAllSfx();}
function tone(f,dur,type,vol,slide){
  if(!A.on||P.snd===false)return;
  var c=actx();if(!c)return;
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f,c.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),c.currentTime+dur);
  g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(vol||0.16,c.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
  o.connect(g);g.connect(A.master);
  o.start();o.stop(c.currentTime+dur+0.02);
}
function noise(dur,vol,freq){
  if(!A.on||P.snd===false)return;
  var c=actx();if(!c)return;
  var n=Math.floor(c.sampleRate*dur);
  var buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var src=c.createBufferSource();src.buffer=buf;
  var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1400;
  var g=c.createGain();g.gain.value=vol||0.12;
  src.connect(f);f.connect(g);g.connect(A.master);
  src.start();
}
function sfx(k){
  switch(k){
    case 'tap':    tone(560,0.07,'sine',0.10);break;
    case 'plant':  noise(0.18,0.10,900);tone(300,0.12,'sine',0.08,420);break;
    case 'harvest':tone(680,0.09,'triangle',0.13,900);
                   setTimeout(function(){tone(940,0.11,'triangle',0.10);},60);break;
    case 'coin':   tone(1050,0.07,'square',0.09,1400);
                   setTimeout(function(){tone(1480,0.10,'square',0.07);},55);break;
    case 'build':  noise(0.24,0.14,700);tone(180,0.2,'sawtooth',0.09,90);break;
    case 'feed':   tone(420,0.1,'sine',0.10,560);break;
    case 'cook':   tone(320,0.14,'triangle',0.10,470);break;
    case 'done':   [660,880,1180].forEach(function(f,i){
                     setTimeout(function(){tone(f,0.13,'triangle',0.11);},i*72);});break;
    case 'level':  [523,659,784,1047].forEach(function(f,i){
                     setTimeout(function(){tone(f,0.18,'triangle',0.13);},i*95);});break;
    case 'order':  tone(760,0.1,'sine',0.11);
                   setTimeout(function(){tone(1010,0.14,'sine',0.10);},80);break;
    case 'err':    tone(210,0.14,'sawtooth',0.09,150);break;
    case 'pop':    tone(880,0.06,'sine',0.09,1200);break;
    case 'quack':  tone(340,0.09,'sawtooth',0.10,190);
                   setTimeout(function(){tone(300,0.11,'sawtooth',0.08,170);},70);break;
    case 'dog':    if(playSfxBuf('dog',0.9))break;noise(0.3,0.10,900);tone(220,0.18,'sawtooth',0.06,140);break;
    case 'cat':    if(playSfxBuf('cat',1))break;tone(180,0.5,'sine',0.07,220);tone(240,0.5,'sine',0.05,280);break;
  }
}
function toggleSnd(){
  P.snd=(P.snd===false);
  if(A.master)A.master.gain.value=P.snd?0.7:0;
  var b=$('sndBtn');if(b)b.textContent=P.snd?'🔊':'🔇';
  save();toast(P.snd?'🔊 Звук включён':'🔇 Звук выключен');
}

/* ============================================================
   3. ВИБРАЦИЯ — можно отключить (требование модерации ВК)
   ============================================================ */
var VIB_KEY='farm_vib_off';
function vibOn(){
  try{return localStorage.getItem(VIB_KEY)!=='1';}catch(e){return true;}
}
function setVib(on){
  try{
    if(on)localStorage.removeItem(VIB_KEY);
    else localStorage.setItem(VIB_KEY,'1');
  }catch(e){}
}
function toggleVib(){
  var on=!vibOn();
  setVib(on);paintVibBtns();
  if(on&&navigator.vibrate)navigator.vibrate(12);
  toast(on?'Вибрация включена':'Вибрация выключена');
  return on;
}
/* ============================================================
   3b. НОЧЬ — можно выключить (просьба игроков: тяжело глазам)
   ============================================================ */
function nightOn(){return P.nightOn==null?true:!!P.nightOn;}
function setNight(on){
  P.nightOn=on?1:0;
  /* выключили — сразу возвращаем день */
  var n=G.night;
  if(n){
    n.on=false;
    n.t=on?n.t:(n.cycle||150);
  }
  paintNightBtns();
  save();
  if(typeof paintAll==='function')paintAll();
}
function toggleNight(){
  var on=!nightOn();
  setNight(on);
  toast(on?'🌙 Ночь включена':'☀️ Ночь выключена — теперь всегда светло');
  if(curTab&&typeof renderPanel==='function')renderPanel();
  return on;
}
function paintNightBtns(){
  var on=nightOn(),list=document.querySelectorAll('.nightBtn');
  for(var i=0;i<list.length;i++){
    var short=list[i].getAttribute('data-short')==='1';
    list[i].textContent=short?(on?'🌙':'☀️'):(on?'Ночь: вкл':'Ночь: выкл');
    list[i].title=on?'Ночь включается сама':'Ночь выключена — всегда светло';
    list[i].setAttribute('aria-pressed',on?'true':'false');
    if(list[i].classList)list[i].classList.toggle('off',!on);
  }
}
function paintVibBtns(){
  var on=vibOn(),list=document.querySelectorAll('.vibBtn');
  for(var i=0;i<list.length;i++){
    var ico=list[i].getAttribute('data-ico')==='1';
    list[i].textContent=ico?(on?'\u2707':'\u2205'):(on?'Вибрация: вкл':'Вибрация: выкл');
    list[i].title=on?'Вибрация включена':'Вибрация выключена';
    list[i].setAttribute('aria-pressed',on?'true':'false');
  }
}
function haptic(s){
  if(!vibOn())return;
  if(VK.ready)bridge.send('VKWebAppTapticImpactOccurred',{style:s||'light'}).catch(nop);
  else if(navigator.vibrate)navigator.vibrate(s==='heavy'?22:s==='medium'?12:6);
}

   4. VK BRIDGE
   ============================================================ */
var bridge=window.vkBridge||window.vkBridgeInstance||null;
var VK={ready:false,name:'Фермер'};
function vkInit(){
  if(!bridge||!bridge.send){return;}
  try{
    bridge.send('VKWebAppInit').then(function(){
      VK.ready=true;
      bridge.send('VKWebAppGetUserInfo').then(function(u){
        if(u&&u.first_name){VK.name=u.first_name;paintTop();}
      }).catch(nop);
      cloudLoad();
    }).catch(nop);
  }catch(e){}

function applySave(o){
  if(!o||typeof o!=='object')return;
  ['coins','lvl','xp','plotsOpen','plotLvl','wheelDate','petPats','barnCap','totalHarvest','totalOrders',
   'totalCoins','adFree','dailyDate','dailyDone','tutor','era','nightOn',
   'qDate','fairUntil','fairNext','fairDone','helperUntil','duckPats','helpDate',
   'streak','streakDate'].forEach(function(k){
    if(typeof o[k]==='number')P[k]=o[k];
  });
  if(!P.plotLvl)P.plotLvl=1;
  if(!P.era)P.era=0;
  if(P.nightOn==null)P.nightOn=1;
  if(typeof o.snd==='boolean')P.snd=o.snd;
  if(Array.isArray(o.plots))P.plots=o.plots;
  if(Array.isArray(o.animals))P.animals=o.animals;
  if(Array.isArray(o.machines))P.machines=o.machines;
  if(Array.isArray(o.orders))P.orders=o.orders;
  if(o.barn&&typeof o.barn==='object')P.barn=o.barn;
  if(o.seen&&typeof o.seen==='object')P.seen=o.seen;
  if(o.claimedAchs&&typeof o.claimedAchs==='object')P.claimedAchs=o.claimedAchs;
  if(o.penLvl&&typeof o.penLvl==='object')P.penLvl=o.penLvl;
  if(o.q&&typeof o.q==='object')P.q=o.q;
  if(o.qClaim&&typeof o.qClaim==='object')P.qClaim=o.qClaim;
  if(Array.isArray(o.fairOrders))P.fairOrders=o.fairOrders;
  if(!P.penLvl||typeof P.penLvl!=='object')P.penLvl={};
  /* цеха: подстраховка старых сохранений — уровни и базовое время рецепта */
  P.machines.forEach(function(m){
    if(!m.lvl)m.lvl=1;
    if(!Array.isArray(m.queue))m.queue=[];
    m.queue.forEach(function(q){
      if(q.base==null)q.base=q.t||1;
      if(!q.mk)q.mk=m.kind;
    });
  });
}

var RANKS=['Новичок','Огородник','Фермер','Хозяин','Мастер полей',
           'Агроном','Ферма-легенда','Король урожая'];
function xpNeed(l){return Math.round(60*Math.pow(1.42,l-1));}
function rankName(){return RANKS[Math.min(RANKS.length-1,Math.floor((P.lvl-1)/3))];}

/* ============================================================
   6b. ЭПОХИ ФЕРМЫ (престиж) — игра не заканчивается никогда
   Достигнув 15 уровня можно начать новую эпоху: ферма
   обнуляется, но навсегда остаются бонусы и открываются
   новые цеха. Чем больше эпох — тем быстрее следующий круг.
   ============================================================ */
var ERAS=['Обычная ферма','Крепкое хозяйство','Цветущая долина','Агро-империя','Легенда полей'];
function eraNum(){return P.era|0;}
function eraName(e){
  if(e==null)e=eraNum();
  if(e<ERAS.length)return ERAS[e];
  return 'Легенда полей '+(e-ERAS.length+2);
}
function eraCoinMult(){return 1+0.30*eraNum();}   /* +30% к деньгам за эпоху */
function eraXpMult(){return 1+0.20*eraNum();}     /* +20% к опыту за эпоху */
function eraSpeed(){return 1+0.05*eraNum();}      /* +5% к скорости всего */
function plotCap(){return 16+4*eraNum();}         /* с каждой эпохой +4 грядки */
function plotMaxLvl(){return 3+eraNum();}         /* потолок прокачки грядок */
function prestigeNeed(){return 15;}               /* уровень для новой эпохи */
function prestigeReady(){return P.lvl>=prestigeNeed();}
function addXp(n){
  P.xp+=n*eraXpMult();
  var up=false;
  while(P.xp>=xpNeed(P.lvl)){
    P.xp-=xpNeed(P.lvl);P.lvl++;up=true;
    P.coins+=P.lvl*18;
  }
  if(up){
    sfx('level');haptic('heavy');
    burstXY(W/2,H*0.42,'#ffd964',26);
    modal('level','Уровень '+P.lvl+'!',
      'Ты теперь <b>'+rankName()+'</b>.<br>Награда: <b>'+fmt(P.lvl*18)+'</b> монет.'+
      (unlockHint()?'<br><br>'+unlockHint():''),
      [{t:'Отлично!',f:closeModal}]);
  }
  paintTop();
}
/* что открылось на новом уровне — показываем в модалке */
function unlockHint(){
  var out=[];
  CROPS.forEach(function(c){if(c.lvl===P.lvl)out.push('🌱 семена: <b>'+c.n+'</b>');});
  ANIMALS.forEach(function(a){if(a.lvl===P.lvl)out.push('🐔 зверь: <b>'+a.n+'</b>');});
  MACHINES.forEach(function(m){
    if(m.lvl===P.lvl&&(m.era|0)<=eraNum())out.push('🏭 цех: <b>'+m.n+'</b>');
  });
  if(P.lvl===prestigeNeed())out.push('⭐ доступна новая <b>Эпоха фермы</b> (в меню «Ещё»)!');
  if(!out.length)return '';
  return 'Открылось:<br>'+out.join('<br>');
}

var PWID={pause:null,resume:null,quit:null,isPlaying:null,paused:false};
function setPauseHooks(o){
  PWID.pause=o.pause||null;PWID.resume=o.resume||null;
  PWID.quit=o.quit||null;PWID.isPlaying=o.isPlaying||null;
}
function pwShow(on){var b=$('pw');if(b)b.classList.toggle('on',!!on);}
function pwOpen(){
  if(PWID.paused)return;
  PWID.paused=true;
  try{if(PWID.pause)PWID.pause();}catch(e){}
  paintVibBtns();
  var s=$('pwScr');if(s)s.classList.add('on');
  pwShow(false);
}
function pwClose(){
  if(!PWID.paused)return;
  PWID.paused=false;
  var s=$('pwScr');if(s)s.classList.remove('on');
  try{if(PWID.resume)PWID.resume();}catch(e){}
  pwShow(true);
}
function pwQuit(){
  PWID.paused=false;
  var s=$('pwScr');if(s)s.classList.remove('on');
  pwShow(false);pwGuard();
  try{if(PWID.quit)PWID.quit();}catch(e){}
}
/* Щит от «хвоста» тапа: после закрытия листа палец отпускается уже
   над кнопкой меню, и она срабатывает сама собой. */
function pwGuard(){
  var d=$('pwGuard');
  if(!d){
    d=document.createElement('div');
    d.id='pwGuard';
    d.style.cssText='position:fixed;inset:0;z-index:2147483002;background:transparent';
    ['pointerdown','pointerup','click','touchstart','touchend'].forEach(function(ev){
      d.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();},{passive:false});
    });
  }
  if(!d.parentNode)document.body.appendChild(d);
  clearTimeout(pwGuard._t);
  pwGuard._t=setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},500);
}
(function(){
  function tap(el,fn){
    if(!el)return;
    el.addEventListener('pointerdown',function(e){
      e.preventDefault();e.stopPropagation();fn();
    },{passive:false});
    el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();});
  }
  function init(){
    tap($('pw'),pwOpen);tap($('pwGo'),pwClose);tap($('pwOut'),pwQuit);
    tap($('pwVib'),function(){toggleVib();});
    tap($('pwNight'),function(){toggleNight();});
    paintVibBtns();paintNightBtns();
    setInterval(function(){
      if(PWID.paused)return;
      var play=false;
      try{play=PWID.isPlaying?!!PWID.isPlaying():false;}catch(e){}
      pwShow(play);
    },400);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();

/* множитель скорости роста (+15% за уровень, +5% за эпоху) */
function plotSpeedMult(){
  return Math.min(3,1+0.15*((P.plotLvl||1)-1))*eraSpeed();
}
/* урожай = уровень грядок: ур.3 → ×3, ур.6 → ×6 и так далее */
function plotYieldMult(){
  return Math.max(1,P.plotLvl||1);
}
function barnUpCost(){
  return Math.round(120*Math.pow(1.5,Math.max(0,(P.barnCap-60)/30)));
}

/* ============================================================
   9b. БЕСКОНЕЧНАЯ ПРОКАЧКА
   Цеха, загоны и цены зверей растут без потолка — тратить
   монеты всегда есть на что, даже когда всё «скуплено».
   ============================================================ */
/* ---------- цеха ---------- */
function machLvl(m){return m.lvl||1;}
function machLvlKind(kind){
  for(var i=0;i<P.machines.length;i++)if(P.machines[i].kind===kind)return P.machines[i].lvl||1;
  return 1;
}
function machTimeMul(lvl){return 1/(1+0.12*Math.max(0,(lvl||1)-1));}   /* <1 — быстрее */
function machSlots(d,lvl){return Math.min(6,(d.slots||2)+Math.floor(Math.max(0,(lvl||1)-1)/3));}
function machUpCost(m){
  var d=MMAP[m.kind];if(!d)return 0;
  return Math.round(d.cost*0.9*Math.pow(1.62,(m.lvl||1)-1));
}
function machUpNeed(m){
  var d=MMAP[m.kind];if(!d)return 99;
  return Math.min(45,d.lvl+Math.floor(((m.lvl||1)-1)*1.6));
}
function upgradeMachine(mi){
  var m=P.machines[mi];
  if(!m)return;
  var d=MMAP[m.kind];
  if(!d)return;
  var lvl=m.lvl||1,cost=machUpCost(m),need=machUpNeed(m);
  if(P.lvl<need){sfx('err');toast('Нужен '+need+' уровень');return;}
  if(P.coins<cost){sfx('err');toast('Не хватает '+fmt(cost-P.coins)+' монет');return;}
  P.coins-=cost;
  m.lvl=lvl+1;
  sfx('build');haptic('medium');
  confettiBurst();
  toast('⚙️ '+d.n+' → ур. '+m.lvl+'!');
  ach('machUp5','⚙️ Цех прокачан до 5 уровня!');
  save();paintAll();
}
/* ---------- загоны ---------- */
function penLvl(kind){return (P.penLvl&&P.penLvl[kind])|0;}
function penTimeMul(kind){return 1/(1+0.08*penLvl(kind))/eraSpeed();}
function penYield(kind){return 1+Math.floor(penLvl(kind)/4);}   /* каждые 4 уровня +1 продукт */
function penUpCost(kind){
  var d=AMAP[kind];if(!d)return 0;
  return Math.round(d.cost*0.8*Math.pow(1.55,penLvl(kind)));
}
function penUpNeed(kind){
  var d=AMAP[kind];if(!d)return 99;
  return Math.min(45,d.lvl+Math.floor(penLvl(kind)*1.5));
}
function upgradePen(kind){
  var d=AMAP[kind];
  if(!d)return;
  var lvl=penLvl(kind),cost=penUpCost(kind),need=penUpNeed(kind);
  if(P.lvl<need){sfx('err');toast('Нужен '+need+' уровень');return;}
  if(P.coins<cost){sfx('err');toast('Не хватает '+fmt(cost-P.coins)+' монет');return;}
  P.coins-=cost;
  P.penLvl[kind]=lvl+1;
  sfx('build');haptic('medium');
  confettiBurst();
  toast('🐄 Загон «'+d.n+'» → ур. '+P.penLvl[kind]+'!');
  ach('penUp5','🐄 Загон прокачан до 5 уровня!');
  save();paintAll();layout();
}
/* цена зверя растёт с каждым купленным — стадо дорожает, но и приносит больше */
function animalCost(d){
  var have=0;
  for(var i=0;i<P.animals.length;i++)if(P.animals[i].kind===d.id)have++;
  return Math.round(d.cost*Math.pow(1.18,have));
}
/* ---------- новая эпоха (престиж) ---------- */

/* ============================================================
   10. АМБАР
   ============================================================ */
function barnCount(){
  var s=0;
  for(var k in P.barn)s+=P.barn[k]|0;
  return s;
}
function barnFree(){return Math.max(0,P.barnCap-barnCount());}
function barnAdd(id,n){
  n=n||1;
  var free=barnFree();
  var put=Math.min(n,free);
  if(put>0)P.barn[id]=(P.barn[id]|0)+put;
  return put;                       /* сколько реально влезло */
}
function barnHas(id,n){return (P.barn[id]|0)>=(n||1);}
function barnTake(id,n){
  n=n||1;
  if(!barnHas(id,n))return false;
  P.barn[id]-=n;
  if(P.barn[id]<=0)delete P.barn[id];
  return true;
}
function canPay(need){
  for(var k in need)if(!barnHas(k,need[k]))return false;
  return true;
}
function payNeed(need){
  for(var k in need)barnTake(k,need[k]);
}

/* ============================================================
   11. ЗАКАЗЫ
   ============================================================ */
/* что игрок в принципе способен добыть на своём уровне */
function availableItems(){
  var out=[];
  CROPS.forEach(function(c){if(c.lvl<=P.lvl)out.push(c.id);});
  ANIMALS.forEach(function(a){
    if(a.lvl<=P.lvl&&P.animals.some(function(x){return x.kind===a.id;}))out.push(a.give);
  });
  P.machines.forEach(function(m){
    var d=MMAP[m.kind];
    if(d)d.rec.forEach(function(r){
      /* рецепт доступен, только если сырьё реально добывается */
      var ok=true;
      for(var k in r.need){
        if(CMAP[k]&&CMAP[k].lvl>P.lvl)ok=false;
        if(GMAP[k]){
          var src=ANIMALS.filter(function(a){return a.give===k;})[0];
          if(src&&!P.animals.some(function(x){return x.kind===src.id;}))ok=false;
        }
      }
      if(ok)out.push(r.out);
    });
  });
  return out;
}
function makeOrder(){
  var pool=availableItems();
  if(!pool.length)return null;
  var cnt=P.lvl<3?1:(P.lvl<6?ri(1,2):ri(1,3));
  var items={},total=0,xp=0;
  for(var i=0;i<cnt;i++){
    var id=pick(pool);
    var q=ri(1,Math.max(1,Math.min(4,Math.ceil(P.lvl/3))));
    items[id]=(items[id]|0)+q;
  }
  for(var k in items){
    total+=itemPrice(k)*items[k];
    xp+=Math.max(1,Math.round(itemPrice(k)*items[k]/14));
  }
  /* наценка: заказы выгоднее прямой продажи — иначе их не будут брать */
  var pay=Math.round(total*rf(1.32,1.68)*eraCoinMult());
  return {
    id:'o'+now()+'_'+ri(100,999),
    who:ri(0,BUYERS.length-1),
    items:items,coins:pay,xp:Math.max(2,xp),
    at:now()
  };
}
function refillOrders(){
  var want=P.lvl<3?2:(P.lvl<7?3:4);
  var changed=false;
  while(P.orders.length<want){
    var o=makeOrder();
    if(!o)break;
    P.orders.push(o);changed=true;
  }
  if(changed)paintBadges();
}
function orderReady(o){
  for(var k in o.items)if(!barnHas(k,o.items[k]))return false;
  return true;
}
function readyOrders(){
  var n=0;
  P.orders.forEach(function(o){if(orderReady(o))n++;});
  return n;
}
/* ============================================================
   12. ВЕКТОРНАЯ ГРАФИКА
   Всё рисуется кодом: эмодзи в canvas на iOS не отображаются
   (за это ВК уже заворачивал другие игры), а картинки утяжеляют
   бандл. Каждая функция работает в системе с центром (0,0)
   и «радиусом» r — вызывающий уже перенёс контекст.
   ============================================================ */
var ART=(function(){
  var c;
  function ink(w,col){
    c.lineWidth=w;c.strokeStyle=col||'rgba(48,32,18,.82)';

  function rg(x,y,r0,r1,a,b){

      c.lineWidth=er*0.3;c.strokeStyle='rgba(48,32,18,.55)';
      c.beginPath();c.ellipse(ex,dy,er,er*1.1,0,0,7);c.stroke();
      c.fillStyle='#2b1d14';
      c.beginPath();c.arc(ex+(look||0)*er*.2,dy+er*.08,er*.58,0,7);c.fill();
      c.fillStyle='#fff';
      c.beginPath();c.arc(ex-er*.24,dy-er*.34,er*.26,0,7);c.fill();
      c.globalAlpha=.75;
      c.beginPath();c.arc(ex+er*.26,dy+er*.28,er*.13,0,7);c.fill();
      c.globalAlpha=1;
    }
  }
  function smile(y,w,lw){
    c.strokeStyle='#2b1d14';c.lineWidth=lw;c.lineCap='round';
    c.beginPath();c.moveTo(-w,y);c.quadraticCurveTo(0,y+w*1.1,w,y);c.stroke();

      }
      c.beginPath();c.ellipse(bx,by-r*.78,r*.09,r*.15,0,0,7);c.fill();

  corn:function(r){

    c.beginPath();c.arc(0,r*1.1,r*1.15,Math.PI,0);c.fill();
    c.fillStyle='#ffd964';
    c.beginPath();c.arc(-r*.55,-r*.55,r*.3,0,7);c.fill();
    c.fillStyle='#e0644a';
    c.beginPath();
    c.moveTo(-r*.05,-r*.15);c.lineTo(r*.42,-r*.6);c.lineTo(r*.88,-r*.15);
    c.closePath();c.fill();
    c.fillStyle='#f0d0a8';
    c.fillRect(r*.1,-r*.16,r*.62,r*.5);
    ink(r*.08,'rgba(80,50,20,.5)');
    /* грядки */
    c.strokeStyle='#5aa030';c.lineWidth=r*.1;c.lineCap='round';
    for(var i=0;i<3;i++){
      c.beginPath();
      c.moveTo(-r*.9+i*r*.26,r*.55);
      c.lineTo(-r*.72+i*r*.26,r*.3);
      c.stroke();
    }
  },
  /* покупатели — простые, но узнаваемые лица */
  buyer1:function(r){ face(r,'#ffd9b8','#e05b74','f'); },
  buyer2:function(r){ face(r,'#f0c89a','#4fa3d8','m'); },
  buyer3:function(r){ face(r,'#ffe0c4','#f5b731','m'); },
  buyer4:function(r){ face(r,'#ffd4c0','#9c7bd8','f'); },
  buyer5:function(r){ face(r,'#f5cba8','#68c43a','m'); },
  level:function(r){
    A.star(r*1.05);
    c.fillStyle='#fff';
    c.font='900 '+Math.round(r*.62)+'px -apple-system,Segoe UI,Roboto,sans-serif';
    c.textAlign='center';c.textBaseline='middle';
    c.strokeStyle='rgba(150,90,5,.85)';c.lineWidth=r*.12;
    c.strokeText('!',0,r*.04);c.fillText('!',0,r*.04);
  },
  gift:function(r){
    c.fillStyle=lg(0,-r*.3,0,r*.8,'#ff8fa3','#d8304f');
    c.fillRect(-r*.72,-r*.24,r*1.44,r*.94);
    ink(r*.1,'rgba(120,15,35,.6)');
    c.fillStyle=lg(0,-r*.5,0,-r*.2,'#ffb6c8','#e0446a');
    c.fillRect(-r*.84,-r*.5,r*1.68,r*.3);
    ink(r*.09,'rgba(120,15,35,.55)');
    c.fillStyle='#ffd964';
    c.fillRect(-r*.13,-r*.5,r*.26,r*1.2);
    /* бант */
    c.fillStyle='#ffd964';
    c.beginPath();c.ellipse(-r*.24,-r*.62,r*.22,r*.16,-.5,0,7);c.fill();
    c.beginPath();c.ellipse(r*.24,-r*.62,r*.22,r*.16,.5,0,7);c.fill();
    ink(r*.07,'rgba(150,95,5,.5)');
  }
  };

  /* общее лицо покупателя */
  function face(r,skin,cloth,g){
    /* плечи */
    c.fillStyle=cloth;
    c.beginPath();
    c.moveTo(-r*.85,r*1.0);
    c.quadraticCurveTo(-r*.8,r*.3,0,r*.28);
    c.quadraticCurveTo(r*.8,r*.3,r*.85,r*1.0);
    c.closePath();c.fill();ink(r*.1,'rgba(40,40,60,.45)');
    /* голова */
    c.fillStyle=rg(-r*.2,-r*.35,r*.04,r*.9,'#fff2e0',skin);
    c.beginPath();c.arc(0,-r*.22,r*.56,0,7);c.fill();
    ink(r*.1,'rgba(120,80,50,.55)');
    /* волосы */
    c.fillStyle=g==='f'?'#8a5a3a':'#4a3a2a';
    c.beginPath();c.arc(0,-r*.3,r*.58,Math.PI*1.05,Math.PI*1.95);c.fill();
    if(g==='f'){
      c.beginPath();c.ellipse(-r*.52,-r*.1,r*.16,r*.3,0,0,7);c.fill();
      c.beginPath();c.ellipse(r*.52,-r*.1,r*.16,r*.3,0,0,7);c.fill();
    }
    c.save();c.translate(0,-r*.2);
    eyes(r*.2,0,r*.11);
    c.restore();
    blush(r*.34,-r*.02,r*.13);
    smile(r*.14,r*.16,r*.07);
  }

  return {
    draw:function(g,kind,r,t){
      var f=A[kind];
      if(!f)return false;
      c=g;g.save();f(r,t||0);g.restore();
      return true;
    },
    has:function(k){return !!A[k];}
  };
})();

/* нарисовать иконку в отдельный canvas-элемент */
function icon(el,kind,scale){
  if(!el)return;
  var w=el.width,h=el.height;
  var g=el.getContext('2d');
  g.clearRect(0,0,w,h);
  g.save();g.translate(w/2,h/2);
  ART.draw(g,kind,Math.min(w,h)*(scale||0.42),0);
  g.restore();
}
/* html-строка с canvas-иконкой (для списков) */
var icoSeq=0;
function icoTag(kind,size){
  var id='ic'+(++icoSeq);
  setTimeout(function(){
    var el=$(id);
    if(el)icon(el,kind,0.44);
  },0);
  var s=size||24;
  return '<canvas id="'+id+'" width="'+(s*2)+'" height="'+(s*2)+
         '" style="width:'+s+'px;height:'+s+'px"></canvas>';
}

function initPets(){

      G.pet.x=rf(50,Math.max(60,W*0.3));

/* ---------- грядки ---------- */
function plotState(p){
  if(!p.crop)return 'empty';
  var d=CMAP[p.crop];
  if(!d)return 'empty';
  var el=((now()-p.at)/1000)*plotSpeedMult();
  return el>=d.t?'ready':'grow';
}
function plotProgress(p){
  if(!p.crop)return 0;
  var d=CMAP[p.crop];
  return clamp((((now()-p.at)/1000)*plotSpeedMult())/d.t,0,1);
}
function plantCrop(i,cropId){
  var p=P.plots[i];
  if(!p||p.crop)return false;
  var d=CMAP[cropId];
  if(!d||d.lvl>P.lvl)return false;
  if(P.coins<d.seed){sfx('err');toast('Не хватает монет на семена');return false;}
  P.coins-=d.seed;
  p.crop=cropId;p.at=now();
  sfx('plant');haptic('light');
  popText(plotCX(i),plotCY(i)-14,'-'+d.seed,'#c0392b');
  paintTop();save();
  return true;
}

/* Амбар забит — предлагаем бесплатное место за ролик.
   Это самый честный момент для рекламы: игрок сам упёрся в лимит. */
function askBarnAd(){
  modal('barn','Амбар переполнен',
    'Урожай некуда складывать.<br>Освободи место — или расширь склад.',
    [{t:'📺 +10 мест бесплатно',c:'ad',f:function(){
       var btns=document.querySelectorAll('#mBtns button');
       for(var i=0;i<btns.length;i++)btns[i].disabled=true;
       watchAd(function(ok){
         if(!ok){for(var i=0;i<btns.length;i++)btns[i].disabled=false;return;}
         P.barnCap+=10;
         sfx('build');haptic('medium');save();paintAll();
         toast('🏚 Амбар: +10 мест');
         closeModal();
       });
     }},
     {t:'Продать лишнее',f:function(){closeModal();openPanel('barn');}},
     {t:'Закрыть',c:'ghost',f:closeModal}]);
}
function harvestPlot(i,silent){
  var p=P.plots[i];
  if(!p||plotState(p)!=='ready')return false;
  var d=CMAP[p.crop];
  var qty=plotYieldMult();
  var got=barnAdd(d.id,qty);
  if(!got){
    if(!silent){sfx('err');askBarnAd();}
    return false;
  }
  p.crop=null;p.at=0;
  P.totalHarvest+=got;
  qAdd('h',got);
  ach('firstHarvest','Первый урожай! 🌾');
  if(P.totalHarvest>=10)ach('tenHarvest','10 урожаев! 🌾🎉');
  addXp(d.xp * got);
  if(!silent){
    sfx('harvest');haptic('light');
    burstXY(plotCX(i),plotCY(i),qty>=3?'#ffd964':(qty>=2?'#ffb830':'#8fe36a'),10+qty*2);
    popText(plotCX(i),plotCY(i)-16,'+'+got+' '+d.n,qty>=3?'#b8860b':(qty>=2?'#d97706':'#2e7d32'));
    comboHit(plotCX(i),plotCY(i));
  }
  return true;
}
/* есть ли вообще что собирать: грядки / звери / цеха */
function anyReady(){
  var i,j;
  for(i=0;i<P.plots.length;i++)if(plotState(P.plots[i])==='ready')return true;
  for(i=0;i<P.animals.length;i++)if(animalState(P.animals[i])==='ready')return true;
  for(i=0;i<P.machines.length;i++)for(j=0;j<P.machines[i].queue.length;j++)if(cookReady(P.machines[i].queue[j]))return true;
  return false;
}
function harvestAll(){
  var n=0,full=false;
  for(var i=0;i<P.plots.length;i++){
    if(plotState(P.plots[i])==='ready'){
      if(barnFree()<=0){full=true;break;}
      if(harvestPlot(i,true))n++;
    }
  }
  if(n){
    sfx('harvest');haptic('medium');
    toast('🌾 Собрано: '+n);
    save();paintAll();
  }else if(full)toast('🏚 Амбар переполнен!');
  else toast('Пока нечего собирать');
  return n;
}
/* засеять все свободные грядки той же культурой */
function plantAll(cropId){
  var d=CMAP[cropId];
  if(!d)return 0;
  var n=0;
  for(var i=0;i<P.plots.length;i++){
    if(P.plots[i].crop)continue;
    if(P.coins<d.seed)break;
    P.coins-=d.seed;
    P.plots[i].crop=cropId;P.plots[i].at=now();
    n++;
  }
  if(n){sfx('plant');haptic('light');toast('🌱 Засеяно грядок: '+n);save();paintAll();}
  else toast(P.coins<d.seed?'Не хватает монет':'Нет свободных грядок');
  return n;
}
function buyPlot(){
  var cap=plotCap();
  if(P.plots.length>=cap){
    toast('Максимум грядок для этой эпохи ('+cap+'). Начни новую эпоху!');
    return;
  }
  var cost=plotCost(),need=plotLvlNeed();
  if(P.lvl<need){sfx('err');toast('Нужен '+need+' уровень');return;}
  if(P.coins<cost){sfx('err');toast('Не хватает '+fmt(cost-P.coins)+' монет');return;}
  P.coins-=cost;P.plotsOpen++;
  P.plots.push({crop:null,at:0});
  sfx('build');haptic('medium');
  toast('🌱 Новая грядка ('+P.plots.length+'/'+cap+')!');

}
function upgradePlots(){
  var curLvl=P.plotLvl||1;
  if(curLvl>=plotMaxLvl()){toast('Максимум для этой эпохи. Начни новую эпоху!');return;}

  sfx('build');haptic('medium');

/* ---------- животные ---------- */
function animalState(a){
  var d=AMAP[a.kind];
  if(!d)return 'idle';
  if(!a.fedAt)return 'hungry';
  var el=(now()-a.fedAt)/1000;
  return el>=d.t*penTimeMul(a.kind)?'ready':'grow';
}
function animalProgress(a){
  var d=AMAP[a.kind];
  if(!a.fedAt)return 0;
  return clamp((now()-a.fedAt)/1000/(d.t*penTimeMul(a.kind)),0,1);
}
function feedAnimal(idx){

  if(!a)return false;
  if(animalState(a)!=='hungry'){toast('Уже кормили');return false;}
  if(!barnHas('wheat',1)){sfx('err');toast('Нужна пшеница для корма');return false;}

function feedAll(){

/* ---------- производства ---------- */
function buyMachine(kind){
  var d=MMAP[kind];
  if(!d)return;
  if((d.era|0)>eraNum()){sfx('err');toast('Откроется в эпоху «'+eraName(d.era)+'»');return;}
  if(d.lvl>P.lvl){sfx('err');toast('Нужен '+d.lvl+' уровень');return;}
  if(P.machines.some(function(m){return m.kind===kind;})){
    toast('Такой цех уже есть');return;
  }
  if(P.coins<d.cost){sfx('err');toast('Не хватает '+fmt(d.cost-P.coins)+' монет');return;}
  P.coins-=d.cost;
  P.machines.push({kind:kind,lvl:1,queue:[]});
  confettiBurst();
  ach('machine'+kind,'🏭 Построено: '+d.n+'!');
  sfx('build');haptic('heavy');
  modal(d.art,d.n+' построена!','Теперь можно делать товары подороже. '+
    'Не забывай прокачивать цех — уровни дают скорость и слоты!',
    [{t:'Отлично!',f:closeModal}]);
  save();paintAll();layout();
}
function machineDef(m){return MMAP[m.kind];}
function startCook(mi,recIdx){
  var m=P.machines[mi];
  if(!m)return false;
  var d=machineDef(m),r=d.rec[recIdx];
  if(!r)return false;
  if(m.queue.length>=machSlots(d,machLvl(m))){sfx('err');toast('Все слоты заняты');return false;}
  if(!canPay(r.need)){
    sfx('err');
    var miss=[];
    for(var k in r.need){
      var have=P.barn[k]|0;
      if(have<r.need[k])miss.push(itemName(k)+' ×'+(r.need[k]-have));
    }
    toast('Не хватает: '+miss.join(', '));
    return false;
  }
  payNeed(r.need);
  m.queue.push({out:r.out,at:now(),t:r.t,base:r.t,mk:m.kind,xp:r.xp});
  sfx('cook');haptic('light');
  save();paintAll();
  return true;
}
/* реальное время готовки с учётом уровня цеха и эпохи */
function cookTime(q){
  var base=(q.base!=null?q.base:(q.t||1));
  return base*machTimeMul(machLvlKind(q.mk||''))/eraSpeed();
}
function cookReady(q){return (now()-q.at)/1000>=cookTime(q);}
function cookProgress(q){return clamp((now()-q.at)/1000/cookTime(q),0,1);}
function collectCook(mi,qi,silent){
  var m=P.machines[mi];
  if(!m)return false;
  var q=m.queue[qi];
  if(!q||!cookReady(q))return false;
  if(!barnAdd(q.out,1)){
    if(!silent){sfx('err');toast('🏚 Амбар переполнен!');}
    return false;
  }
  m.queue.splice(qi,1);
  qAdd('c',1);
  addXp(Math.round(q.xp*(1+0.25*(machLvl(m)-1))));
  if(!silent){
    sfx('done');haptic('medium');
    toast('✨ Готово: '+itemName(q.out));
  }
  return true;
}
function collectAllCooks(){
  var n=0;
  for(var i=0;i<P.machines.length;i++){
    var m=P.machines[i];
    for(var j=m.queue.length-1;j>=0;j--){
      if(barnFree()<=0)break;
      if(cookReady(m.queue[j])&&collectCook(i,j,true))n++;
    }
  }
  if(n){sfx('done');haptic('medium');toast('✨ Забрано: '+n);save();paintAll();}
  return n;
}
/* ускорить всё производство за рекламу */
function speedUpAll(){
  var any=false;
  P.machines.forEach(function(m){
    m.queue.forEach(function(q){
      if(!cookReady(q)){q.at=now()-cookTime(q)*1000;any=true;}
    });
  });
  P.animals.forEach(function(a){
    if(animalState(a)==='grow'){a.fedAt=now()-AMAP[a.kind].t*penTimeMul(a.kind)*1000;any=true;}

/* ---------- ежедневный подарок ---------- */
function todayKey(){
  var d=new Date();
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function yesterdayKey(){
  var d=new Date(Date.now()-86400000);
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function dailyReady(){return P.dailyDate!==todayKey();}
function takeDaily(){
  if(!dailyReady()){toast('Сегодня уже забирал');return;}
  P.dailyDate=todayKey();P.dailyDone++;
  /* серия входов: каждый день подряд = растущий бонус */
  P.streak=(P.streakDate===yesterdayKey())?(P.streak||0)+1:1;
  P.streakDate=todayKey();
  var sb=Math.round(40*P.streak*eraCoinMult());
  var money=Math.round((60+P.lvl*24)*eraCoinMult()*boostMult())+sb;
  P.coins+=money;P.totalCoins+=money;
  var seeds=Math.min(4,1+Math.floor(P.lvl/3));
  barnAdd('wheat',seeds);
  sfx('done');haptic('medium');
  modal('gift','Ежедневный подарок',
    'Держи <b>'+fmt(money)+'</b> монет<br>и <b>'+seeds+'</b> пшеницы в амбар.'+
    '<br>🔥 День подряд: <b>'+P.streak+'</b> (бонус +'+fmt(sb)+')',
    [{t:'Спасибо!',f:closeModal}]);
  save();paintAll();
}

/* ---------- офлайн-прогресс ----------
   Ничего не «доначисляем» задним числом: всё считается от меток
   времени, поэтому урожай просто оказывается готов. Показываем
   игроку сводку, чтобы возвращаться было приятно. */
function offlineReport(){
  var crops=0,anim=0,cook=0;
  P.plots.forEach(function(p){if(p.crop&&plotState(p)==='ready')crops++;});
  P.animals.forEach(function(a){if(animalState(a)==='ready')anim++;});
  P.machines.forEach(function(m){m.queue.forEach(function(q){if(cookReady(q))cook++;});});
  return {crops:crops,anim:anim,cook:cook,total:crops+anim+cook};
}

function drawWheelCanvas(c,angle){
  var cx=120,cy=120,r=104;
  c.clearRect(0,0,240,240);
  
  c.save();
  c.translate(cx,cy);
  
  /* тень */
  c.fillStyle='rgba(0,0,0,.15)';
  c.beginPath();c.arc(0,4,r+6,0,7);c.fill();
  
  /* золотой обод */
  var rimG=c.createLinearGradient(-r,-r,r,r);
  rimG.addColorStop(0,'#ffd964');rimG.addColorStop(.5,'#c98a28');rimG.addColorStop(1,'#ffe894');
  c.fillStyle=rimG;
  c.beginPath();c.arc(0,0,r+5,0,7);c.fill();
  c.lineWidth=2;c.strokeStyle='#8a520e';c.stroke();

  /* сектора */
  c.rotate(angle);
  var num=WHEEL_SECTORS.length;
  var arc=2*Math.PI/num;
  for(var i=0;i<num;i++){
    var sec=WHEEL_SECTORS[i];
    var a0=i*arc, a1=a0+arc;
    c.fillStyle=sec.col;
    c.beginPath();c.moveTo(0,0);c.arc(0,0,r,a0,a1);c.closePath();c.fill();
    c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=2;c.stroke();
    
    /* текст на секторе */
    c.save();
    c.rotate(a0+arc/2);
    c.textAlign='right';c.textBaseline='middle';
    c.fillStyle='#ffffff';
    c.font='900 12.5px -apple-system,sans-serif';
    c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=3;
    c.fillText(sec.txt, r-12, 0);
    c.restore();
  }
  
  /* центр колеса */
  c.restore();
  c.save();
  c.translate(cx,cy);
  var cg=c.createRadialGradient(0,0,2,0,0,22);
  cg.addColorStop(0,'#ffffff');cg.addColorStop(1,'#e0a020');
  c.fillStyle=cg;c.beginPath();c.arc(0,0,20,0,7);c.fill();
  c.lineWidth=3;c.strokeStyle='#8a520e';c.stroke();
  c.fillStyle='#b87814';c.font='900 14px sans-serif';
  c.textAlign='center';c.textBaseline='middle';
  c.fillText('★',0,1);
  c.restore();
  
  /* стрелка-указатель сверху */
  c.save();
  c.translate(cx, cy-r-2);
  c.fillStyle='#e84118';
  c.beginPath();
  c.moveTo(-10,-8);c.lineTo(10,-8);c.lineTo(0,14);c.closePath();c.fill();
  c.lineWidth=2;c.strokeStyle='#fff';c.stroke();
  c.restore();
}

function startWheelSpin(type){
  if(G.wheel.spinning)return;
  G.wheel.spinning=true;
  if(type==='free')P.wheelDate=now();
  save();
  
  var winIdx=Math.floor(Math.random()*WHEEL_SECTORS.length);
  G.wheel.winIdx=winIdx;
  
  var wcv=$('wcv');
  var num=WHEEL_SECTORS.length;
  var arc=2*Math.PI/num;
  
  var targetRotations=5+Math.floor(Math.random()*3);
  var targetAngle = targetRotations*2*Math.PI + (num - winIdx - 0.5)*arc - Math.PI/2;
  
  var startAngle = G.wheel.angle % (2*Math.PI);
  var totalAngle = targetAngle - startAngle;
  var duration=4.2;
  var startTime=performance.now();
  var lastTickSector=-1;

  var btns=document.querySelectorAll('#wBtns button');
  for(var i=0;i<btns.length;i++)btns[i].disabled=true;

  function animWheel(currTime){
    var elapsed=(currTime-startTime)/1000;
    var pr=Math.min(1,elapsed/duration);
    /* кубическое замедление */
    var ease=1-Math.pow(1-pr,3.5);
    var curAng=startAngle+totalAngle*ease;
    G.wheel.angle=curAng;
    
    if(wcv)drawWheelCanvas(wcv.getContext('2d'),curAng);
    
    /* звук тика стрелки */
    var curSec=Math.floor((curAng/(2*Math.PI))*num)%num;
    if(curSec!==lastTickSector){
      lastTickSector=curSec;
      sfx('tap');haptic('light');
    }

    if(pr<1){
      requestAnimationFrame(animWheel);
    }else{
      G.wheel.spinning=false;
      onWheelFinished(winIdx);
    }
  }
  requestAnimationFrame(animWheel);
}

function onWheelFinished(winIdx){
  var sec=WHEEL_SECTORS[winIdx];

  confettiBurst();
  
  if(sec.type==='coins'){
